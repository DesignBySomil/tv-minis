<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Office Floor - a tiny scene inspired by The Office</title>
<meta name="theme-color" content="#141519">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#141519}
  body{font-family:Georgia,'Times New Roman',serif;color:#eef0f2}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(10,11,14,.44) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#141519;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#9fb4c8;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#2a2e36;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#9fb4c8;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(10,11,14,.95),0 2px 8px rgba(10,11,14,.8),0 4px 22px rgba(10,11,14,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#c8cfd8;margin-top:3px;text-shadow:0 1px 2px rgba(10,11,14,.95),0 2px 6px rgba(10,11,14,.75),0 3px 14px rgba(10,11,14,.5)}
  #era{position:fixed;top:max(18px,env(safe-area-inset-top));right:20px;z-index:4;pointer-events:none;
    font-size:11px;letter-spacing:.24em;color:#bcd2e8;border:1px solid rgba(188,210,232,.35);
    padding:5px 12px;border-radius:99px;background:rgba(20,21,25,.5);backdrop-filter:blur(6px);
    opacity:0;transition:opacity 1.4s ease .8s}
  body.ready #era{opacity:1}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#e8ecf2;background:rgba(20,22,27,.55);border:1px solid rgba(228,236,248,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
    #era{right:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>The Office Floor</h1><p>a tiny scene inspired by The Office</p></div>
<div id="era">DAY</div>
<div id="hint">tap the jello &nbsp;&middot;&nbsp; tap the blinds &nbsp;&middot;&nbsp; tap the copier</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   THE OFFICE FLOOR - a beige little world of desks, blinds,
   a photocopier, a water cooler, and a stapler suspended in
   lemon jello. All procedural, no show assets.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x232a36);
scene.fog = new THREE.FogExp2(0x1a2029, 0.0032);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 0.95, -0.3);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.5, -1.05, -3.3), new THREE.Vector3(4.5, 0.2, 4.1)),
  new THREE.Box3(new THREE.Vector3(-4.3, 0, -3.1), new THREE.Vector3(4.3, 3.6, 3.9)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}

/* shift camera+orbit-target in the screen plane so the projected model
   bounding box lands at viewport centre (small lift for the hint pill) */
function centerProjectedModel(){
  for (let pass = 0; pass < 2; pass++){
    camera.updateMatrixWorld();
    const p = new THREE.Vector3();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const c of FIT_CORNERS){
      p.copy(c).project(camera);
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const dist = camera.position.distanceTo(controls.target);
    const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    const halfW = halfH * camera.aspect;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    controls.target.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    camera.lookAt(controls.target);
  }
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8){ dir.set(0.45, 0.7, 0.56); SAFE.x = 0.965; SAFE.yTop = 0.88; SAFE.yBottom = 0.83; }
  else { dir.set(0.52, 0.48, 0.7); SAFE.x = 0.93; SAFE.yTop = 0.85; SAFE.yBottom = 0.8; }
  dir.normalize();
  let lo = 4, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi*1.03);
  camera.lookAt(controls.target);
  centerProjectedModel();
}
camera.position.set(5.2, 4.6, 7.0);
frameForViewport();

/* ---------- materials ---------- */
const MAT = {
  baseDark:  new THREE.MeshStandardMaterial({ color:0x3a342c, roughness:0.85 }),
  baseMid:   new THREE.MeshStandardMaterial({ color:0x554c3e, roughness:0.85 }),
  carpet:    new THREE.MeshStandardMaterial({ color:0x8d8168, roughness:0.98 }),
  carpetIn:  new THREE.MeshStandardMaterial({ color:0x7c715a, roughness:0.98 }),
  wall:      new THREE.MeshStandardMaterial({ color:0xb8ad96, roughness:0.95 }),
  wallTrim:  new THREE.MeshStandardMaterial({ color:0x6e6250, roughness:0.9 }),
  deskTop:   new THREE.MeshStandardMaterial({ color:0x9a7a52, roughness:0.6, metalness:0.05 }),
  deskSide:  new THREE.MeshStandardMaterial({ color:0x6f7d85, roughness:0.8, metalness:0.15 }),
  partition: new THREE.MeshStandardMaterial({ color:0x83908f, roughness:0.98 }),
  plasticB:  new THREE.MeshStandardMaterial({ color:0x2b2e33, roughness:0.5, metalness:0.2 }),
  plasticG:  new THREE.MeshStandardMaterial({ color:0x8b9096, roughness:0.6, metalness:0.1 }),
  metal:     new THREE.MeshStandardMaterial({ color:0x9aa2a8, roughness:0.35, metalness:0.8 }),
  paper:     new THREE.MeshStandardMaterial({ color:0xf2efe6, roughness:0.9 }),
  mugRed:    new THREE.MeshStandardMaterial({ color:0xa8322a, roughness:0.4 }),
  mugWhite:  new THREE.MeshStandardMaterial({ color:0xe8e4da, roughness:0.4 }),
  plantGrn:  new THREE.MeshStandardMaterial({ color:0x4a6e3a, roughness:0.9 }),
  potTerr:   new THREE.MeshStandardMaterial({ color:0x9a5a38, roughness:0.8 }),
  chairFab:  new THREE.MeshStandardMaterial({ color:0x3c454e, roughness:0.95 }),
  jello:     new THREE.MeshStandardMaterial({ color:0xe89a20, roughness:0.2, metalness:0.05, transparent:true, opacity:0.84, emissive:0x8a4f0a, emissiveIntensity:0.45 }),
  stapler:   new THREE.MeshStandardMaterial({ color:0x22252a, roughness:0.4, metalness:0.5 }),
  copier:    new THREE.MeshStandardMaterial({ color:0xd6d2c8, roughness:0.55, metalness:0.1 }),
  copierDk:  new THREE.MeshStandardMaterial({ color:0x4a4d52, roughness:0.6 }),
  cooler:    new THREE.MeshStandardMaterial({ color:0xe2ded4, roughness:0.5 }),
  water:     new THREE.MeshStandardMaterial({ color:0x7ab8d8, roughness:0.15, transparent:true, opacity:0.7 }),
  blind:     new THREE.MeshStandardMaterial({ color:0xdcd6c6, roughness:0.85 }),
  door:      new THREE.MeshStandardMaterial({ color:0x7a5c3a, roughness:0.7 }),
};

function box(w,h,d,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function rbox(w,h,d,r,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=14,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function sph(r,mat,x,y,z,parent=scene,ws=12,hs=10){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

/* ---------- base + carpet ---------- */
const base = new THREE.Group(); scene.add(base);
box(9.6, 0.5, 8.2, MAT.baseDark, 0, -0.75, 0.4, 0, base);
box(9.0, 0.35, 7.6, MAT.baseMid,  0, -0.33, 0.4, 0, base);
box(8.6, 0.12, 7.2, MAT.carpet, 0, -0.06, 0.4, 0, base);
/* carpet inlay border */
box(7.6, 0.13, 6.2, MAT.carpetIn, 0, -0.055, 0.4, 0, base);
box(7.2, 0.14, 5.8, MAT.carpet, 0, -0.05, 0.4, 0, base);
/* carpet seams */
for (let i=0;i<3;i++) box(0.03, 0.145, 5.8, MAT.carpetIn, -2.4+i*2.4, -0.05, 0.4, 0, base);
for (let i=0;i<2;i++) box(7.2, 0.145, 0.03, MAT.carpetIn, 0, -0.05, -1.03+i*2.6, 0, base);

/* ---------- walls (cutaway: back + left) ---------- */
const WALL_H = 3.2;
box(9.0, WALL_H, 0.35, MAT.wall, 0, WALL_H/2, -3.05, 0, base);
box(0.35, WALL_H, 7.6, MAT.wall, -4.32, WALL_H/2, 0.4, 0, base);
/* unlit dark caps so wall tops never read as lit slivers */
const capMat = new THREE.MeshBasicMaterial({ color:0x4a4438 });
const cap1 = new THREE.Mesh(new THREE.BoxGeometry(9.0,0.06,0.37), capMat); cap1.position.set(0,WALL_H+0.03,-3.05); base.add(cap1);
const cap2 = new THREE.Mesh(new THREE.BoxGeometry(0.37,0.06,7.6), capMat); cap2.position.set(-4.32,WALL_H+0.03,0.4); base.add(cap2);
/* baseboards */
box(8.9, 0.18, 0.06, MAT.wallTrim, 0, 0.09, -2.86, 0, base);
box(0.06, 0.18, 7.5, MAT.wallTrim, -4.13, 0.09, 0.4, 0, base);

/* ---------- windows + blinds on back wall ---------- */
const WIN_Y = 2.0, WIN_W = 1.5, WIN_H = 1.5;
const winXs = [-2.6, 0, 2.6];
const paneMats = [];
const blindGroups = [];
for (const wx of winXs){
  /* dark reveal */
  box(WIN_W+0.16, WIN_H+0.16, 0.1, MAT.wallTrim, wx, WIN_Y, -2.92, 0, base);
  /* sky pane (unlit, lerped day/night) */
  const pm = new THREE.MeshBasicMaterial({ color:0xcfe0ee });
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(WIN_W, WIN_H), pm);
  pane.position.set(wx, WIN_Y, -3.2); base.add(pane); paneMats.push(pm);
  /* window frame cross */
  box(WIN_W+0.1, 0.08, 0.06, MAT.blind, wx, WIN_Y, -2.9, 0, base);
  box(0.08, WIN_H+0.1, 0.06, MAT.blind, wx, WIN_Y, -2.9, 0, base);
  /* blind slats */
  const bg = new THREE.Group(); bg.position.set(wx, WIN_Y+WIN_H/2-0.08, -2.82); base.add(bg);
  for (let i=0;i<8;i++){
    const slat = box(WIN_W-0.06, 0.02, 0.09, MAT.blind, 0, -i*0.185, 0, 0, bg);
    slat.castShadow = false;
  }
  blindGroups.push(bg);
  /* valance */
  box(WIN_W+0.2, 0.12, 0.14, MAT.wallTrim, wx, WIN_Y+WIN_H/2+0.1, -2.84, 0, base);
}
/* framed certificate on left wall (no text) */
box(0.06, 0.9, 0.7, MAT.wallTrim, -4.12, 1.9, -1.2, 0, base);
box(0.04, 0.74, 0.54, MAT.paper, -4.09, 1.9, -1.2, 0, base);
/* door on left wall */
box(0.14, 2.2, 1.1, MAT.wallTrim, -4.2, 1.1, 1.6, 0, base);
box(0.1, 2.05, 0.92, MAT.door, -4.14, 1.03, 1.6, 0, base);
sph(0.05, MAT.metal, -4.06, 1.05, 1.95, base);
/* green exit glow above door, no text */
const exitMat = new THREE.MeshBasicMaterial({ color:0x3aff7a });
const exitBox = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.18,0.5), exitMat);
exitBox.position.set(-4.1, 2.45, 1.6); base.add(exitBox);

/* ---------- desk pod: 2x2 desks with partition cross ---------- */
const DESK_H = 0.74;
function desk(x, z, ry){
  const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = ry; base.add(g);
  box(1.5, 0.06, 0.75, MAT.deskTop, 0, DESK_H, 0, 0, g);
  box(1.44, 0.5, 0.05, MAT.deskSide, 0, DESK_H-0.31, -0.32, 0, g);
  box(0.05, DESK_H, 0.7, MAT.deskSide, -0.7, DESK_H/2, 0, 0, g);
  box(0.05, DESK_H, 0.7, MAT.deskSide, 0.7, DESK_H/2, 0, 0, g);
  return g;
}
const POD_X = 0.7, POD_Z = 0.5;
const deskA = desk(POD_X-0.85, POD_Z-0.55, 0);          // back-left, faces front
const deskB = desk(POD_X+0.85, POD_Z-0.55, 0);          // back-right
const deskC = desk(POD_X-0.85, POD_Z+0.75, Math.PI);    // front-left, faces back
const deskD = desk(POD_X+0.85, POD_Z+0.75, Math.PI);    // front-right
/* partition cross */
box(3.4, 0.55, 0.07, MAT.partition, POD_X, DESK_H+0.28, POD_Z+0.1, 0, base);
box(0.07, 0.55, 1.9, MAT.partition, POD_X, DESK_H+0.28, POD_Z+0.1, 0, base);

/* monitor with screen plane */
const screenMats = [];
function monitor(g, x, z, on){
  // shell with a proud bezel around an inset screen, neck + foot, power LED
  box(0.52, 0.36, 0.045, MAT.plasticB, x, DESK_H+0.32, z, 0, g);
  const sm = new THREE.MeshBasicMaterial({ color: on ? 0x7ab8e8 : 0x1a1d22 });
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.26), sm);
  scr.position.set(x, DESK_H+0.325, z+0.024); g.add(scr); screenMats.push({m:sm, on});
  // bezel lips
  box(0.47, 0.022, 0.02, MAT.plasticG, x, DESK_H+0.468, z+0.024, 0, g);
  box(0.47, 0.03, 0.02, MAT.plasticG, x, DESK_H+0.185, z+0.024, 0, g);
  box(0.022, 0.27, 0.02, MAT.plasticG, x-0.232, DESK_H+0.325, z+0.024, 0, g);
  box(0.022, 0.27, 0.02, MAT.plasticG, x+0.232, DESK_H+0.325, z+0.024, 0, g);
  // power LED bottom-right of bezel
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.012, 0.008),
    new THREE.MeshBasicMaterial({ color: on ? 0x6fe08a : 0x27211a }));
  led.position.set(x+0.19, DESK_H+0.185, z+0.036); g.add(led);
  if (on){
    // faint document rows on the screen so it reads as working, not blank glow
    for (let li=0; li<3; li++){
      const row = new THREE.Mesh(new THREE.PlaneGeometry(0.3 - li*0.05, 0.018),
        new THREE.MeshBasicMaterial({ color:0xbfe4ff, transparent:true, opacity:0.75 }));
      row.position.set(x-0.02, DESK_H+0.385 - li*0.055, z+0.028); g.add(row);
    }
  }
  box(0.08, 0.12, 0.05, MAT.plasticB, x, DESK_H+0.1, z, 0, g);
  box(0.24, 0.02, 0.16, MAT.plasticB, x, DESK_H+0.04, z, 0, g);
}
function keyboard(g, x, z){
  const kb = box(0.4, 0.025, 0.14, MAT.plasticG, x, DESK_H+0.045, z, 0, g);
  kb.rotation.x = -0.06;
  box(0.36, 0.012, 0.1, MAT.plasticB, x, DESK_H+0.055, z, 0, g);
}
function mug(g, x, z, mat){
  cyl(0.045, 0.04, 0.1, mat, x, DESK_H+0.08, z, 10, g);
  const h = box(0.015, 0.05, 0.05, mat, x+0.055, DESK_H+0.08, z, 0, g);
}
function phone(g, x, z){
  box(0.16, 0.04, 0.22, MAT.plasticB, x, DESK_H+0.05, z, 0.3, g);
  rbox(0.05, 0.03, 0.18, 0.01, MAT.plasticB, x, DESK_H+0.085, z, 0.3, g);
}
const noteMat = new THREE.MeshStandardMaterial({ color:0xe8d44a, roughness:0.9 });
function papers(g, x, z, ry){
  box(0.24, 0.015, 0.32, MAT.paper, x, DESK_H+0.04, z, ry, g);
  box(0.22, 0.015, 0.3, MAT.paper, x+0.02, DESK_H+0.055, z+0.01, ry+0.2, g);
  const pen = cyl(0.008, 0.008, 0.14, MAT.stapler, x-0.06, DESK_H+0.07, z+0.04, 6, g);
  pen.rotation.z = Math.PI/2; pen.rotation.y = ry+0.5;
  box(0.05, 0.004, 0.05, noteMat, x+0.05, DESK_H+0.065, z-0.03, ry-0.3, g);
}
monitor(deskA, 0, -0.18, true);  keyboard(deskA, 0, 0.12); mug(deskA, -0.5, 0.1, MAT.mugRed); phone(deskA, 0.5, -0.1);
monitor(deskB, 0, -0.18, true);  papers(deskB, -0.4, 0.05, 0.15); keyboard(deskB, 0.1, 0.12);
monitor(deskC, 0, -0.18, false); keyboard(deskC, 0, 0.12);
/* open inbox tray: base, back + side walls, paper stack inside */
box(0.3, 0.015, 0.24, MAT.plasticG, 0.45, DESK_H+0.045, -0.05, 0, deskC);

  const now = performance.now();
  if (now - lastUp < 150) return;
  if (now - downT > 350) return;
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 8) return;
  lastUp = now;
  ptr.x = (e.clientX/innerWidth)*2-1;
  ptr.y = -(e.clientY/innerHeight)*2+1;

});

/* ---------- tick ---------- */
const clock = new THREE.Clock();
let t = 0;
const daySky = new THREE.Color(0x232a36);
const nightSky = new THREE.Color(0x14161c);
const dayFogC = new THREE.Color(0x1a2029);
const nightFogC = new THREE.Color(0x101216);
const dayWin = new THREE.Color(0xd8e4f0);
const nightWin = new THREE.Color(0x6a7ea0);
const dayPane = new THREE.Color(0xcfe0ee);
const nightPane = new THREE.Color(0x1c2838);
const dayHemi = new THREE.Color(0xbcc8d8);
const nightHemi = new THREE.Color(0x5a6680);
const tmpC = new THREE.Color();

function tick(){
  requestAnimationFrame(tick);
  const rawDt = Math.min(clock.getDelta(), 1.0);
  const dt = Math.min(rawDt, 0.05);
  t += rawDt;

  /* blends on real elapsed time so states settle under throttled rAF */
  dayBlend += (dayTarget - dayBlend) * Math.min(1, rawDt*2.2);

  /* day/night */
  scene.background = tmpC.copy(nightSky).lerp(daySky, dayBlend).clone();
  scene.fog.color.copy(nightFogC).lerp(dayFogC, dayBlend);
  windowLight.color.copy(nightWin).lerp(dayWin, dayBlend);
  windowLight.intensity = 0.12 + dayBlend*2.0;
  hemi.color.copy(nightHemi).lerp(dayHemi, dayBlend);
  hemi.intensity = 0.55 + dayBlend*0.6;
  fillLight.intensity = 0.28 + dayBlend*0.24;
  for (const pm of paneMats) pm.color.copy(nightPane).lerp(dayPane, dayBlend);
  /* blinds open by day */
  const slatRot = 1.35 - dayBlend*1.1;
  for (const bg of blindGroups)
    for (const slat of bg.children) slat.rotation.x = slatRot;
  /* desk lamps + monitors at night */
  const nightK = 1 - dayBlend;
  const flick = 1 + Math.sin(t*7.3)*0.06;
  lampLight1.intensity = nightK * 1.3 * flick;
  lampLight2.intensity = nightK * 1.3 * (1 + Math.sin(t*8.1+2)*0.06);
  lampBulb1.color.setHex(nightK > 0.4 ? 0xffd9a0 : 0x5a5348);
  lampBulb2.color.setHex(nightK > 0.4 ? 0xffd9a0 : 0x5a5348);
  for (const s of screenMats) s.m.color.setHex(s.on ? (nightK > 0.4 ? 0x8ec8ff : 0x7ab8e8) : 0x1a1d22);
  exitMat.color.setHex(0x3aff7a);

  /* jello wobble: squash/stretch scale + tilt, anchored at base */
  if (wobbleT < 3.4){
    wobbleT += Math.min(rawDt, 0.12);
    const decay = Math.exp(-wobbleT*0.55);
    const sq = Math.sin(wobbleT*9) * 0.55 * decay;
    const sy = Math.max(0.42, 1 - sq);
    jello.scale.set(1+sq*0.8, sy, 1+sq*0.8);
    jello.position.y = 0.15*sy;
    stapTop.rotation.z = 0.1 + Math.sin(wobbleT*8+0.6) * 0.5 * decay;
    jelloG.rotation.z = Math.sin(wobbleT*9+0.5) * 0.22 * decay;
  } else {
    jello.scale.set(1,1,1); jello.position.y = 0.15;
    stapTop.rotation.z = 0.1; jelloG.rotation.z = 0;
  }

  /* copier scan + paper */
  if (scanT < 1.3){
    scanT += rawDt;
    const k = Math.min(1, scanT/1.1);
    scanBar.position.x = -0.3 + k*0.6;
    scanMat.opacity = scanT < 1.1 ? 0.85 : Math.max(0, 0.85-(scanT-1.1)*4);
    copierLight.intensity = scanT < 1.1 ? 0.9 : Math.max(0, 0.9-(scanT-1.1)*4);
    copierLight.position.set(COP_X + (-0.3+k*0.6)*Math.cos(-0.35), 1.0, COP_Z - (-0.3+k*0.6)*Math.sin(-0.35));
    if (scanT >= 1.05 && paperT > 90){ paperT = 0; outPaper.visible = true; outPaper.position.set(0, 0.62, 0.3); }
  } else {
    scanMat.opacity = 0; copierLight.intensity = 0;
  }
  if (paperT < 1){
    paperT += rawDt;
    const k = Math.min(1, paperT/0.5);
    outPaper.position.z = 0.3 + k*0.22;
    outPaper.position.y = 0.62 + k*0.02;
  }
  copLEDMat.color.setHex(Math.sin(t*2.4) > 0 ? 0x3aff7a : 0x1a8a4a);

  controls.update();
  renderer.render(scene, camera);
}

})();

  function filt(type, f, q){ const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gn(v){ const n = ctx.createGain(); n.gain.value = v; return n; }
  function lfo(freq, amt, param){ const o = ctx.createOscillator(); o.frequency.value = freq; const lg = gn(amt); o.connect(lg); lg.connect(param); o.start(); }
  function hum(f, v){ const o = ctx.createOscillator(); o.frequency.value = f; const g2 = gn(v); o.connect(g2); g2.connect(master); o.start(); }
  function every(minS, maxS, fn){ (function loop(){ if (ctx) fn(); setTimeout(loop, (minS + Math.random() * (maxS - minS)) * 1000); })(); }
  function ping(type, f0, f1, dur, vol){
    const o = ctx.createOscillator(); o.type = type; const g2 = gn(0);
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    o.connect(g2); g2.connect(master);
    g2.gain.setValueAtTime(0, ctx.currentTime);
    g2.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  function shot(dur){
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    const g2 = gn(0); s.connect(g2);
    s.start(); s.stop(ctx.currentTime + dur);
    return g2;
  }
  function echo(dt, fbv, wetv){
    const dl = ctx.createDelay(1); dl.delayTime.value = dt;
    const fb = gn(fbv); dl.connect(fb); fb.connect(dl);
    const wet = gn(wetv); dl.connect(wet); wet.connect(master);
    return dl;
  }

  const R = {
    wind(){ const bp = filt("bandpass", 480, 0.5), g2 = gn(0.09); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.07, 0.045, g2.gain); lfo(0.13, 170, bp.frequency); },
    coldwind(){ const bp = filt("bandpass", 830, 0.7), g2 = gn(0.065); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.09, 0.04, g2.gain); lfo(0.21, 250, bp.frequency); hum(52, 0.026); },
    crackle(){ every(0.05, 0.3, () => { const hp = filt("highpass", 1900), g2 = shot(0.05); g2.connect(hp); hp.connect(master); g2.gain.setValueAtTime(0.015 + Math.random() * 0.045, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.05); }); hum(62, 0.011); },
    murmur(){ const bp = filt("bandpass", 380, 1.1), g2 = gn(0.045); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); every(0.8, 2.4, () => bp.frequency.setTargetAtTime(250 + Math.random() * 380, ctx.currentTime, 0.4)); },
    clink(){ every(4, 9, () => ping("sine", 2000 + Math.random() * 400, 0, 0.16, 0.028)); },
    room(){ const lp = filt("lowpass", 220), g2 = gn(0.02); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); hum(58, 0.009); },
    hum(){ hum(120, 0.011); hum(240, 0.005); const bp = filt("bandpass", 1150, 3), g2 = gn(0.004); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); },
    humsoft(){ hum(100, 0.007); },
    plink(){ const dl = echo(0.42, 0.3, 0.4); every(4.5, 9, () => { const f = [660, 587, 494, 440, 392][Math.floor(Math.random() * 5)]; const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; const g2 = gn(0); o.connect(g2); g2.connect(master); g2.connect(dl); g2.gain.setValueAtTime(0.04, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 1.4); o.start(); o.stop(ctx.currentTime + 1.5); }); },
    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 3.5, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
    const hp = filt("highpass", 2600), g2 = shot(0.02);
    g2.connect(hp); hp.connect(master);
    g2.gain.setValueAtTime(0.05, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.02);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
</script>
