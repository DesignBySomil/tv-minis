<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Apartment 4A — Inspired by The Big Bang Theory</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e1019;
      background-image: radial-gradient(circle at 50% 42%, #1d2336 0%, #0d1018 74%, #07090e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f4ece1;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    /* Safe HUD Layout with strict top/bottom bands */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px 12px;
    }
    .header-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    }
    h1.title {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(1.35rem, 3.8vw, 1.95rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #ffeed6;
      line-height: 1.1;
    }
    p.subtitle {
      font-size: clamp(0.75rem, 2.2vw, 0.9rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #b7c3db;
      line-height: 1.2;
    }
    .hint-pill {
      margin-top: 4px;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(18, 23, 36, 0.78);
      border: 1px solid rgba(255, 206, 138, 0.28);
      color: #ffd79b;
      font-size: clamp(0.68rem, 2vw, 0.8rem);
      letter-spacing: 0.04em;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      transition: border-color 0.3s ease, color 0.3s ease;
    }
    .footer-box {
      text-align: center;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: clamp(0.72rem, 2vw, 0.84rem);
      font-style: italic;
      letter-spacing: 0.08em;
      color: rgba(235, 224, 208, 0.65);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }
    /* Floating locally-anchored labels clamped strictly inside safe zone */
    .floating-label {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      pointer-events: none;
      z-index: 8;
      padding: 5px 11px;
      border-radius: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: clamp(0.76rem, 2.2vw, 0.9rem);
      letter-spacing: 0.03em;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.18s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
    }
    #spot-label {
      background: rgba(26, 20, 14, 0.9);
      border: 1.5px solid #ffbe55;
      color: #ffdf9e;
    }
    #knock-label {
      background: rgba(24, 18, 12, 0.9);
      border: 1.5px solid #ffa94d;
      color: #ffd096;
      font-style: italic;
    }
    #fallback-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #10131d;
      color: #f2e8dc;
      padding: 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: sans-serif;
    }
    #fallback-msg .card {
      max-width: 400px;
      background: #1a2030;
      border: 1px solid #394564;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="header-box" id="hud-header">
      <h1 class="title">Apartment 4A</h1>
      <p class="subtitle">inspired by The Big Bang Theory</p>
      <div class="hint-pill">tap the couch spot &middot; tap 4A door</div>
    </div>
    <div class="footer-box" id="hud-footer">A tiny world</div>
  </div>

  <div id="spot-label" class="floating-label">My spot</div>
  <div id="knock-label" class="floating-label">knock knock knock</div>

  <div id="fallback-msg">
    <div class="card">
      <h2 style="margin-bottom:8px;color:#ffd599;">WebGL Required</h2>
      <p style="font-size:0.9rem;line-height:1.4;color:#c5cee0;">
        Unable to initialize the 3D miniature of Apartment 4A. Please ensure hardware acceleration and WebGL are enabled in your browser.
      </p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261102)
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261102);
    const randRange = (min, max) => min + rand() * (max - min);

    const container = document.getElementById('canvas-container');
    const spotLabelEl = document.getElementById('spot-label');
    const knockLabelEl = document.getElementById('knock-label');
    const hudHeaderEl = document.getElementById('hud-header');
    const hudFooterEl = document.getElementById('hud-footer');
    const fallbackEl = document.getElementById('fallback-msg');

    let renderer, scene, camera, controls;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    const maxDPR = Math.min(window.devicePixelRatio || 1, 1.85);
    renderer.setPixelRatio(maxDPR);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x111522, 0.022);

    camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 80);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minPolarAngle = 0.52;
    controls.maxPolarAngle = 1.38;
    controls.minAzimuthAngle = -0.38;
    controls.maxAzimuthAngle = 1.25;

    const dioramaRoot = new THREE.Group();
    scene.add(dioramaRoot);

    // Procedural Canvas Textures
    function createRugTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b2f23';
      ctx.fillRect(0, 0, 512, 512);

      // Warm geometric concentric borders & medallions
      const borders = [
        { pad: 18, color: '#d7a85b', w: 8 },
        { pad: 34, color: '#2b4257', w: 14 },
        { pad: 56, color: '#e6caa0', w: 6 },
        { pad: 74, color: '#5c1d18', w: 10 }
      ];
      borders.forEach(b => {
        ctx.strokeStyle = b.color;
        ctx.lineWidth = b.w;
        ctx.strokeRect(b.pad, b.pad, 512 - b.pad * 2, 512 - b.pad * 2);
      });

      // Repeating diamond motifs
      for (let y = 96; y <= 416; y += 64) {
        for (let x = 96; x <= 416; x += 64) {
          ctx.fillStyle = ((x + y) / 64) % 2 === 0 ? '#d89b48' : '#2d4c63';
          ctx.beginPath();
          ctx.moveTo(x, y - 22);
          ctx.lineTo(x + 22, y);
          ctx.lineTo(x, y + 22);
          ctx.lineTo(x - 22, y);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#f2dec0';
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // Subtle woven grain
      ctx.fillStyle = 'rgba(255,240,210,0.04)';
      for (let i = 0; i < 1200; i++) {
        ctx.fillRect(Math.floor(rand() * 512), Math.floor(rand() * 512), 2, 2);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function createWhiteboardTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 384;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f5f7fa';
      ctx.fillRect(0, 0, 512, 384);

      // Subtle dry-erase smudge
      const grad = ctx.createRadialGradient(256, 192, 30, 256, 192, 240);
      grad.addColorStop(0, 'rgba(210,220,235,0.25)');
      grad.addColorStop(1, 'rgba(245,247,250,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 384);

      ctx.strokeStyle = '#1d3557';
      ctx.fillStyle = '#1d3557';
      ctx.lineWidth = 3;
      ctx.font = 'bold 20px Georgia, serif';
      ctx.fillText('H|\u03C8\u27E9 = E|\u03C8\u27E9', 26, 42);
      ctx.font = 'italic 17px Georgia, serif';
      ctx.fillText('ds\u00B2 = -(1 - 2GM/r)dt\u00B2 + dr\u00B2/(1 - 2GM/r)', 26, 74);
      ctx.fillText('\u2211 L_\u03BC\u03BD = \u2202_\u03BC A_\u03BD - \u2202_\u03BD A_\u03BC', 26, 106);

      // Feynman-like diagram
      ctx.strokeStyle = '#b8292f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(40, 150);
      ctx.lineTo(110, 190);
      ctx.moveTo(40, 230);
      ctx.lineTo(110, 190);
      ctx.stroke();

      // Wavy propagator
      ctx.strokeStyle = '#1f6f8b';
      ctx.beginPath();
      for (let x = 110; x <= 210; x += 5) {
        const y = 190 + Math.sin((x - 110) * 0.25) * 9;
        if (x === 110) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.strokeStyle = '#b8292f';
      ctx.beginPath();
      ctx.moveTo(210, 190);
      ctx.lineTo(275, 150);
      ctx.moveTo(210, 190);
      ctx.lineTo(275, 230);
      ctx.stroke();

      // Geometric orbital rings & vectors on right side
      ctx.strokeStyle = '#264653';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(390, 135, 75, 36, 0.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(390, 135, 75, 36, -0.45, 0, Math.PI * 2);
      ctx.stroke();

      // Sine wave plot bottom
      ctx.strokeStyle = '#2a9d8f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(35, 320);
      ctx.lineTo(470, 320);
      ctx.stroke();

      ctx.strokeStyle = '#e76f51';
      ctx.beginPath();
      for (let x = 40; x < 460; x += 4) {
        const env = Math.exp(-Math.pow((x - 250) / 110, 2));
        const y = 320 - Math.cos((x - 250) * 0.14) * 44 * env;
        if (x === 40) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createDoorPlaqueTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d8a648';
      ctx.fillRect(0, 0, 256, 128);
      ctx.strokeStyle = '#704e14';
      ctx.lineWidth = 8;
      ctx.strokeRect(8, 8, 240, 112);
      ctx.fillStyle = '#1f1608';
      ctx.font = 'bold 82px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('4A', 128, 68);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createCautionTapeTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f4c41c';
      ctx.fillRect(0, 0, 512, 64);
      ctx.fillStyle = '#181818';
      for (let x = -64; x < 576; x += 64) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 30, 0);
        ctx.lineTo(x + 6, 64);
        ctx.lineTo(x - 24, 64);
        ctx.closePath();
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createWoodFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#7d5233';
      ctx.fillRect(0, 0, 512, 512);
      const rows = 16;
      const rowH = 512 / rows;
      for (let r = 0; r < rows; r++) {
        const y = r * rowH;
        const offset = (r % 2) * 128;
        for (let x = -128; x < 512; x += 128) {
          const shade = Math.floor(randRange(-12, 12));
          ctx.fillStyle = `rgb(${125 + shade}, ${82 + Math.floor(shade * 0.7)}, ${51 + Math.floor(shade * 0.5)})`;
          ctx.fillRect(x + offset, y, 126, rowH - 2);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createMonitorTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 192;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0d2238';
      ctx.fillRect(0, 0, 256, 192);
      ctx.fillStyle = '#48cae4';
      for (let y = 20; y < 140; y += 14) {
        const w = 40 + ((y * 17) % 140);
        ctx.fillRect(20, y, w, 6);
      }
      ctx.strokeStyle = '#90e0ef';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(195, 115, 32, 0, Math.PI * 2);
      ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Shared Materials
    const mats = {
      baseOuter: new THREE.MeshStandardMaterial({ color: 0x261c16, roughness: 0.55, metalness: 0.08 }),
      baseTrim: new THREE.MeshStandardMaterial({ color: 0x9b7442, roughness: 0.35, metalness: 0.45 }),
      floorWood: new THREE.MeshStandardMaterial({ map: createWoodFloorTexture(), roughness: 0.62 }),
      hallFloor: new THREE.MeshStandardMaterial({ color: 0x5c5750, roughness: 0.75 }),
      wallCream: new THREE.MeshStandardMaterial({ color: 0xd9ccb8, roughness: 0.82 }),
      wallHall: new THREE.MeshStandardMaterial({ color: 0xbcae99, roughness: 0.85 }),
      wallCap: new THREE.MeshStandardMaterial({ color: 0x4a372a, roughness: 0.5 }),
      wainscot: new THREE.MeshStandardMaterial({ color: 0x8a6647, roughness: 0.65 }),
      woodFurniture: new THREE.MeshStandardMaterial({ color: 0x5d3a22, roughness: 0.58 }),
      woodDark: new THREE.MeshStandardMaterial({ color: 0x3b2313, roughness: 0.52 }),
      leatherMain: new THREE.MeshStandardMaterial({ color: 0x6b3a20, roughness: 0.46, metalness: 0.05 }),
      leatherSeat: new THREE.MeshStandardMaterial({ color: 0x7a4326, roughness: 0.42, metalness: 0.05 }),
      leatherSpot: new THREE.MeshStandardMaterial({
        color: 0x84492a,
        roughness: 0.38,
        metalness: 0.05,
        emissive: new THREE.Color(0xff9d2e),
        emissiveIntensity: 0.0
      }),
      pillowRed: new THREE.MeshStandardMaterial({ color: 0xc83e2b, roughness: 0.72 }),
      pillowGold: new THREE.MeshStandardMaterial({ color: 0xe09f3e, roughness: 0.72 }),
      doorGreen: new THREE.MeshStandardMaterial({
        color: 0x365b45,
        roughness: 0.55,
        emissive: new THREE.Color(0xff9f38),
        emissiveIntensity: 0.0
      }),
      elevatorMetal: new THREE.MeshStandardMaterial({ color: 0x6f7782, roughness: 0.4, metalness: 0.55 }),
      elevatorDark: new THREE.MeshStandardMaterial({ color: 0x2c3038, roughness: 0.6, metalness: 0.3 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xd8a84c, roughness: 0.28, metalness: 0.78 }),
      metalSilver: new THREE.MeshStandardMaterial({ color: 0xb8c0c8, roughness: 0.3, metalness: 0.7 }),
      ceramicWhite: new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.25 }),
      takeoutRed: new THREE.MeshStandardMaterial({ color: 0xc93b2b, roughness: 0.5 }),
      mugBlue: new THREE.MeshStandardMaterial({ color: 0x2b5c8f, roughness: 0.3 }),
      mugOrange: new THREE.MeshStandardMaterial({ color: 0xd96b27, roughness: 0.3 }),
      lampShade: new THREE.MeshStandardMaterial({
        color: 0xffe3b3,
        roughness: 0.4,
        emissive: new THREE.Color(0xffae42),
        emissiveIntensity: 0.85
      }),
      windowGlow: new THREE.MeshBasicMaterial({ color: 0x5688c7 }),
      blinds: new THREE.MeshStandardMaterial({ color: 0xdce3ec, roughness: 0.6 }),
      monitorCase: new THREE.MeshStandardMaterial({ color: 0x999487, roughness: 0.65 }),
      monitorScreen: new THREE.MeshStandardMaterial({
        map: createMonitorTexture(),
        roughness: 0.2,
        emissive: new THREE.Color(0x3a96dd),
        emissiveIntensity: 0.75
      }),
      rug: new THREE.MeshStandardMaterial({ map: createRugTexture(), roughness: 0.88 }),
      whiteboard: new THREE.MeshStandardMaterial({ map: createWhiteboardTexture(), roughness: 0.35 }),
      plaque4A: new THREE.MeshStandardMaterial({ map: createDoorPlaqueTexture(), roughness: 0.3, metalness: 0.4 }),
      cautionTape: new THREE.MeshStandardMaterial({
        map: createCautionTapeTexture(),
        roughness: 0.5,
        emissive: new THREE.Color(0x554000),
        emissiveIntensity: 0.18
      })
    };

    // Helper for rounded display base
    function createRoundedBase(w, d, h, r) {
      const shape = new THREE.Shape();
      const hw = w / 2, hd = d / 2;
      shape.moveTo(-hw + r, -hd);
      shape.lineTo(hw - r, -hd);
      shape.quadraticCurveTo(hw, -hd, hw, -hd + r);
      shape.lineTo(hw, hd - r);
      shape.quadraticCurveTo(hw, hd, hw - r, hd);
      shape.lineTo(-hw + r, hd);
      shape.quadraticCurveTo(-hw, hd, -hw, hd - r);
      shape.lineTo(-hw, -hd + r);
      shape.quadraticCurveTo(-hw, -hd, -hw + r, -hd);

      const extrude = new THREE.ExtrudeGeometry(shape, {
        depth: h,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.08,
        bevelThickness: 0.08
      });
      extrude.rotateX(Math.PI / 2);
      return extrude;
    }

    // 1. Thick Rounded Display Base & Floors
    const baseGroup = new THREE.Group();
    dioramaRoot.add(baseGroup);

    const plinthGeo = createRoundedBase(7.6, 5.9, 0.52, 0.45);
    const plinthMesh = new THREE.Mesh(plinthGeo, mats.baseOuter);
    plinthMesh.position.y = 0;
    plinthMesh.receiveShadow = true;
    baseGroup.add(plinthMesh);

    const brassRimGeo = createRoundedBase(7.42, 5.72, 0.06, 0.42);
    const brassRim = new THREE.Mesh(brassRimGeo, mats.baseTrim);
    brassRim.position.y = 0.03;
    baseGroup.add(brassRim);

    // Living room wood floor
    const livingFloor = new THREE.Mesh(new THREE.BoxGeometry(5.15, 0.08, 5.35), mats.floorWood);
    livingFloor.position.set(-0.98, 0.04, 0);
    livingFloor.receiveShadow = true;
    baseGroup.add(livingFloor);

    // Hallway foyer stone floor
    const hallFloor = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.08, 5.35), mats.hallFloor);
    hallFloor.position.set(2.57, 0.04, 0);
    hallFloor.receiveShadow = true;
    baseGroup.add(hallFloor);

    // 2. Cutaway Walls & Architectural Trim
    const wallGroup = new THREE.Group();
    dioramaRoot.add(wallGroup);

    const wallH = 3.65;
    const wallY = 0.08 + wallH / 2;

    // Back wall (North, z = -2.62)
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(7.1, wallH, 0.18), mats.wallCream);
    backWall.position.set(0.0, wallY, -2.62);
    backWall.castShadow = true;
    backWall.receiveShadow = true;
    wallGroup.add(backWall);

    // Back wall top cap
    const backCap = new THREE.Mesh(new THREE.BoxGeometry(7.14, 0.09, 0.22), mats.wallCap);
    backCap.position.set(0.0, 0.08 + wallH + 0.04, -2.62);
    wallGroup.add(backCap);

    // Left wall (West, x = -3.50) with stepped front cutaway
    const leftWallBack = new THREE.Mesh(new THREE.BoxGeometry(0.18, wallH, 3.65), mats.wallCream);
    leftWallBack.position.set(-3.50, wallY, -0.88);
    leftWallBack.castShadow = true;
    leftWallBack.receiveShadow = true;
    wallGroup.add(leftWallBack);

    const leftWallCap = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.09, 3.68), mats.wallCap);
    leftWallCap.position.set(-3.50, 0.08 + wallH + 0.04, -0.88);
    wallGroup.add(leftWallCap);

    // Low front-left knee wall so desk & couch remain 100% framed
    const leftWallLow = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.15, 1.72), mats.wallCream);
    leftWallLow.position.set(-3.50, 0.08 + 1.15 / 2, 1.80);
    leftWallLow.receiveShadow = true;
    wallGroup.add(leftWallLow);

    const leftWallLowCap = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 1.76), mats.wallCap);
    leftWallLowCap.position.set(-3.50, 0.08 + 1.15 + 0.04, 1.80);

    function populateShelfBooks(centerX, width, shelfIdx, skipCenterForCollectible) {
      const sy = shelfHeights[shelfIdx];
      let xCursor = centerX - width / 2 + 0.11;
      const xEnd = centerX + width / 2 - 0.11;

      while (xCursor < xEnd - 0.05) {
        if (skipCenterForCollectible && Math.abs(xCursor - centerX) < 0.24) {
          xCursor += 0.36;
          continue;
        }
        if (rand() < 0.08) {
          xCursor += 0.08;
          continue;
        }
        const bw = randRange(0.042, 0.082);
        const bh = randRange(0.28, 0.44);
        const bd = randRange(0.24, 0.32);
        const tilt = rand() < 0.14 ? randRange(-0.14, 0.14) : 0;

        const dummy = new THREE.Object3D();
        dummy.position.set(xCursor + bw / 2, sy + bh / 2, -2.26 + randRange(-0.02, 0.03));
        dummy.rotation.z = tilt;
        dummy.scale.set(bw, bh, bd);
        dummy.updateMatrix();
        bookTransforms.push(dummy.matrix.clone());
        const col = new THREE.Color(palette[Math.floor(rand() * palette.length)]);
        col.offsetHSL(0, 0, randRange(-0.06, 0.06));
        bookColors.push(col);

        xCursor += bw + 0.007;
      }
    }

    // 16. Responsive Camera Framing for 616x562, 390x844, 320x700 & All Viewports
    function updateCameraFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(h, 1);
      camera.aspect = aspect;
      camera.fov = aspect < 0.75 ? 41 : 34;
      camera.updateProjectionMatrix();

      // Reserve HUD safe areas: scene must fit strictly between header and footer
      const headerRect = hudHeaderEl.getBoundingClientRect();
      const footerRect = hudFooterEl.getBoundingClientRect();
      const topSafePx = Math.max(headerRect.bottom + Math.max(14, h * 0.022), h * 0.13);
      const bottomSafePx = Math.min(footerRect.top - Math.max(10, h * 0.018), h * 0.94);
      const topMaxNDC = 1 - (topSafePx / h) * 2;
      const bottomMinNDC = 1 - (bottomSafePx / h) * 2;
      const targetCenterNDCY = (topMaxNDC + bottomMinNDC) * 0.5;
      const usableHalfHeightNDC = Math.max(0.25, (topMaxNDC - bottomMinNDC) * 0.5);

      // Projected-bounding-box fit: envelope of ALL important geometry (base slab, walls, elevator, desk, bookcase tops)
      const ENVELOPE = [];
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        ENVELOPE.push(new THREE.Vector3(3.71 * sx, -0.45, 2.86 * sz));
        ENVELOPE.push(new THREE.Vector3(3.71 * sx, 0.15, 2.86 * sz));
      }
      ENVELOPE.push(new THREE.Vector3(-3.55, 3.78, -2.62));
      ENVELOPE.push(new THREE.Vector3(3.55, 3.78, -2.62));
      ENVELOPE.push(new THREE.Vector3(0, 3.78, -2.62));
      ENVELOPE.push(new THREE.Vector3(3.45, 3.05, -2.45));  // elevator top corner
      ENVELOPE.push(new THREE.Vector3(-3.45, 1.35, 0.6));   // desk far corner

      const azim = 0.50, elev = 0.60;
      const viewDir = new THREE.Vector3(
        Math.sin(azim) * Math.cos(elev), Math.sin(elev), Math.cos(azim) * Math.cos(elev)
      ).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(up, viewDir).normalize();
      const camUp = new THREE.Vector3().crossVectors(viewDir, right).normalize();

      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const tanHalfFov = Math.tan(fovRad / 2);
      const tanHalfHorizFov = tanHalfFov * aspect;
      const widthFraction = aspect < 0.75 ? 0.93 : 0.90;

      let targetY = 1.6;
      let dist = 18.0;
      for (let iter = 0; iter < 8; iter++) {
        let maxTopY = -Infinity, minBotY = Infinity, distForWidth = 0, distForHeight = 0;
        for (const p of ENVELOPE) {
          const rx = p.x, ry = p.y - targetY, rz = p.z + 0.1;
          const cx = rx * right.x + ry * right.y + rz * right.z;
          const cy = rx * camUp.x + ry * camUp.y + rz * camUp.z;
          const cz = rx * viewDir.x + ry * viewDir.y + rz * viewDir.z;
          distForWidth = Math.max(distForWidth, Math.abs(cx) / (tanHalfHorizFov * widthFraction) + cz);
          if (cy > maxTopY) maxTopY = cy;
          if (cy < minBotY) minBotY = cy;
          distForHeight = Math.max(distForHeight, Math.abs(cy) / (tanHalfFov * usableHalfHeightNDC) + cz);
        }
        dist = Math.max(distForWidth, distForHeight);
        const midCy = (maxTopY + minBotY) * 0.5;
        targetY += (midCy - targetCenterNDCY * dist * tanHalfFov) * 0.82;
      }

      controls.target.set(0, targetY, -0.1);
      camera.position.copy(controls.target).addScaledVector(viewDir, dist);
      controls.minDistance = dist * 0.7;
      controls.maxDistance = dist * 1.35;
      controls.update();
    }

    // 18. Robust Tap-vs-Drag Raycasting for Touch & Mouse
    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0, time: 0, active: false };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos.x = e.clientX;
      pointerDownPos.y = e.clientY;
      pointerDownPos.time = performance.now();
      pointerDownPos.active = true;
      state.lastUserInteraction = pointerDownPos.time;
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!pointerDownPos.active) return;
      pointerDownPos.active = false;
      const now = performance.now();
      state.lastUserInteraction = now;

      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      const distSq = dx * dx + dy * dy;
      const elapsed = now - pointerDownPos.time;

      // Only count as tap if drag distance < 10px and duration < 600ms
      if (distSq > 100 || elapsed > 600) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(interactiveProxies, false);
      if (hits.length > 0) {

        if (action === 'spot') {

    });

    // 19. Animation Loop (performance.now timing, idle motion, 25s showcase)
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const tSec = now * 0.001;

      controls.update();

      // IDLE 1: Subtle warm lamp shimmer
      floorLampLight.intensity = 1.72 + Math.sin(tSec * 3.1) * 0.08 + Math.sin(tSec * 7.4) * 0.04;
      deskLampLight.intensity = 1.32 + Math.cos(tSec * 2.7) * 0.06;

      // IDLE 2: Desk monitor subtle screen flicker
      const monFlicker = 0.72 + Math.sin(tSec * 6.0) * 0.07 + (Math.sin(tSec * 19.3) > 0.65 ? 0.10 : 0.0);
      mats.monitorScreen.emissiveIntensity = monFlicker;
      monitorGlowLight.intensity = monFlicker * 0.95;

      // IDLE 3: Slow moving evening window light
      windowLight.position.z = -0.82 + Math.sin(tSec * 0.45) * 0.35;
      windowLight.intensity = 1.60 + Math.sin(tSec * 0.6) * 0.18;

      // IDLE 4: Contained room dust motes
      for (let i = 0; i < moteCount; i++) {
        const m = moteData[i];
        const mx = m.bx + Math.sin(tSec * m.sx + m.phase) * 0.16;
        const my = m.by + Math.sin(tSec * m.sy + m.phase * 1.3) * 0.14;
        const mz = m.bz + Math.cos(tSec * m.sx * 0.8 + m.phase) * 0.16;
        moteDummy.position.set(mx, my, mz);
        moteDummy.scale.setScalar(m.scale);
        moteDummy.updateMatrix();
        motesInstanced.setMatrixAt(i, moteDummy.matrix);
      }
      motesInstanced.instanceMatrix.needsUpdate = true;

      // IDLE 5: Gentle showcase repeat once every 25 seconds if untouched
      if (!state.spotActive && !state.doorActive && now - state.lastUserInteraction > 25000) {
        state.lastUserInteraction = now;
        if (state.nextShowcaseIsDoor) {
          triggerDoorInteraction(now);
        } else {
          triggerSpotInteraction(now);
        }
        state.nextShowcaseIsDoor = !state.nextShowcaseIsDoor;
      }

      // INTERACTION 1 Update: Sheldon's Spot (6.0s total duration)
      if (state.spotActive) {
        const elapsed = now - state.spotStartTime;
        if (elapsed >= state.spotDuration) {
          resetSpotInteraction();
        } else {
          // Smooth fade-in (0..0.4s), hold, smooth fade-out (4.6..6.0s)
          let env = 1.0;
          if (elapsed < 400) {
            env = elapsed / 400;
          } else if (elapsed > 4600) {
            env = 1.0 - (elapsed - 4600) / 1400;
          }
          env = Math.max(0, Math.min(1, env));

          sheldonSpotLight.intensity = 5.4 * env;
          mats.leatherSpot.emissiveIntensity = (0.38 + 0.12 * Math.sin(elapsed * 0.008)) * env;
          leftSeatCushion.position.y = 0.40 + Math.sin(elapsed * 0.006) * 0.015 * env;

          orbitMatGold.opacity = 0.88 * env;
          orbitMatBlue.opacity = 0.85 * env;
          cushionHaloMat.opacity = (0.45 + 0.18 * Math.sin(elapsed * 0.01)) * env;
          cushionHalo.scale.setScalar(1.0 + 0.08 * Math.sin(elapsed * 0.007));

          atomOrbitGroup.position.y = 1.14 + Math.sin(elapsed * 0.004) * 0.05;
          atomOrbitGroup.rotation.y = elapsed * 0.0016;
          atomRings.forEach(ar => {
            const ang = elapsed * 0.001 * ar.speed + ar.phase;
            ar.electron.position.set(Math.cos(ang) * 0.42, Math.sin(ang) * 0.42, 0);
          });

          spotLabelEl.style.opacity = env.toFixed(2);
          updateFloatingLabel(spotLabelEl, spotLabelAnchor);
        }
      }

      // INTERACTION 2 Update: 4A Door Three-Knock Sequence (0s, 0.55s, 1.1s, fading by 5.0s)
      if (state.doorActive) {
        const elapsed = now - state.doorStartTime;
        if (elapsed >= state.doorDuration) {
          resetDoorInteraction();
        } else {
          // Calculate 3 distinct knocks at 0ms, 550ms, 1100ms
          let doorAngle = 0;
          let knockEmissive = 0;

          knockRings.forEach(kr => {
            const localT = elapsed - kr.delay;
            if (localT >= 0 && localT <= 950) {
              const p = localT / 950;
              const ringScale = 0.55 + p * 2.45;
              kr.mesh.scale.setScalar(ringScale);
              kr.mat.opacity = Math.sin(p * Math.PI) * (1.0 - p * 0.4);
            } else {
              kr.mat.opacity = 0;
            }

            // Sharp tactile door pivot pulse on each knock
            if (localT >= 0 && localT <= 380) {
              const kp = localT / 380;
              const pulse = Math.sin(kp * Math.PI);
              doorAngle += pulse * 0.14;
              knockEmissive = Math.max(knockEmissive, pulse * 0.65);
            }
          });

          doorPivot.rotation.y = -doorAngle;
          mats.doorGreen.emissiveIntensity = knockEmissive;

          // Hallway warm glow builds up and gently fades out by 5.0s
          let hallFade = 1.0;
          if (elapsed < 300) {
            hallFade = elapsed / 300;
          } else if (elapsed > 2200) {
            hallFade = 1.0 - (elapsed - 2200) / 2800;
          }
          hallFade = Math.max(0, Math.min(1, hallFade));
          hallwayLight.intensity = 0.95 + 2.65 * hallFade;

          // Keep "knock knock knock" label visible during knock + glow
          const labelOp = elapsed < 3600 ? Math.min(1, elapsed / 180) : Math.max(0, 1 - (elapsed - 3600) / 1200);
          knockLabelEl.style.opacity = labelOp.toFixed(2);
          updateFloatingLabel(knockLabelEl, doorLabelAnchor);
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
