<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desert RV - a tiny scene inspired by Breaking Bad</title>
<meta name="theme-color" content="#1a120c">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#191009}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3e3c8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  /* soft photographic vignette + warm grade, like a miniature photograph */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(26,12,4,.38) 100%);}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#191009;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#c8a06a;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#3a2a1a;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#c8a06a;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 2px 12px rgba(20,8,2,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#d9bd92;margin-top:3px;text-shadow:0 1px 8px rgba(20,8,2,.5)}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#f0dcba;background:rgba(24,12,5,.55);border:1px solid rgba(240,220,186,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>Desert RV</h1><p>a tiny scene inspired by Breaking Bad</p></div>
<div id="hint">tap the RV door &nbsp;&middot;&nbsp; tap the sky for night</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   DESERT RV - a tactile miniature diorama
   One square of New Mexico dusk on a modelmaker's cutaway slab.
   Everything below is procedural geometry and colour.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe8a06a, 0.013);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0.75, 0);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 7;
controls.maxDistance = 26;

function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  // generous margins: the whole slab breathes inside the frame
  const dist = aspect < 0.72 ? 21.5 : aspect < 1.05 ? 15.2 : 11.6;
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 0.01) dir.set(0.75, 0.45, 0.7);
  dir.normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist);
}
camera.position.set(7.6, 4.6, 7.2);
frameForViewport();

/* ---------- palette ---------- */
const PAL = {
  sandHi: 0xd9a86e, sandMid: 0xc98f56, sandLow: 0xb0763f,
  strata1: 0xa06838, strata2: 0x8a5230, strata3: 0x6e4026, baseDark: 0x4a2c1a,
  rvCream: 0xeadfc4, rvStripe: 0x9a5b2e, rvStripe2: 0xc9a24b, rvDust: 0xb08a5c,
  windowDay: 0x51646e, windowGlow: 0xffb75c,
  rock: 0x8a5f42, scrub: 0x7d7a44, cactus: 0x5f7a3f,
  mesa: 0xb97a4e, tire: 0x2a2118, metal: 0x8f8878,
};

/* ---------- helpers ---------- */
const rand = (a,b)=>a+Math.random()*(b-a);
function M(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.92, metalness:0.0}, opts)); }

/* ---------- layered cutaway slab (square, never a round plinth) ---------- */
const slab = new THREE.Group();
const SLAB = 10, HALF = SLAB/2;
const layers = [
  { h:0.34, c:PAL.sandMid },   // sand cap (top replaced by rippled plane)
  { h:0.26, c:PAL.strata1 },
  { h:0.24, c:PAL.strata2 },
  { h:0.22, c:PAL.strata3 },
];
let y = 0;
for (const L of layers){
  const g = new THREE.BoxGeometry(SLAB, L.h, SLAB);
  const mesh = new THREE.Mesh(g, M(L.c, {roughness:0.97}));
  mesh.position.y = y - L.h/2;
  y -= L.h;
  mesh.receiveShadow = true; mesh.castShadow = false;
  slab.add(mesh);
}
const plinthBottom = new THREE.Mesh(new THREE.BoxGeometry(SLAB+0.28, 0.18, SLAB+0.28), M(PAL.baseDark,{roughness:0.85}));
plinthBottom.position.y = y - 0.09;
slab.add(plinthBottom);
scene.add(slab);

/* ---------- rippled sand top with painted tracks & mottling ---------- */
function sandTexture(){
  const S = 1024, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const grd = ctx.createLinearGradient(0,0,S,S);
  grd.addColorStop(0,'#d9a86e'); grd.addColorStop(0.5,'#cf9a5e'); grd.addColorStop(1,'#c98f56');
  ctx.fillStyle = grd; ctx.fillRect(0,0,S,S);
  // mottled patches
  for(let i=0;i<2600;i++){
    const r = rand(2,14);
    ctx.fillStyle = Math.random()<0.5 ? `rgba(255,225,180,${rand(0.02,0.07)})` : `rgba(120,70,35,${rand(0.03,0.08)})`;
    ctx.beginPath(); ctx.arc(rand(0,S), rand(0,S), r, 0, 7); ctx.fill();
  }
  // tire tracks: two parallel curves with dashed tread
  const track = (off)=>{
    ctx.strokeStyle = 'rgba(90,55,28,0.15)'; ctx.lineWidth = 8; ctx.setLineDash([14,12]);
    ctx.beginPath();
    ctx.moveTo(-40, 640+off);
    ctx.bezierCurveTo(300, 600+off, 520, 520+off, 700, 470+off);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,235,200,0.10)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-40,640+off-7); ctx.bezierCurveTo(300,600+off-7,520,520+off-7,700,470+off-7); ctx.stroke();
  };
  track(-22); track(22);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const sandGeo = new THREE.PlaneGeometry(SLAB-0.02, SLAB-0.02, 90, 90);
{
  const pos = sandGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), yy = pos.getY(i);
    let h = Math.sin(x*2.1 + yy*0.6)*0.028 + Math.sin(yy*3.3 - x*0.4)*0.02 + Math.sin((x+yy)*5.1)*0.008;
    const d = Math.hypot(x-0.2, yy-(-0.3));
    if (d < 2.9) h *= (d/2.9)*(d/2.9);      // flatten where the RV sits
    const edge = Math.max(Math.abs(x), Math.abs(yy));
    if (edge > HALF-0.55) h *= Math.max(0,(HALF-edge)/0.55); // calm rim
    pos.setZ(i, h);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({
  map: sandTexture(), color:0xffffff, roughness:0.96, metalness:0
}));
sand.rotation.x = -Math.PI/2;
sand.position.y = 0.002;
sand.receiveShadow = true;
scene.add(sand);

/* ---------- instanced pebbles ---------- */
{
  const pebGeo = new THREE.IcosahedronGeometry(0.05, 0);
  const pebMat = M(0xb98a58, {roughness:1});
  const count = 150;
  const inst = new THREE.InstancedMesh(pebGeo, pebMat, count);
  const dummy = new THREE.Object3D();
  const cTint = new THREE.Color();
  for(let i=0;i<count;i++){
    const x = rand(-HALF+0.35, HALF-0.35), z = rand(-HALF+0.35, HALF-0.35);
    if (Math.hypot(x-0.2, z+0.3) < 2.3){ dummy.position.set(99,99,99); }
    else dummy.position.set(x, 0.02, z);
    const s = rand(0.4,1.6);
    dummy.scale.set(s, s*rand(0.5,0.8), s);
    dummy.rotation.set(rand(0,3), rand(0,3), rand(0,3));
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
    cTint.setHSL(0.07+Math.random()*0.03, rand(0.3,0.5), rand(0.32,0.52));
    inst.setColorAt(i, cTint);
  }
  inst.castShadow = true; inst.receiveShadow = true;
  scene.add(inst);
}

/* ---------- dry scrub tufts ---------- */
{
  const tuft = new THREE.Group();
  for(let i=0;i<26;i++){
    const x = rand(-HALF+0.4, HALF-0.4), z = rand(-HALF+0.4, HALF-0.4);
    if (Math.hypot(x-0.2, z+0.3) < 2.5) continue;
    const blades = 3 + (Math.random()*3|0);
    const g = new THREE.Group();
    for(let b=0;b<blades;b++){
      const blade = new THREE.Mesh(new THREE.ConeGeometry(0.03, rand(0.18,0.34), 4), M(PAL.scrub,{roughness:1}));
      blade.position.set(rand(-0.05,0.05), 0.1, rand(-0.05,0.05));
      blade.rotation.set(rand(-0.3,0.3), rand(0,3), rand(-0.3,0.3));
      blade.castShadow = true;
      g.add(blade);
    }
    g.position.set(x, 0, z);
    const s = rand(0.8,1.5); g.scale.set(s,s,s);
    tuft.add(g);
  }
  scene.add(tuft);
}

/* ---------- cacti ---------- */
function saguaro(scale){
  const g = new THREE.Group();
  const mat = M(PAL.cactus, {roughness:0.85});
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,1.15,10), mat);
  trunk.position.y = 0.575; trunk.castShadow = true;
  g.add(trunk);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8), mat);
  cap.position.y = 1.15; cap.castShadow = true; g.add(cap);
  const arm = (side)=>{
    const a = new THREE.Group();
    const horiz = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.06,0.3,8), mat);
    horiz.rotation.z = Math.PI/2*side; horiz.position.set(0.14*side, 0.55, 0); horiz.castShadow = true;
    const vert = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.055,0.42,8), mat);
    vert.position.set(0.28*side, 0.76, 0); vert.castShadow = true;
    const acap = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), mat);
    acap.position.set(0.28*side, 0.97, 0); acap.castShadow = true;
    a.add(horiz, vert, acap);
    return a;
  };
  g.add(arm(1), arm(-1));
  g.scale.setScalar(scale);
  return g;
}
function barrelCactus(scale){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), M(0x6a8348,{roughness:0.85}));
  body.scale.y = 0.85; body.position.y = 0.13; body.castShadow = true;
  g.add(body);
  const flower = new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6), M(0xd9825f,{roughness:0.7}));
  flower.position.y = 0.27; g.add(flower);
  g.scale.setScalar(scale);
  return g;
}
const c1 = saguaro(1.15); c1.position.set(-3.4, 0, -2.2); c1.rotation.y = 0.5;
const c2 = saguaro(0.8);  c2.position.set(3.9, 0, 2.4);  c2.rotation.y = 2.3;
const b1 = barrelCactus(1); b1.position.set(-1.6, 0, 2.9);
const b2 = barrelCactus(0.7); b2.position.set(4.2, 0, -1.4);
scene.add(c1, c2, b1, b2);

/* ---------- rock clusters ---------- */
function rockCluster(x, z, n, s){
  const g = new THREE.Group();
  for(let i=0;i<n;i++){
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.12,0.3), 0),
      M(PAL.rock, {flatShading:true, roughness:0.98}));
    r.position.set(rand(-0.3,0.3), rand(0.03,0.09), rand(-0.3,0.3));
    r.rotation.set(rand(0,3), rand(0,3), rand(0,3));
    r.castShadow = true; r.receiveShadow = true;
    g.add(r);
  }
  g.position.set(x, 0, z); g.scale.setScalar(s);
  scene.add(g);
}
rockCluster(-3.1, 1.8, 4, 1.2);
rockCluster(3.2, -3.0, 3, 1.0);
rockCluster(-0.6, -3.6, 3, 0.8);

/* ---------- tumbleweed ---------- */
{
  const tw = new THREE.Group();
  const twMat = M(0x9a7b4a, {roughness:1});
  for(let i=0;i<26;i++){
    const len = rand(0.28,0.44);
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.009,len,3), twMat);
    stick.position.set(rand(-0.12,0.12), rand(-0.12,0.12), rand(-0.12,0.12));
    stick.rotation.set(rand(0,6.3), rand(0,6.3), rand(0,6.3));
    tw.add(stick);
  }
  tw.position.set(-2.4, 0.2, -3.3);
  tw.castShadow = true;
  scene.add(tw);
}

/* ================= the RV ================= */
const rv = new THREE.Group();
const RVW = 1.42, RVL = 3.5;
const paint = M(PAL.rvCream, {roughness:0.55, metalness:0.05});
const paintDust = M(PAL.rvDust, {roughness:0.9});
const stripeM = M(PAL.rvStripe, {roughness:0.55});
const stripe2M = M(PAL.rvStripe2, {roughness:0.5});
const glassDay = new THREE.MeshStandardMaterial({color:PAL.windowDay, roughness:0.12, metalness:0.4});
const frameM = M(0xd8ccb0, {roughness:0.7});
const skirtM = M(0x453b2e, {roughness:0.85});
const metalM = M(PAL.metal, {metalness:0.55, roughness:0.4});

function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function rbox(w,h,d,r,mat){ const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat); m.castShadow=true; m.receiveShadow=true; return m; }

/* body: softened side-profile extrusion - a real Class A silhouette */
const prof = new THREE.Shape();
prof.moveTo(-1.75, 0.52);
prof.lineTo(1.40, 0.52);
prof.lineTo(1.66, 0.58);
prof.lineTo(1.72, 1.30);
prof.lineTo(1.38, 2.02);
prof.lineTo(1.26, 2.12);
prof.lineTo(-1.60, 2.12);
prof.lineTo(-1.75, 1.98);
prof.closePath();
const bodyGeo = new THREE.ExtrudeGeometry(prof, {depth: RVW-0.12, bevelEnabled:true, bevelThickness:0.05, bevelSize:0.045, bevelSegments:3, steps:1});
bodyGeo.translate(0, 0, -(RVW-0.12)/2);
const body = new THREE.Mesh(bodyGeo, paint);
body.rotation.y = -Math.PI/2;
body.castShadow = true; body.receiveShadow = true;
rv.add(body);

/* windshield pair on the sloped front cap */
const wsAngle = -Math.atan2(0.34, 0.72);
for (const s of [-1,1]){
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.6), glassDay);
  pane.position.set(s*0.29, 1.66, 1.585);
  pane.rotation.x = wsAngle;
  rv.add(pane);
  const wf = box(0.56, 0.64, 0.02, frameM);
  wf.position.set(s*0.29, 1.66, 1.572);
  wf.rotation.x = wsAngle;
  rv.add(wf);
}

/* side stripes + dust band + panel seams */
for (const s of [-1,1]){
  const st = box(0.012, 0.16, RVL*0.92, stripeM);
  st.position.set(s*(RVW/2+0.004), 1.06, -0.05);
  rv.add(st);
  const st2 = box(0.012, 0.05, RVL*0.92, stripe2M);
  st2.position.set(s*(RVW/2+0.004), 1.2, -0.05);
  rv.add(st2);
  const dust = box(0.012, 0.2, RVL*0.9, paintDust);
  dust.position.set(s*(RVW/2+0.003), 0.66, -0.05);
  rv.add(dust);
  for(const pz of [-0.8, 0.35]){
    const seam = box(0.008, 1.3, 0.012, M(0xcfc2a4,{roughness:0.7}));
    seam.position.set(s*(RVW/2+0.003), 1.33, pz);
    rv.add(seam);
  }
}

/* windows */
const windows = [];
function addWindow(s, z, w=0.52, h=0.4, y=1.55){
  const frame = box(0.03, h+0.06, w+0.06, frameM);
  frame.position.set(s*(RVW/2+0.006), y, z);
  rv.add(frame);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassDay.clone());
  glass.position.set(s*(RVW/2+0.026), y, z);
  glass.rotation.y = s>0 ? Math.PI/2 : -Math.PI/2;
  rv.add(glass);
  windows.push(glass);
}
addWindow(-1, -1.15); addWindow(-1, -0.35); addWindow(-1, 0.6);
addWindow(1, -1.0); addWindow(1, 0.95, 0.4, 0.34);
{
  const frame = box(0.5, 0.4, 0.03, frameM);
  frame.position.set(0, 1.55, -RVL/2-0.05);
  rv.add(frame);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.44,0.34), glassDay.clone());
  glass.position.set(0, 1.55, -RVL/2-0.075);
  glass.rotation.y = Math.PI;
  rv.add(glass); windows.push(glass);
}

/* door (right side), hinged on its front edge */
const doorPivot = new THREE.Group();
doorPivot.position.set(RVW/2+0.01, 0.52, 0.12);
const doorPanel = new THREE.Group();
const door = rbox(0.04, 1.28, 0.56, 0.02, paint);
door.position.set(0.012, 0.64, -0.29);
doorPanel.add(door);
const doorWinFrame = box(0.042, 0.4, 0.3, frameM);
doorWinFrame.position.set(0.012, 1.02, -0.29);
doorPanel.add(doorWinFrame);
const doorGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.24,0.34), glassDay.clone());
doorGlass.position.set(0.036, 1.02, -0.29);
doorGlass.rotation.y = Math.PI/2;
doorPanel.add(doorGlass);
windows.push(doorGlass);
const handle = box(0.05, 0.03, 0.09, M(0x4c4438,{roughness:0.4,metalness:0.6}));
handle.position.set(0.055, 0.62, -0.5);
doorPanel.add(handle);
doorPivot.add(doorPanel);
rv.add(doorPivot);
const doorFrame = box(0.024, 1.34, 0.62, frameM);
doorFrame.position.set(RVW/2-0.002, 1.16, -0.17);
rv.add(doorFrame);
const step = box(0.3, 0.06, 0.5, metalM);
step.position.set(RVW/2+0.18, 0.08, -0.17);
rv.add(step);

/* roof kit: rounded AC, vent, antenna, ladder */
const ac = rbox(0.5, 0.16, 0.6, 0.04, M(0xdcd4be,{roughness:0.6}));
ac.position.set(0, 2.2, -0.6);
rv.add(ac);
for(let i=0;i<3;i++){
  const vent = box(0.4, 0.02, 0.04, M(0xb8ae96));
  vent.position.set(0, 2.29, -0.75+i*0.15);
  rv.add(vent);
}
const roofVent = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.1,10), M(0xdcd4be));
roofVent.position.set(-0.3, 2.17, 0.6);
roofVent.castShadow = true;
rv.add(roofVent);
const antenna = box(0.015, 0.5, 0.015, M(0x5a5348,{metalness:0.5,roughness:0.4}));
antenna.position.set(0.45, 2.35, 1.2);
antenna.rotation.z = -0.12;
rv.add(antenna);
{
  const railL = box(0.03, 1.3, 0.03, metalM);

let stateIdx = 1;  // open on golden hour
let blend = { t:1, from:STATES[1], to:STATES[1] };
const tmpC = new THREE.Color();
function lerpColor(target, a, b, t){ target.copy(tmpC.set(a).lerp(new THREE.Color(b), t)); }
function applyState(s){
  skyUniforms.topColor.value.set(s.top);
  skyUniforms.midColor.value.set(s.mid);
  skyUniforms.bottomColor.value.set(s.bottom);
  scene.fog.color.set(s.fog); scene.fog.density = s.fogD;
  hemi.color.set(s.hemi[0]); hemi.groundColor.set(s.hemi[1]); hemi.intensity = s.hemi[2];
  sun.color.set(s.sunC); sun.intensity = s.sunI; sun.position.set(...s.sunPos);
  fill.intensity = s.fillI; fill.color.set(s.fillC);
  renderer.toneMappingExposure = s.exp;
  stars.material.opacity = s.stars;
  sunMesh.position.set(s.sunMesh[0], s.sunMesh[1], s.sunMesh[2]);
  sunMesh.material.color.set(s.sunMesh[3]);
  cloudMat.emissiveIntensity = s.cloudE;
  cloudMat.color.set(s.cloudC);
  const winEm = s.winGlow;
  for(const w of windows){ w.material.emissive.set(PAL.windowGlow); w.material.emissiveIntensity = winEm; }
  if (!doorOpenTarget) cabinLight.intensity = s.cabin;  // door-open overrides
  fireBase = s.fire;
  flameOut.visible = flameIn.visible = s.fire > 0.04;
  for(const h of headlights) h.material.emissive.set(0xffe9b0), h.material.emissiveIntensity = s.head;
}
function cycleState(){
  const from = snapshotState();
  stateIdx = (stateIdx+1) % STATES.length;
  blend = { t:0, from, to:STATES[stateIdx] };
}
function snapshotState(){
  const s = STATES[stateIdx];
  if (blend.t >= 1) return s;
  // snapshot current blended values as plain state-like object
  const mix = (a,b)=>new THREE.Color(a).lerp(new THREE.Color(b), blend.t).getHex();
  const p = blend.from, n = blend.to;
  const mixN = (a,b)=>a+(b-a)*blend.t;
  return {
    top:mix(p.top,n.top), mid:mix(p.mid,n.mid), bottom:mix(p.bottom,n.bottom),
    fog:mix(p.fog,n.fog), fogD:mixN(p.fogD,n.fogD),
    hemi:[mix(p.hemi[0],n.hemi[0]), mix(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
    sunC:mix(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI),
    sunPos:[0,1,2].map(i=>mixN(p.sunPos[i],n.sunPos[i])),
    fillI:mixN(p.fillI,n.fillI), fillC:mix(p.fillC,n.fillC), exp:mixN(p.exp,n.exp),
    stars:mixN(p.stars,n.stars),
    sunMesh:[0,1,2].map(i=>mixN(p.sunMesh[i],n.sunMesh[i])).concat([mix(p.sunMesh[3],n.sunMesh[3])]),
    winGlow:mixN(p.winGlow,n.winGlow), cabin:mixN(p.cabin,n.cabin), head:mixN(p.head,n.head),
    cloudE:mixN(p.cloudE,n.cloudE), cloudC:mix(p.cloudC,n.cloudC),
    fire:mixN(p.fire,n.fire),
  };
}

const SMOKE_N = 70;
const smokeGeo = new THREE.BufferGeometry();
const smokePos = new Float32Array(SMOKE_N*3);
const smokeAge = new Float32Array(SMOKE_N).fill(99);
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
const smokeCanvasTex = (()=>{
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32,32,2,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,0.85)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
})();
const smokeMat = new THREE.PointsMaterial({
  color:0xb8e07a, size:0.22, map:smokeCanvasTex, transparent:true,
  opacity:0, depthWrite:false, blending:THREE.NormalBlending });
const smoke = new THREE.Points(smokeGeo, smokeMat);

let smokeOn = false;
function puffSmoke(){
  for(let i=0;i<SMOKE_N;i++){
    smokeAge[i] = -Math.random()*1.6;   // staggered start
  }
  smokeOn = true;
}
function updateSmoke(dt){
  if (!smokeOn && smokeMat.opacity <= 0.001) return;
  const target = smokeOn ? 0.7 : 0;
  smokeMat.opacity += (target - smokeMat.opacity) * Math.min(1, dt*3);
  const doorWorld = new THREE.Vector3();
  doorPivot.getWorldPosition(doorWorld);
  for(let i=0;i<SMOKE_N;i++){
    smokeAge[i] += dt;
    if (smokeAge[i] > 2.6){ if (smokeOn) smokeAge[i] = 0; else continue; }
    if (smokeAge[i] < 0) continue;
    const a = smokeAge[i], seed = i*1.37;
    smokePos[i*3]   = doorWorld.x + 0.5 + a*0.55 + Math.sin(seed+a*4)*0.16;
    smokePos[i*3+1] = doorWorld.y + 0.6 + a*0.75 + Math.sin(seed*2)*0.1;
    smokePos[i*3+2] = doorWorld.z - 0.3 + Math.cos(seed+a*3)*0.2 + a*0.2;
  }
  smokeGeo.attributes.position.needsUpdate = true;
}

/* ================= interaction ================= */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let doorOpenTarget = false, doorT = 0;   // 0 closed, 1 open
let downAt = 0, downPos = [0,0];
renderer.domElement.addEventListener('pointerdown', e=>{
  downAt = performance.now(); downPos = [e.clientX, e.clientY];
});
renderer.domElement.addEventListener('pointerup', e=>{
  if (performance.now()-downAt > 350) return;
  if (Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]) > 8) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const doorHit = ray.intersectObjects(doorPivot.children, true);
  const rvHit = ray.intersectObject(rv, true);
  if (doorHit.length || rvHit.length){
    doorOpenTarget = !doorOpenTarget;
    if (doorOpenTarget){ puffSmoke(); } else { smokeOn = false; }
    return;
  }
  const skyHit = ray.intersectObject(sky);
  if (skyHit.length) cycleState();
});

/* ================= resize / loop ================= */
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});
const clock = new THREE.Clock();
let elapsed = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (blend.t < 1){
    blend.t = Math.min(1, blend.t + dt/1.6);
    // proper lerp from snapshot:
    const s = (function(){
      const p = blend.from, n = blend.to, t = blend.t;
      const mixC = (a,b)=>new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
      const mixN = (a,b)=>a+(b-a)*t;
      return {
        top:mixC(p.top,n.top), mid:mixC(p.mid,n.mid), bottom:mixC(p.bottom,n.bottom),
        fog:mixC(p.fog,n.fog), fogD:mixN(p.fogD,n.fogD),
        hemi:[mixC(p.hemi[0],n.hemi[0]), mixC(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
        sunC:mixC(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI),
        sunPos:[0,1,2].map(i=>mixN(p.sunPos[i],n.sunPos[i])),
        fillI:mixN(p.fillI,n.fillI), fillC:mixC(p.fillC,n.fillC), exp:mixN(p.exp,n.exp),
        stars:mixN(p.stars,n.stars),
        sunMesh:[0,1,2].map(i=>mixN(p.sunMesh[i],n.sunMesh[i])).concat([mixC(p.sunMesh[3],n.sunMesh[3])]),
        winGlow:mixN(p.winGlow,n.winGlow), cabin:mixN(p.cabin,n.cabin), head:mixN(p.head,n.head),
        cloudE:mixN(p.cloudE,n.cloudE), cloudC:mixC(p.cloudC,n.cloudC),
        fire:mixN(p.fire,n.fire),
      };
    })();
    applyState(s);
  }

  // door swing
  doorT += ((doorOpenTarget?1:0) - doorT) * Math.min(1, dt*4.5);
  doorPivot.rotation.y = -doorT * 1.9;
  if (doorT > 0.05) cabinLight.intensity = Math.max(STATES[stateIdx].cabin, 2.2*doorT);

  updateSmoke(dt);

  // campfire flicker
  if (fireBase > 0){
    fireLight.intensity = fireBase * (0.85 + 0.25*Math.sin(elapsed*13) + 0.12*Math.sin(elapsed*29));
    flameOut.scale.y = 1 + 0.16*Math.sin(elapsed*11);
    flameOut.scale.x = flameOut.scale.z = 1 + 0.08*Math.sin(elapsed*17);
    flameIn.scale.y = 1 + 0.2*Math.sin(elapsed*15+1.3);
  }

  // clouds drift
  for(const c of clouds.children){
    c.userData.ang += c.userData.speed * dt * 0.06;
    c.position.x = Math.cos(c.userData.ang)*c.userData.r;
    c.position.z = Math.sin(c.userData.ang)*c.userData.r;
  }
  // birds circle
  for(const b of birds.children){
    const u = b.userData; u.phase += u.speed*dt;
    b.position.set(Math.cos(u.phase)*u.r, u.h + Math.sin(elapsed*2+u.phase)*0.25, Math.sin(u.phase)*u.r);
    b.rotation.y = -u.phase;
  }
  controls.update();
  renderer.render(scene, camera);
}
applyState(STATES[stateIdx]);
tick();
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
  document.body.classList.add('ready');
}, 700);
</script>
</body>
</html>
