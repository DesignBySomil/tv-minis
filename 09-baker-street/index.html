<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>221B Baker Street - a tiny scene inspired by Sherlock</title>
<meta name="theme-color" content="#171210">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#171210}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3ead8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(12,9,7,.44) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#171210;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#c9a86a;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#332a22;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#c9a86a;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(12,9,7,.95),0 2px 8px rgba(12,9,7,.8),0 4px 22px rgba(12,9,7,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#e8dcc0;margin-top:3px;text-shadow:0 1px 2px rgba(12,9,7,.95),0 2px 6px rgba(12,9,7,.75),0 3px 14px rgba(12,9,7,.5)}
  #era{position:fixed;top:max(18px,env(safe-area-inset-top));right:20px;z-index:4;pointer-events:none;
    font-size:11px;letter-spacing:.24em;color:#e8c88a;border:1px solid rgba(232,200,138,.35);
    padding:5px 12px;border-radius:99px;background:rgba(23,18,16,.5);backdrop-filter:blur(6px);
    opacity:0;transition:opacity 1.4s ease .8s}
  body.ready #era{opacity:1}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#f2ecd8;background:rgba(24,19,15,.55);border:1px solid rgba(240,228,200,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
    #era{right:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>221B Baker Street</h1><p>a tiny scene inspired by Sherlock</p></div>
<div id="era">NIGHT</div>
<div id="hint">tap the fire &nbsp;&middot;&nbsp; tap the window &nbsp;&middot;&nbsp; tap the magnifier</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   221B BAKER STREET - a Victorian sitting room.
   Fireplace and wingback chairs, a window onto a foggy London
   street, books, a violin, a pipe, and a magnifying glass that
   reveals what the room is hiding. All procedural.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.7;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191309);
scene.fog = new THREE.FogExp2(0x120e0a, 0.0035);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.1, -0.4);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.5, -1.05, -3.3), new THREE.Vector3(4.5, 0.2, 4.1)),
  new THREE.Box3(new THREE.Vector3(-4.3, 0, -3.1), new THREE.Vector3(4.3, 3.6, 3.9)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}

/* shift camera+orbit-target in the screen plane so the projected model
   bounding box lands at viewport centre (small lift for the hint pill) */
function centerProjectedModel(){
  for (let pass = 0; pass < 2; pass++){
    camera.updateMatrixWorld();
    const p = new THREE.Vector3();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const c of FIT_CORNERS){
      p.copy(c).project(camera);
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const dist = camera.position.distanceTo(controls.target);
    const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    const halfW = halfH * camera.aspect;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    controls.target.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    camera.lookAt(controls.target);
  }
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8){ dir.set(0.46, 0.44, 0.64); SAFE.x = 0.965; SAFE.yTop = 0.88; SAFE.yBottom = 0.83; }
  else { dir.set(0.52, 0.48, 0.7); SAFE.x = 0.93; SAFE.yTop = 0.85; SAFE.yBottom = 0.8; }
  dir.normalize();
  let lo = 4, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi*1.03);
  camera.lookAt(controls.target);
  centerProjectedModel();
}
frameForViewport();

/* ---------- materials ---------- */
const MAT = {
  woodDark:  new THREE.MeshStandardMaterial({ color:0x4a3220, roughness:0.82, metalness:0.05 }),
  woodMid:   new THREE.MeshStandardMaterial({ color:0x6b4a2c, roughness:0.78, metalness:0.05 }),
  woodLight: new THREE.MeshStandardMaterial({ color:0x8a6136, roughness:0.75, metalness:0.05 }),
  wallGreen: new THREE.MeshStandardMaterial({ color:0x3d4a38, roughness:0.92 }),
  wallPaper: new THREE.MeshStandardMaterial({ color:0x6b563f, roughness:0.95 }),
  leather:   new THREE.MeshStandardMaterial({ color:0x7a3b2a, roughness:0.62, metalness:0.08 }),
  leather2:  new THREE.MeshStandardMaterial({ color:0x5f4a2e, roughness:0.66, metalness:0.06 }),
  brass:     new THREE.MeshStandardMaterial({ color:0xc9973f, roughness:0.35, metalness:0.85 }),
  iron:      new THREE.MeshStandardMaterial({ color:0x2c2a28, roughness:0.55, metalness:0.7 }),
  marble:    new THREE.MeshStandardMaterial({ color:0xd8cfc0, roughness:0.35, metalness:0.05 }),
  paper:     new THREE.MeshStandardMaterial({ color:0xe8ddc2, roughness:0.9 }),
  cloth:     new THREE.MeshStandardMaterial({ color:0x8a2f2a, roughness:0.95 }),
  bone:      new THREE.MeshStandardMaterial({ color:0xd9d2bd, roughness:0.8 }),
  violin:    new THREE.MeshStandardMaterial({ color:0x9a5a22, roughness:0.4, metalness:0.1 }),
  glass:     new THREE.MeshStandardMaterial({ color:0xbfd4d8, roughness:0.1, metalness:0.4, transparent:true, opacity:0.35 }),
  curtain:   new THREE.MeshStandardMaterial({ color:0x6d2430, roughness:0.95 }),
};

function box(w,h,d,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function rbox(w,h,d,r,mat,x,y,z,ry=0,parent=scene){
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r), mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=14,parent=scene){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function sph(r,mat,x,y,z,parent=scene,ws=12,hs=10){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

/* ---------- base + floor ---------- */
const base = new THREE.Group(); scene.add(base);
box(9.6, 0.5, 8.2, MAT.woodDark, 0, -0.75, 0.4, 0, base);
box(9.0, 0.35, 7.6, MAT.woodMid,  0, -0.33, 0.4, 0, base);
/* floorboards */
for (let i=0;i<10;i++){
  const tone = i%2 ? MAT.woodMid : MAT.woodLight;
  const fb = box(8.6, 0.12, 0.68, tone, 0, -0.06, -2.7+i*0.72, 0, base);
  fb.receiveShadow = true;
}
/* rug: deep red with border inlay */
box(4.6, 0.05, 3.4, MAT.cloth, 0, 0.03, 0.3, 0, base);
box(4.2, 0.06, 3.0, new THREE.MeshStandardMaterial({color:0x9a4536, roughness:0.95}), 0, 0.035, 0.3, 0, base);
box(3.0, 0.07, 2.0, MAT.cloth, 0, 0.04, 0.3, 0, base);
for (const sx of [-1,1]) for (const sz of [-1,1])
  box(0.3,0.075,0.3, MAT.brass, sx*1.9, 0.04, 0.3+sz*1.35, 0, base);

/* ---------- walls (cutaway: back + left) ---------- */
const WALL_H = 3.4;
box(9.0, WALL_H, 0.35, MAT.wallPaper, 0, WALL_H/2-0.0, -3.05, 0, base);           // back wall
/* left wall, four pieces around a REAL window aperture (z -0.35..1.55, y 0.7..2.8) */
box(0.35, 0.7, 7.6, MAT.wallPaper, -4.3, 0.35, 0.4, 0, base);                        // below window
box(0.35, 0.6, 7.6, MAT.wallPaper, -4.3, 3.1, 0.4, 0, base);                         // above window
box(0.35, 2.1, 2.65, MAT.wallPaper, -4.3, 1.75, 2.875, 0, base);                     // front of window
box(0.35, 2.1, 3.05, MAT.wallPaper, -4.3, 1.75, -1.875, 0, base);                    // back of window
/* wall caps (unlit dark, kill slivers) */
const capMat = new THREE.MeshBasicMaterial({ color:0x241a12 });
const c1 = new THREE.Mesh(new THREE.BoxGeometry(9.05,0.1,0.4), capMat); c1.position.set(0, WALL_H+0.02, -3.05); base.add(c1);
const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.1,7.65), capMat); c2.position.set(-4.3, WALL_H+0.02, 0.4); base.add(c2);
/* wainscot + dado rail */
box(9.0, 0.9, 0.42, MAT.wallGreen, 0, 0.45, -3.02, 0, base);
box(0.42, 0.9, 7.6, MAT.wallGreen, -4.27, 0.45, 0.4, 0, base);
box(9.0, 0.09, 0.46, MAT.woodDark, 0, 0.94, -3.0, 0, base);
box(0.46, 0.09, 7.6, MAT.woodDark, -4.25, 0.94, 0.4, 0, base);
/* skirting */
box(9.0, 0.16, 0.44, MAT.woodDark, 0, 0.08, -2.98, 0, base);
box(0.44, 0.16, 7.6, MAT.woodDark, -4.23, 0.08, 0.4, 0, base);

/* wallpaper damask dots (subtle lighter quads on back wall) */
const dotMat = new THREE.MeshStandardMaterial({ color:0x6b563c, roughness:0.95 });
for (let r=0;r<3;r++) for (let i=0;i<12;i++){
  const d = new THREE.Mesh(new THREE.CircleGeometry(0.09,6), dotMat);
  d.position.set(-4.0+i*0.72+(r%2)*0.36, 1.35+r*0.62, -2.865);
  base.add(d);
}

/* ---------- fireplace (back wall, left of center) ---------- */
const FP_X = -1.5, FP_Z = -2.72;
box(2.2, 1.5, 0.5, MAT.marble, FP_X, 0.75, FP_Z, 0, base);                        // surround
box(1.2, 1.0, 0.55, MAT.iron, FP_X, 0.5, FP_Z+0.03, 0, base);                     // firebox
box(2.5, 0.18, 0.66, MAT.marble, FP_X, 1.58, FP_Z, 0, base);                      // mantel shelf
box(2.4, 0.14, 0.6, MAT.woodDark, FP_X, 0.07, FP_Z+0.1, 0, base);                 // hearth
for (const s of [-1,1]) box(0.18, 1.32, 0.56, MAT.marble, FP_X+s*0.95, 0.75, FP_Z, 0, base);
/* logs + fire */
const log1 = cyl(0.09,0.09,0.8, MAT.woodDark, FP_X, 0.22, FP_Z+0.15); log1.rotation.z = Math.PI/2; log1.rotation.y = 0.3;
const log2 = cyl(0.08,0.08,0.7, MAT.woodDark, FP_X, 0.3, FP_Z+0.12);  log2.rotation.z = Math.PI/2; log2.rotation.y = -0.4;
const flameMat = new THREE.MeshBasicMaterial({ color:0xffa53a, transparent:true, opacity:0.95 });
const flameMat2 = new THREE.MeshBasicMaterial({ color:0xffd77a, transparent:true, opacity:0.9 });
const flames = [];
for (let i=0;i<5;i++){
  const f = new THREE.Mesh(new THREE.ConeGeometry(0.13-i*0.014, 0.5-i*0.05, 6), i%2?flameMat2:flameMat);
  f.position.set(FP_X-0.24+i*0.12, 0.5, FP_Z+0.15);
  base.add(f); flames.push(f);
}
const emberMat = new THREE.MeshBasicMaterial({ color:0xff6a22 });
const embers = [];
for (let i=0;i<7;i++) embers.push(sph(0.035, emberMat, FP_X-0.3+i*0.1, 0.16, FP_Z+0.18, base, 6,5));
/* fire tools + scuttle */
cyl(0.16,0.2,0.3, MAT.iron, FP_X+1.35, 0.15, FP_Z+0.5, 10, base);
box(0.05,0.7,0.05, MAT.iron, FP_X+1.6, 0.35, FP_Z+0.45, 0.2, base);
/* mantel dressing: skull, letters, candle, small bust */
const skull = new THREE.Group(); skull.position.set(FP_X-0.75, 1.78, FP_Z); base.add(skull);
sph(0.13, MAT.bone, 0, 0.02, 0, skull, 12, 10);
box(0.16, 0.09, 0.14, MAT.bone, 0, -0.09, 0.02, 0, skull);
const eyeMat = new THREE.MeshBasicMaterial({ color:0x1a1512 });
sph(0.028, eyeMat, -0.05, 0.03, 0.115, skull, 6,5);
sph(0.028, eyeMat, 0.05, 0.03, 0.115, skull, 6,5);
for (let i=0;i<3;i++) box(0.34,0.02,0.24, MAT.paper, FP_X+0.1+i*0.03, 1.69+i*0.025, FP_Z, 0.15*i, base);
cyl(0.035,0.045,0.22, MAT.paper, FP_X+0.75, 1.78, FP_Z, 8, base);
cyl(0.09,0.11,0.05, MAT.brass, FP_X+0.75, 1.69, FP_Z, 10, base);
const candleFlame = new THREE.Mesh(new THREE.ConeGeometry(0.02,0.07,6), flameMat2);
candleFlame.position.set(FP_X+0.75, 1.93, FP_Z); base.add(candleFlame);

/* ---------- window (left wall) with London outside ---------- */
const WIN_X = -4.28, WIN_Z = 0.6, WIN_W = 1.9, WIN_H = 2.1, WIN_Y = 1.75;
/* window trim: four rails around a REAL opening (no center slab) */
box(0.5, 0.15, WIN_W+0.3, MAT.woodDark, WIN_X, 2.875, WIN_Z, 0, base);   // top rail
box(0.5, 0.15, WIN_W+0.3, MAT.woodDark, WIN_X, 0.625, WIN_Z, 0, base);   // bottom rail
box(0.5, WIN_H+0.3, 0.15, MAT.woodDark, WIN_X, WIN_Y, -0.425, 0, base);  // back jamb
box(0.5, WIN_H+0.3, 0.15, MAT.woodDark, WIN_X, WIN_Y, 1.625, 0, base);   // front jamb
/* glass pane (translucent, shows outside) */
const paneMat = new THREE.MeshBasicMaterial({ color:0x7f9cbd, transparent:true, opacity:0.42 });
const pane = new THREE.Mesh(new THREE.BoxGeometry(0.06, WIN_H, WIN_W), paneMat);
pane.position.set(WIN_X-0.16, WIN_Y, WIN_Z); base.add(pane);
/* mullions */
box(0.1, WIN_H, 0.07, MAT.woodDark, WIN_X+0.05, WIN_Y, WIN_Z, 0, base);
box(0.1, 0.07, WIN_W, MAT.woodDark, WIN_X+0.05, WIN_Y, WIN_Z, 0, base);
box(0.1, WIN_H, 0.06, MAT.woodDark, WIN_X+0.05, WIN_Y, WIN_Z-WIN_W/2, 0, base);
box(0.1, WIN_H, 0.06, MAT.woodDark, WIN_X+0.05, WIN_Y, WIN_Z+WIN_W/2, 0, base);
box(0.1, 0.06, WIN_W, MAT.woodDark, WIN_X+0.05, WIN_Y-WIN_H/2, WIN_Z, 0, base);
box(0.1, 0.06, WIN_W, MAT.woodDark, WIN_X+0.05, WIN_Y+WIN_H/2, WIN_Z, 0, base);
/* sill */
box(0.56, 0.1, WIN_W+0.4, MAT.marble, WIN_X+0.03, WIN_Y-WIN_H/2-0.08, WIN_Z, 0, base);
/* curtains */
for (const s of [-1,1]){
  const cur = rbox(0.24, WIN_H+0.5, 0.42, 0.08, MAT.curtain, WIN_X+0.35, WIN_Y+0.05, WIN_Z+s*(WIN_W/2+0.46), 0, base);
  cur.rotation.x = s*0.16;
}
/* outside world group (behind left wall) */
const outside = new THREE.Group(); base.add(outside);
/* layered foggy-night backdrop (flat painted layers, miniature style) */
const bdG = new THREE.Group(); outside.add(bdG);
const bdSkyMat = new THREE.MeshBasicMaterial({ color:0x22334a });
box(0.05, 1.3, 3.2, bdSkyMat, -5.1, 1.85, WIN_Z, 0, bdG);   // night sky band
const bdFogMat = new THREE.MeshBasicMaterial({ color:0x47607c });
box(0.05, 0.9, 3.2, bdFogMat, -5.08, 0.75, WIN_Z, 0, bdG);  // fog band
const bdGlowMat = new THREE.MeshBasicMaterial({ color:0x7d92a8 });
box(0.05, 0.3, 3.2, bdGlowMat, -5.06, 0.15, WIN_Z, 0, bdG); // pale street glow
/* moon */
const moonMat = new THREE.MeshBasicMaterial({ color:0xe4ecf6, transparent:true });
const moon = new THREE.Mesh(new THREE.CircleGeometry(0.2, 20), moonMat);
moon.position.set(-5.04, 1.95, WIN_Z-0.35); moon.rotation.y = Math.PI/2; bdG.add(moon);
const moonHalo = new THREE.Mesh(new THREE.CircleGeometry(0.38, 20), new THREE.MeshBasicMaterial({ color:0xb9cadd, transparent:true, opacity:0.25, depthWrite:false }));
moonHalo.position.set(-5.05, 1.95, WIN_Z-0.35); moonHalo.rotation.y = Math.PI/2; bdG.add(moonHalo);
/* distant rooftop silhouettes against the fog band */
for (const [rz, rw, rh] of [[-0.95,0.7,0.36],[0.15,0.9,0.48],[1.0,0.6,0.3]]){
  box(0.06, rh, rw, new THREE.MeshBasicMaterial({ color:0x18222e }), -5.02, 0.3+rh/2, WIN_Z+rz, 0, bdG);
}
/* street facade silhouette */

/* ---------- tap handling ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const fireProxy = new THREE.Mesh(new THREE.BoxGeometry(1.7,1.6,0.9), new THREE.MeshBasicMaterial({visible:false}));
fireProxy.position.set(FP_X, 0.8, FP_Z+0.2); scene.add(fireProxy);

magProxy.position.set(0.08, 0.62, -0.05); scene.add(magProxy);
const tapTargets = [fireProxy, winProxy, magProxy];

let downX=0, downY=0, downT=0, lastUp=0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); });
renderer.domElement.addEventListener('pointerup', e=>{
  const now = performance.now();
  if (now - lastUp < 150) return;
  if (now - downT > 350) return;
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 8) return;
  lastUp = now;
  ptr.x = (e.clientX/innerWidth)*2-1;
  ptr.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(tapTargets, false);
  if (!hits.length) return;
  window.__tvSfx&&window.__tvSfx();
  const o = hits[0].object;
  if (o === fireProxy){ fireTarget = fireTarget ? 0 : 1; return; }
  if (o === winProxy){ dayTarget = dayTarget ? 0 : 1; setPill(); return; }
  if (o === magProxy){ deduceTarget = deduceTarget ? 0 : 1; return; }
});

/* ---------- tick ---------- */
const clock = new THREE.Clock();
let t = 0;
const nightSky = new THREE.Color(0x191309);
const daySky = new THREE.Color(0x2e3138);
const nightFog = new THREE.Color(0x120e0a);
const dayFog = new THREE.Color(0x24262c);
const nightWin = new THREE.Color(0x7a90b8);
const cN1 = new THREE.Color(0x22334a), cD1 = new THREE.Color(0x9fc4e8);
const cN2 = new THREE.Color(0x47607c), cD2 = new THREE.Color(0xc8d8e8);
const cN3 = new THREE.Color(0x7d92a8), cD3 = new THREE.Color(0xeef3f6);
const dayWin = new THREE.Color(0xb8c0c8);
const nightHemiSky = new THREE.Color(0x8a7a5a);
const dayHemiSky = new THREE.Color(0x9aa2ac);
const tmpC = new THREE.Color();

function tick(){
  requestAnimationFrame(tick);
  const rawDt = Math.min(clock.getDelta(), 1.0);
  const dt = Math.min(rawDt, 0.05);
  t += rawDt;

  /* blends run on real elapsed time so states settle under throttled rAF */
  dayBlend += (dayTarget - dayBlend) * Math.min(1, rawDt*2.2);
  fireBlend += (fireTarget - fireBlend) * Math.min(1, rawDt*2.6);
  deduceBlend += (deduceTarget - deduceBlend) * Math.min(1, rawDt*3.0);

  /* day/night */
  scene.background = tmpC.copy(nightSky).lerp(daySky, dayBlend).clone();
  scene.fog.color.copy(nightFog).lerp(dayFog, dayBlend);
  windowLight.color.copy(nightWin).lerp(dayWin, dayBlend);
  windowLight.intensity = 1.0 + dayBlend*1.4;
  /* window backdrop follows day/night */
  bdSkyMat.color.copy(tmpC.copy(cN1).lerp(cD1, dayBlend));
  bdFogMat.color.copy(tmpC.copy(cN2).lerp(cD2, dayBlend));
  bdGlowMat.color.copy(tmpC.copy(cN3).lerp(cD3, dayBlend));
  moonMat.opacity = 1 - dayBlend;
  moonHalo.material.opacity = 0.25 * (1 - dayBlend);
  hemi.color.copy(nightHemiSky).lerp(dayHemiSky, dayBlend);
  hemi.intensity = 1.12 + dayBlend*0.28;
  lampLight.intensity = (1-dayBlend) * (1.3 + Math.sin(t*7.3)*0.12 + Math.sin(t*13.7)*0.06);
  lampGlowMat.opacity = (1-dayBlend) * (0.85 + Math.sin(t*7.3)*0.1);
  lampHaloMat.opacity = (1-dayBlend) * (0.13 + Math.sin(t*7.3)*0.03);
  lampGlow.visible = dayBlend < 0.85; lampHalo.visible = lampGlow.visible;
  candleLight.intensity = (1-dayBlend) * (1.15 + Math.sin(t*9.1)*0.14);
  candleFlameMat.opacity = (1-dayBlend) * (0.9 + Math.sin(t*9.1)*0.08);
  candleCoreMat.opacity = candleFlameMat.opacity;
  candleGlowMat.opacity = (1-dayBlend) * (0.22 + Math.sin(t*9.1)*0.04);
  cFlameO.scale.set(1, 1+Math.sin(t*15)*0.2, 1); cFlameI.scale.copy(cFlameO.scale);
  for (let i=0;i<fogPlanes.length;i++){
    fogPlanes[i].material.opacity = 0.12 - dayBlend*0.07;
    fogPlanes[i].position.z = WIN_Z + 0.2 + Math.sin(t*0.4+i*2.1)*0.3;
  }
  fillLight.intensity = 0.54 + dayBlend*0.18;
  paneMat.color.setHex(dayBlend > 0.5 ? 0xbcc8ce : 0x4a627a);
  facadeG.visible = (innerWidth/innerHeight) >= 0.8;

  /* fire */
  const flick = 1 + Math.sin(t*11.3)*0.08 + Math.sin(t*23.7)*0.05 + Math.sin(t*5.1)*0.06;
  fireLight.intensity = (0.5 + fireBlend*2.8) * flick;
  fireLight.color.setHSL(0.06 + fireBlend*0.015, 0.95, 0.55);
  for (let i=0;i<flames.length;i++){
    const f = flames[i];
    const s = (0.25 + fireBlend*0.85) * (1 + Math.sin(t*9+i*2.4)*0.18);
    f.scale.set(s, s*(1+Math.sin(t*13+i*3.1)*0.22), s);
    f.visible = fireBlend > 0.03;
    f.material.opacity = 0.5 + fireBlend*0.45;
  }
  for (let i=0;i<embers.length;i++){
    const e = embers[i];
    const p = 0.4 + fireBlend*0.6;
    e.scale.setScalar(p * (1 + Math.sin(t*6+i*1.9)*0.25));
  }
  candleFlame.scale.set(1, 1+Math.sin(t*17)*0.25, 1);

  /* deduction clues */
  clueMat.opacity = deduceBlend * (0.8 + Math.sin(t*3.2)*0.2);
  for (const c of clues) c.visible = deduceBlend > 0.02;
  pipeRing.rotation.z = t*0.8;

  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});

/* ---------- loader ---------- */
let firstFrames = 0;
(function waitForFrames(){
  requestAnimationFrame(waitForFrames);
  if (++firstFrames > 8){
    document.getElementById('loader').classList.add('done');
    document.body.classList.add('ready');
  }
})();
</script>
<script>
/* tv-audio v1: procedural ambience + tap sfx. All sounds synthesized, no assets. */
(() => {
  const CFG = {"amb": []};
  const KEY = "tvmini-muted";
  let ctx = null, master = null, analyser = null, NOISE = null, started = false;
  let muted = false;
  try { muted = localStorage.getItem(KEY) === "1"; } catch (e) {}

  const btn = document.createElement("button");
  btn.type = "button";
  btn.setAttribute("aria-label", "Toggle sound");
  btn.style.cssText = "position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(12,14,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.8;transition:opacity .3s";
  const ICON_ON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  const paint = () => { btn.innerHTML = muted ? ICON_OFF : ICON_ON; btn.style.opacity = muted ? ".45" : ".8"; };
  paint();
  document.body.appendChild(btn);

  function ensureCtx(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    master.connect(analyser); analyser.connect(ctx.destination);
    NOISE = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noiseLoop(){ const s = ctx.createBufferSource(); s.buffer = NOISE; s.loop = true; s.start(); return s; }
  function filt(type, f, q){ const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gn(v){ const n = ctx.createGain(); n.gain.value = v; return n; }
  function lfo(freq, amt, param){ const o = ctx.createOscillator(); o.frequency.value = freq; const lg = gn(amt); o.connect(lg); lg.connect(param); o.start(); }
  function hum(f, v){ const o = ctx.createOscillator(); o.frequency.value = f; const g2 = gn(v); o.connect(g2); g2.connect(master); o.start(); }
  function every(minS, maxS, fn){ (function loop(){ if (ctx) fn(); setTimeout(loop, (minS + Math.random() * (maxS - minS)) * 1000); })(); }
  function ping(type, f0, f1, dur, vol){
    const o = ctx.createOscillator(); o.type = type; const g2 = gn(0);
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    o.connect(g2); g2.connect(master);
    g2.gain.setValueAtTime(0, ctx.currentTime);
    g2.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  function shot(dur){
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    const g2 = gn(0); s.connect(g2);
    s.start(); s.stop(ctx.currentTime + dur);
    return g2;
  }
  function echo(dt, fbv, wetv){
    const dl = ctx.createDelay(1); dl.delayTime.value = dt;
    const fb = gn(fbv); dl.connect(fb); fb.connect(dl);
    const wet = gn(wetv); dl.connect(wet); wet.connect(master);
    return dl;
  }

  const R = {
    wind(){ const bp = filt("bandpass", 480, 0.5), g2 = gn(0.09); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.07, 0.045, g2.gain); lfo(0.13, 170, bp.frequency); },
    coldwind(){ const bp = filt("bandpass", 830, 0.7), g2 = gn(0.065); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.09, 0.04, g2.gain); lfo(0.21, 250, bp.frequency); hum(52, 0.026); },
    crackle(){ every(0.05, 0.3, () => { const hp = filt("highpass", 1900), g2 = shot(0.05); g2.connect(hp); hp.connect(master); g2.gain.setValueAtTime(0.015 + Math.random() * 0.045, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.05); }); hum(62, 0.011); },
    murmur(){ const bp = filt("bandpass", 380, 1.1), g2 = gn(0.045); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); every(0.8, 2.4, () => bp.frequency.setTargetAtTime(250 + Math.random() * 380, ctx.currentTime, 0.4)); },
    clink(){ every(4, 9, () => ping("sine", 2000 + Math.random() * 400, 0, 0.16, 0.028)); },
    room(){ const lp = filt("lowpass", 220), g2 = gn(0.02); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); hum(58, 0.009); },
    hum(){ hum(120, 0.011); hum(240, 0.005); const bp = filt("bandpass", 1150, 3), g2 = gn(0.004); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); },
    humsoft(){ hum(100, 0.007); },
    plink(){ const dl = echo(0.42, 0.3, 0.4); every(4.5, 9, () => { const f = [660, 587, 494, 440, 392][Math.floor(Math.random() * 5)]; const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; const g2 = gn(0); o.connect(g2); g2.connect(master); g2.connect(dl); g2.gain.setValueAtTime(0.04, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 1.4); o.start(); o.stop(ctx.currentTime + 1.5); }); },
    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 2.2, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
</script>
