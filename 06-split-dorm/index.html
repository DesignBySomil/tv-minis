<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split Dorm - a tiny scene inspired by Wednesday</title>
<meta name="theme-color" content="#121016">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#121016}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3e8d8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(8,6,12,.44) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#121016;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#c8aee0;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#2e2438;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#c8aee0;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(8,6,12,.95),0 2px 8px rgba(8,6,12,.8),0 4px 22px rgba(8,6,12,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#e2d6ec;margin-top:3px;text-shadow:0 1px 2px rgba(8,6,12,.95),0 2px 6px rgba(8,6,12,.75),0 3px 14px rgba(8,6,12,.5)}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#ece4f2;background:rgba(14,10,20,.55);border:1px solid rgba(230,218,240,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>Split Dorm</h1><p>a tiny scene inspired by Wednesday</p></div>
<div id="hint">tap the window &nbsp;&middot;&nbsp; tap the typewriter &nbsp;&middot;&nbsp; tap the fairy lights</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   SPLIT DORM - one room, two worlds.
   Left half monochrome and severe, right half exploded with
   color. A circular window splits along the same seam.
   All procedural geometry.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241c2c);
scene.fog = new THREE.FogExp2(0x14101c, 0.004);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.15, -0.3);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.4, -1.1, -3.4), new THREE.Vector3(4.4, 0.2, 4.2)),
  new THREE.Box3(new THREE.Vector3(-4.2, 0, -3.2), new THREE.Vector3(4.2, 3.9, 4.0)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8) dir.set(0.42, 0.72, 0.55);
  else dir.set(0.5, 0.5, 0.7);
  dir.normalize();
  let lo = 4, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi);
  camera.lookAt(controls.target);
}
camera.position.set(4.6, 4.4, 6.4);
frameForViewport();

const rand = (a,b)=>a+Math.random()*(b-a);
function M(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.92, metalness:0.0}, opts)); }
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function rbox(w,h,d,r,mat){ const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,mat,seg=12){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,mat,w=10,h=8){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,w,h),mat); m.castShadow=true; m.receiveShadow=true; return m; }

/* ---------- cutaway base: foundation strata + room floor ---------- */
{
  const layers = [
    [8.4, 0.42, 7.6, 0x1a1420],  // deep stratum
    [8.25, 0.3, 7.45, 0x33242e], // brick course
    [8.1, 0.24, 7.3, 0x4d3a42],  // subfloor
  ];
  let ly = 0;
  for (const [w,h,d,c] of layers){
    const m = box(w,h,d,M(c,{roughness:0.98}));
    m.position.set(0, ly-h/2, 0.4); ly -= h;
    m.castShadow = false;
    scene.add(m);
  }
}
const GROUND = 0;
/* floorboards: left half grey-washed, right half warm honey */
{
  const bw = 0.62;
  for (let i=0;i<13;i++){
    const x = -3.72 + i*bw;
    const warm = x > 0.05;
    const tone = warm ? (0x9a6b48 + ((i%3)-1)*0x060402) : (0x6e6a70 + ((i%3)-1)*0x040404);
    const b = box(bw-0.035, 0.07, 6.9, M(tone,{roughness:0.85}));
    b.position.set(x, GROUND-0.012, 0.4);
    b.castShadow = false;
    scene.add(b);
    // board end seams
    for (let s=0;s<2;s++){
      const seam = box(bw-0.05, 0.012, 0.03, M(0x241c22,{roughness:1}));
      seam.position.set(x, GROUND+0.025, -2.4 + ((i*1.7+s*2.9)%5.6));
      seam.castShadow = false;
      scene.add(seam);
    }
  }
}

/* ---------- walls: back (with circular window) + left return ---------- */
const WALL_H = 3.55, WALL_T = 0.22, WALL_Z = -2.85;
const wallM = M(0x685a70,{roughness:0.96});       // dusty plum plaster
const wallML = M(0x564e58,{roughness:0.96});      // left half, greyed
const wainsM = M(0x2c2230,{roughness:0.9});
const windowGroup = new THREE.Group();
{
  const WIN_R = 0.95, WIN_Y = 2.05;
  // back wall slabs around the circular opening: bottom band, top band, left/right cheeks
  const bot = box(8.1, 1.02, WALL_T, wallM); bot.position.set(0, 0.51, WALL_Z); scene.add(bot);
  const top = box(8.1, WALL_H-(WIN_Y+WIN_R)+0.06, WALL_T, wallM);
  top.position.set(0, (WALL_H+WIN_Y+WIN_R)/2+0.03, WALL_Z); scene.add(top);
  const cheekW = (8.1/2 - WIN_R);
  const chL = box(cheekW, WIN_R*2+0.04, WALL_T, wallML); chL.position.set(-(WIN_R+cheekW/2), WIN_Y, WALL_Z); scene.add(chL);
  const chR = box(cheekW, WIN_R*2+0.04, WALL_T, wallM); chR.position.set(WIN_R+cheekW/2, WIN_Y, WALL_Z); scene.add(chR);
  // wainscot rail + baseboard, split tone at the seam
  for (const [x0,w,mat] of [[-4.05,4.05,wainsM],[0,4.05,M(0x3a2a38,{roughness:0.9})]]){
    const rail = box(w, 0.09, WALL_T+0.05, mat); rail.position.set(x0+w/2- (x0?0:0)+ (x0?0:0), 1.06, WALL_Z); scene.add(rail);
    const base = box(w, 0.16, WALL_T+0.07, mat); base.position.set(x0+w/2, 0.08, WALL_Z); scene.add(base);
  }
  // left return wall (Wednesday side only, her corner)
  const ret = box(WALL_T, WALL_H, 6.6, wallML); ret.position.set(-4.0, WALL_H/2, 0.35); scene.add(ret);
  const retBase = box(WALL_T+0.07, 0.16, 6.6, wainsM); retBase.position.set(-4.0, 0.08, 0.35); scene.add(retBase);
  const retRail = box(WALL_T+0.05, 0.09, 6.6, wainsM); retRail.position.set(-4.0, 1.06, 0.35); scene.add(retRail);

  // circular window: ring frame, half-split panes
  const ring = new THREE.Mesh(new THREE.TorusGeometry(WIN_R+0.06, 0.09, 10, 40), M(0x1f1826,{roughness:0.6, metalness:0.25}));
  ring.position.set(0, WIN_Y, WALL_Z); ring.castShadow = true; windowGroup.add(ring);
  const cross = M(0x1f1826,{roughness:0.6, metalness:0.25});
  const mullV = box(0.07, WIN_R*2, 0.09, cross); mullV.position.set(0, WIN_Y, WALL_Z); windowGroup.add(mullV);
  const mullH = box(WIN_R*2, 0.07, 0.09, cross); mullH.position.set(0, WIN_Y, WALL_Z); windowGroup.add(mullH);
  // panes: left half smoky dark glass; right half four candy wedges
  const glassL = new THREE.Mesh(new THREE.CircleGeometry(WIN_R, 24, Math.PI/2, Math.PI),
    M(0x2b3346,{roughness:0.25, metalness:0.1, emissive:0x0c1220, emissiveIntensity:0.7}));
  glassL.position.set(0, WIN_Y, WALL_Z-0.04); windowGroup.add(glassL);
  const candy = [0xe86a92, 0xf2b64f, 0x7fc86e, 0x5f9fd8];
  for (let i=0;i<4;i++){
    const wedge = new THREE.Mesh(new THREE.CircleGeometry(WIN_R, 12, -Math.PI/2 + i*Math.PI/4, Math.PI/4),
      M(candy[i],{roughness:0.35, emissive:candy[i], emissiveIntensity:0.28}));
    wedge.position.set(0, WIN_Y, WALL_Z-0.04); windowGroup.add(wedge);
  }
  windowGroup.userData.glassL = glassL;
  windowGroup.userData.wedges = windowGroup.children.filter(c=>c.geometry && c.geometry.type==='CircleGeometry' && c!==glassL);
  scene.add(windowGroup);
}
/* sky bands + moon + stars OUTSIDE the window (flat backdrop plane stack) */
const skyBands = [];
let moonMesh, starPts;
{
  const bandCols = [0x9fb8d8, 0xc9d4de, 0xe6ddc8];
  for (let i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 1.06), new THREE.MeshBasicMaterial({color:bandCols[i], fog:false}));
    b.position.set(0, 2.72 - i*0.97, WALL_Z-0.6);
    scene.add(b); skyBands.push(b);
  }
  moonMesh = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), new THREE.MeshBasicMaterial({color:0xf2ead0, fog:false, transparent:true, opacity:0}));
  moonMesh.position.set(-0.62, 2.78, WALL_Z-0.55); scene.add(moonMesh);
  const sg = new THREE.BufferGeometry(); const sp=[];
  for (let i=0;i<60;i++) sp.push(rand(-1.2,1.2), rand(0.7,3.1), WALL_Z-0.5);
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp,3));
  starPts = new THREE.Points(sg, new THREE.PointsMaterial({color:0xd8e2f8, size:0.05, transparent:true, opacity:0, fog:false}));
  scene.add(starPts);
}

/* ---------- LEFT: monochrome side ---------- */
const blackMetal = M(0x17161a,{roughness:0.45, metalness:0.6});
const darkWood = M(0x2c2626,{roughness:0.8});
const candleFlames = [];
const typeGroup = new THREE.Group();
{
  // iron bed: posts, rails, headboard bars
  const bed = new THREE.Group();
  for (const [px,pz] of [[-3.55,-2.35],[-1.85,-2.35],[-3.55,-1.05],[-1.85,-1.05]]){
    const post = cyl(0.045,0.045,0.78,blackMetal,8); post.position.set(px,0.39,pz); bed.add(post);
    const knob = sph(0.06,blackMetal,8,6); knob.position.set(px,0.82,pz); bed.add(knob);
  }
  const frame = box(1.76, 0.1, 1.36, blackMetal); frame.position.set(-2.7, 0.5, -1.7); bed.add(frame);
  for (let i=0;i<5;i++){
    const bar = cyl(0.022,0.022,0.62,blackMetal,6); bar.position.set(-3.42+i*0.36, 0.85, -2.35); bed.add(bar);
  }
  const headRail = cyl(0.03,0.03,1.68,blackMetal,8); headRail.rotation.z=Math.PI/2; headRail.position.set(-2.7,1.16,-2.35); bed.add(headRail);
  const mattress = rbox(1.68, 0.22, 1.28, 0.05, M(0xb8b4ae,{roughness:0.95})); mattress.position.set(-2.7, 0.66, -1.7); bed.add(mattress);
  // black-and-white striped blanket, draped
  for (let i=0;i<10;i++){
    const st = box(1.7, 0.05, 0.125, M(i%2? 0x1c1a1e : 0xd8d4cc,{roughness:0.95}));
    st.position.set(-2.7, 0.79+Math.sin(i*0.8)*0.008, -1.45+i*0.128); st.rotation.x = 0.02; bed.add(st);
  }
  const throwP = rbox(0.4,0.12,0.28,0.05, M(0x3a363c,{roughness:0.95})); throwP.position.set(-3.0,0.83,-2.05); throwP.rotation.y=-0.15; bed.add(throwP);
  const pillow = rbox(0.7,0.14,0.42,0.05, M(0xf0ece4,{roughness:0.95})); pillow.position.set(-2.7,0.82,-2.12); pillow.rotation.y=0.04; bed.add(pillow);
  scene.add(bed);

  // nightstand + candle
  const ns = box(0.5,0.5,0.42,darkWood); ns.position.set(-1.5,0.25,-2.4); scene.add(ns);
  const drawer = box(0.4,0.16,0.03,M(0x3a3232,{roughness:0.8})); drawer.position.set(-1.5,0.3,-2.18); scene.add(drawer);
  const knob2 = sph(0.025,M(0x8a8a8a,{metalness:0.7,roughness:0.35}),8,6); knob2.position.set(-1.5,0.3,-2.15); scene.add(knob2);
  const candle = cyl(0.045,0.05,0.22,M(0xe8e2d4,{roughness:0.6}),10); candle.position.set(-1.56,0.61,-2.42); scene.add(candle);
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.025,0.09,8),
    new THREE.MeshStandardMaterial({color:0xffc860, emissive:0xff9830, emissiveIntensity:2.4, transparent:true, opacity:0.95}));
  flame.position.set(-1.56,0.78,-2.42); scene.add(flame);
  const candleLight = new THREE.PointLight(0xffa848, 0.0, 2.6, 1.8); candleLight.position.set(-1.56,0.85,-2.42); scene.add(candleLight);
  candleFlames.push({flame, light:candleLight, seed:rand(0,100)});
  const book2 = box(0.3,0.05,0.22,M(0x4a4446,{roughness:0.85})); book2.position.set(-1.38,0.53,-2.36); scene.add(book2);

  // writing desk + typewriter + books + ink
  const desk = new THREE.Group();
  const dtop = box(1.5,0.07,0.72,darkWood); dtop.position.set(-1.35,0.76,-0.6); desk.add(dtop);
  for (const [px,pz] of [[-2.02,-0.88],[-0.68,-0.88],[-2.02,-0.32],[-0.68,-0.32]]){
    const leg = box(0.07,0.76,0.07,darkWood); leg.position.set(px,0.38,pz); desk.add(leg);
  }
  // typewriter (tap target)
  typeGroup.position.set(-1.35,0.8,-0.6);
  const tbase = rbox(0.52,0.1,0.4,0.03,M(0x1d1b1f,{roughness:0.4,metalness:0.35})); tbase.position.y=0.05; typeGroup.add(tbase);
  const tbody = rbox(0.44,0.14,0.3,0.03,M(0x262429,{roughness:0.4,metalness:0.35})); tbody.position.set(0,0.16,-0.03); typeGroup.add(tbody);
  const roller = cyl(0.045,0.045,0.44,M(0x0f0e12,{roughness:0.5}),10); roller.rotation.z=Math.PI/2; roller.position.set(0,0.26,-0.14); typeGroup.add(roller);
  const paper = box(0.3,0.34,0.012,M(0xf2eee2,{roughness:0.9})); paper.position.set(0,0.42,-0.15); paper.rotation.x=-0.12; typeGroup.add(paper);
  typeGroup.userData.paper = paper;
  typeGroup.userData.roller = roller;
  const keyM = M(0x111014,{roughness:0.5});
  typeGroup.userData.keys = [];
  for (let r=0;r<3;r++) for (let k=0;k<9;k++){
    const key = cyl(0.02,0.024,0.02,keyM,6);
    key.position.set(-0.18+k*0.045+(r%2)*0.02, 0.13+r*0.028, 0.13-r*0.055);
    typeGroup.add(key); typeGroup.userData.keys.push(key);
  }
  // typed lines appear on the paper per tap
  typeGroup.userData.lineM = M(0x2a2626,{roughness:1});
  typeGroup.userData.lineCount = 0;
  scene.add(typeGroup);
  // book stack + ink bottle + quill cup
  const stackCols = [0x3c3438, 0x22201f, 0x54484a, 0x2e2a2c];
  stackCols.forEach((c,i)=>{
    const bk = box(0.34-i*0.02, 0.05, 0.24, M(c,{roughness:0.85}));
    bk.position.set(-1.95, 0.825+i*0.05, -0.55); bk.rotation.y = rand(-0.12,0.12); scene.add(bk);
  });
  const ink = cyl(0.05,0.06,0.11,M(0x10141c,{roughness:0.3,metalness:0.2}),8); ink.position.set(-0.78,0.85,-0.75); scene.add(ink);

  // cello leaning in the corner
  const cello = new THREE.Group();
  const celloM = M(0x4a3226,{roughness:0.55});
  const bodyL = sph(0.26,celloM,12,10); bodyL.scale.set(1,1.15,0.42); cello.add(bodyL);
  const bodyU = sph(0.2,celloM,12,10); bodyU.scale.set(1,1.1,0.42); bodyU.position.y=0.34; cello.add(bodyU);
  const waist = box(0.22,0.18,0.16,celloM); waist.position.y=0.18; cello.add(waist);
  const neck = box(0.05,0.62,0.05,darkWood); neck.position.y=0.78; cello.add(neck);
  const scroll = sph(0.05,darkWood,8,6); scroll.position.y=1.1; cello.add(scroll);
  const bridge = box(0.12,0.08,0.02,M(0xcbb894,{roughness:0.8})); bridge.position.set(0,0.16,0.09); cello.add(bridge);
  cello.position.set(-3.6,0.28,-0.5); cello.rotation.set(-0.06,0.5,0.1);
  scene.add(cello);

  // wall art: black frame, white mat, ink stroke
  const frm = box(0.62,0.78,0.04,M(0x121014,{roughness:0.5})); frm.position.set(-3.87,2.15,-1.2); frm.rotation.y=Math.PI/2; scene.add(frm);
  const mat = box(0.5,0.66,0.015,M(0xe6e2d8,{roughness:0.9})); mat.position.set(-3.84,2.15,-1.2); mat.rotation.y=Math.PI/2; scene.add(mat);
  const stroke = box(0.02,0.4,0.16,M(0x1a181c,{roughness:1})); stroke.position.set(-3.83,2.12,-1.2); stroke.rotation.x=0.2; scene.add(stroke);
  // small shelf with a skull-ish curio + dead twigs

/* ---------- dust motes: silver left, gold right ---------- */
const DUST_N = 70;
const dustGeo = new THREE.BufferGeometry();

for (let i=0;i<DUST_N;i++){

/* ---------- states: window light + mood ---------- */
const STATES = [
  { name:'day',
    sky:[0x9fb8d8, 0xc9d4de, 0xe6ddc8], hemi:[0xcfd8e8, 0x4a3a48, 1.6], sunC:0xfff0d8, sunI:1.9, moonI:0,
    fillI:0.5, exp:1.22, stars:0, moon:0, fairy:0.5, lamp:0.55, candle:0.0, glass:0.7, dust:0.35 },
  { name:'dusk',
    sky:[0x8a6a9a, 0xd88a6a, 0xf2b878], hemi:[0xd8b49a, 0x463040, 1.15], sunC:0xffb060, sunI:1.2, moonI:0.1,
    fillI:0.45, exp:1.16, stars:0.2, moon:0.25, fairy:0.9, lamp:0.8, candle:0.5, glass:0.9, dust:0.42 },
  { name:'night',
    sky:[0x141c30, 0x1d2842, 0x27354e], hemi:[0x4a5878, 0x241c28, 0.66], sunC:0x8898d8, sunI:0.0, moonI:0.9,
    fillI:0.38, exp:1.1, stars:1, moon:1, fairy:1.5, lamp:1.0, candle:1.4, glass:1.4, dust:0.5 },
];
let stateIdx = 0;
let blend = { t:1, from:STATES[0], to:STATES[0] };
function applyState(s){
  skyBands.forEach((b,i)=>b.material.color.set(s.sky[i]));
  hemi.color.set(s.hemi[0]); hemi.groundColor.set(s.hemi[1]); hemi.intensity = s.hemi[2];
  sun.color.set(s.sunC); sun.intensity = s.sunI;
  moonLight.intensity = s.moonI;
  fill.intensity = s.fillI;
  renderer.toneMappingExposure = s.exp;
  starPts.material.opacity = s.stars;
  moonMesh.material.opacity = s.moon;
  dustMat.opacity = s.dust;
  fairyLight.intensity = 0.55 * s.fairy;
  for (const f of fairyBulbs) f.base = 1.4 * s.fairy;
  windowGroup.userData.glassL.material.emissiveIntensity = 0.7 * s.glass;
  for (const w of windowGroup.userData.wedges) w.material.emissiveIntensity = 0.28 * s.glass;
  for (const cf of candleFlames) cf.light.intensity = 0.55 * s.candle;
  candleFlames.forEach(cf=>cf.flame.material.emissiveIntensity = 1.2 + 1.2*s.candle);
  lampLightRef.intensity = 0.7 * s.lamp;
  shadeRef.emissiveIntensity = 0.5 + 0.5*s.lamp;
}
function mixStates(p,n,t){
  const mixC=(a,b)=>new THREE.Color(a).lerp(new THREE.Color(b),t).getHex();
  const mixN=(a,b)=>a+(b-a)*t;
  return {
    sky:[0,1,2].map(i=>mixC(p.sky[i],n.sky[i])),
    hemi:[mixC(p.hemi[0],n.hemi[0]), mixC(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
    sunC:mixC(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI), moonI:mixN(p.moonI,n.moonI),
    fillI:mixN(p.fillI,n.fillI), exp:mixN(p.exp,n.exp), stars:mixN(p.stars,n.stars),
    moon:mixN(p.moon,n.moon), fairy:mixN(p.fairy,n.fairy), lamp:mixN(p.lamp,n.lamp),
    candle:mixN(p.candle,n.candle), glass:mixN(p.glass,n.glass), dust:mixN(p.dust,n.dust),
  };
}
function cycleState(){
  const from = blend.t >= 1 ? STATES[stateIdx] : mixStates(blend.from, blend.to, blend.t);
  stateIdx = (stateIdx+1) % STATES.length;
  blend = { t:0, from, to:STATES[stateIdx] };
}

/* ---------- typewriter clack ---------- */
let clackT = -1;
function clack(){
  clackT = 0;
  const u = typeGroup.userData;
  u.lineCount = Math.min(u.lineCount+1, 7);
  const line = box(0.2, 0.012, 0.014, u.lineM);
  line.position.set(0, 0.52 - u.lineCount*0.035, -0.137);
  line.rotation.x = -0.12;
  line.castShadow = false;
  typeGroup.add(line);
  u.paper.position.y += 0.012;
  u.roller.rotation.x += 0.35;
}

/* ---------- fairy twinkle toggle ---------- */
let fairyChase = false;

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = 0, downPos = [0,0];
renderer.domElement.addEventListener('pointerdown', e=>{
  downAt = performance.now(); downPos = [e.clientX, e.clientY];
});
let lastUpAt = -999;
renderer.domElement.addEventListener('pointerup', e=>{
  try{
    window.__tapLog = window.__tapLog||[];
    const nowUp = performance.now();
    if (nowUp - lastUpAt < 150){ __tapLog.push(['dup']); return; }
    lastUpAt = nowUp;
    if (nowUp-downAt > 350){ __tapLog.push(['slow', Math.round(nowUp-downAt)]); return; }
    if (Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]) > 8){ __tapLog.push(['drag']); return; }
    ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(ptr, camera);
    const tH = ray.intersectObjects([typeGroup], true).length;
    const fH = ray.intersectObjects([fairyGroup], true).length;
    const wH = ray.intersectObjects([windowGroup], true).length;
    __tapLog.push([Math.round(e.clientX), Math.round(e.clientY), tH, fH, wH]);
    if (tH){ clack(); return; }
    if (fH){ fairyChase = !fairyChase; return; }
    if (wH){ cycleState(); return; }
  }catch(err){ (window.__tapLog=window.__tapLog||[]).push(['ERR', String(err && err.message || err)]); }
});

/* ---------- resize / loop ---------- */
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});
const clock = new THREE.Clock();
let elapsed = 0;
function tick(){
  requestAnimationFrame(tick);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  elapsed += dt;

  if (blend.t < 1){
    blend.t = Math.min(1, blend.t + rawDt/1.6);
    applyState(mixStates(blend.from, blend.to, blend.t));
  }

  // candle flicker
  for (const cf of candleFlames){
    const s = cf.light.intensity;
    if (s > 0.05){
      cf.flame.scale.set(1+Math.sin(elapsed*11+cf.seed)*0.15, 1+Math.sin(elapsed*13+cf.seed)*0.22, 1);
      cf.light.intensity = s*(0.92+Math.random()*0.16);
    }
  }
  // fairy twinkle / chase
  for (const f of fairyBulbs){
    f.m.emissiveIntensity = fairyChase
      ? f.base * (0.35 + 1.15*Math.max(0,Math.sin(elapsed*4 + f.seed)))
      : f.base * (0.85 + 0.15*Math.sin(elapsed*1.4 + f.seed));
  }
  // typewriter clack animation
  if (clackT >= 0){
    clackT += dt;
    const k = Math.min(clackT/0.28, 1);
    const dip = Math.sin(k*Math.PI);
    typeGroup.userData.keys.forEach((key,i)=>{ key.position.y -= 0; key.scale.y = 1 - dip*0.4*((i*7)%3===0?1:0.3); });
    typeGroup.position.x = -1.35 + dip*0.01;
    if (k>=1){ clackT = -1; typeGroup.userData.keys.forEach(key=>key.scale.y=1); typeGroup.position.x=-1.35; }
  }
  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i=0;i<DUST_N;i++){
    dp[i*3+1] += dt*0.04;
    dp[i*3] += Math.sin(elapsed*0.5 + i)*dt*0.015;
    if (dp[i*3+1] > 3.4) dp[i*3+1] = 0.15;
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
applyState(STATES[stateIdx]);
tick();
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
  document.body.classList.add('ready');
}, 700);
</script>
