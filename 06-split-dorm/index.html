<!DOCTYPE html>
<html lang="en">
<head>

<title>Split Dorm - a tiny scene inspired by Wednesday</title>
<meta name="theme-color" content="#121016">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#121016}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3e8d8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 58%,rgba(8,6,12,.30) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#121016;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#c8aee0;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#2e2438;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#c8aee0;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(8,6,12,.95),0 2px 8px rgba(8,6,12,.8),0 4px 22px rgba(8,6,12,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#e2d6ec;margin-top:3px;text-shadow:0 1px 2px rgba(8,6,12,.95),0 2px 6px rgba(8,6,12,.75),0 3px 14px rgba(8,6,12,.5)}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#ece4f2;background:rgba(14,10,20,.55);border:1px solid rgba(230,218,240,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>Split Dorm</h1><p>a tiny scene inspired by Wednesday</p></div>
<div id="hint">tap the window &nbsp;&middot;&nbsp; tap the typewriter &nbsp;&middot;&nbsp; tap the fairy lights</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   SPLIT DORM - one room, two worlds.
   Left half colorful Enid, right half monochrome Wednesday, with
   color. A circular window splits along the same seam.
   All procedural geometry.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c12);
scene.fog = new THREE.FogExp2(0x08070e, 0.005);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.15, -0.3);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.4, -1.1, -3.4), new THREE.Vector3(4.4, 0.2, 4.2)),
  new THREE.Box3(new THREE.Vector3(-4.2, 0, -3.2), new THREE.Vector3(4.2, 5.4, 4.0)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}

/* shift camera+orbit-target in the screen plane so the projected model
   bounding box lands at viewport centre (small lift for the hint pill) */
function centerProjectedModel(){
  for (let pass = 0; pass < 2; pass++){
    camera.updateMatrixWorld();
    const p = new THREE.Vector3();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const c of FIT_CORNERS){
      p.copy(c).project(camera);
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const dist = camera.position.distanceTo(controls.target);
    const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    const halfW = halfH * camera.aspect;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    controls.target.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    camera.lookAt(controls.target);
  }
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8) dir.set(0.28, 0.55, 0.9);
  else dir.set(0.28, 0.46, 0.9);
  dir.normalize();
  let lo = 4, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi);
  camera.lookAt(controls.target);
  centerProjectedModel();
}
camera.position.set(4.6, 4.4, 6.4);
frameForViewport();

const rand = (a,b)=>a+Math.random()*(b-a);
function M(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.92, metalness:0.0}, opts)); }
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function rbox(w,h,d,r,mat){ const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,mat,seg=12){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,mat,w=10,h=8){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,w,h),mat); m.castShadow=true; m.receiveShadow=true; return m; }

/* ---------- cutaway base: foundation strata + room floor ---------- */
{
  const layers = [
    [8.4, 0.42, 7.6, 0x1a1420],  // deep stratum
    [8.25, 0.3, 7.45, 0x33242e], // brick course
    [8.1, 0.24, 7.3, 0x4d3a42],  // subfloor
  ];
  let ly = 0;
  for (const [w,h,d,c] of layers){
    const m = box(w,h,d,M(c,{roughness:0.98}));
    m.position.set(0, ly-h/2, 0.4); ly -= h;
    m.castShadow = false;
    scene.add(m);
  }
}
const GROUND = 0;
/* floorboards: left half grey-washed, right half warm honey */
{
  const bw = 0.62;
  for (let i=0;i<13;i++){
    const x = -3.72 + i*bw;
    const warm = true;
    const tone = warm ? (0x7d5a3d + ((i%3)-1)*0x060504) : (0x6a6570 + ((i%3)-1)*0x050505);
    const b = box(bw-0.035, 0.07, 6.9, M(tone,{roughness:0.85}));
    b.position.set(x, GROUND-0.012, 0.4);
    b.castShadow = false;
    scene.add(b);
    // board end seams
    for (let s=0;s<2;s++){
      const seam = box(bw-0.05, 0.012, 0.03, M(0x33262e,{roughness:1}));
      seam.position.set(x, GROUND+0.025, -2.4 + ((i*1.7+s*2.9)%5.6));
      seam.castShadow = false;
      scene.add(seam);
    }
  }
}

/* ---------- reference-faithful attic and split spiderweb window ---------- */
const WALL_H=4.4, WALL_T=.22, WALL_Z=-2.85;
const windowGroup=new THREE.Group();
const WIN_R=1.62, WIN_Y=2.5;
const frameMat=M(0x604332,{roughness:.7});
// True circular opening in a timber gable, not opaque slabs over glass.
const wallShape=new THREE.Shape();
wallShape.moveTo(-4.05,0); wallShape.lineTo(4.05,0); wallShape.lineTo(4.05,3.7);
wallShape.lineTo(0,5.25); wallShape.lineTo(-4.05,3.7); wallShape.closePath();
const hole=new THREE.Path(); hole.absarc(0,WIN_Y,WIN_R+.05,0,Math.PI*2,true); wallShape.holes.push(hole);
const timberCanvas=document.createElement('canvas'); timberCanvas.width=1024;timberCanvas.height=1024;
const tc=timberCanvas.getContext('2d'); tc.fillStyle='#3c2b23';tc.fillRect(0,0,1024,1024);
let seed=73; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let y=0;y<1024;y+=40){tc.fillStyle=['#49352a','#423026','#50382a','#392b24'][Math.floor(rnd()*4)];tc.fillRect(0,y,1024,38);tc.fillStyle='#1b1716';tc.fillRect(0,y+38,1024,2); for(let j=0;j<22;j++){tc.strokeStyle=`rgba(12,8,5,${.1+rnd()*.15})`;tc.beginPath();const gy=y+rnd()*38;tc.moveTo(0,gy);tc.bezierCurveTo(330,gy-3,650,gy+4,1024,gy);tc.stroke();}}
const timberTex=new THREE.CanvasTexture(timberCanvas);timberTex.colorSpace=THREE.SRGBColorSpace;timberTex.repeat.set(1/8.1,1/5.25);timberTex.offset.set(.5,0);
const wall=new THREE.Mesh(new THREE.ExtrudeGeometry(wallShape,{depth:WALL_T,bevelEnabled:false,curveSegments:64}),M(0x8f7663,{map:timberTex}));wall.position.z=WALL_Z-.15;wall.receiveShadow=true;scene.add(wall);
function beam(a,b,width=.12,depth=.15){const av=new THREE.Vector3(...a),bv=new THREE.Vector3(...b);const m=box(width,av.distanceTo(bv),depth,frameMat);m.position.copy(av).add(bv).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),bv.sub(av).normalize());scene.add(m);return m;}
for(const x of [-3.8,-2.6,2.6,3.8]){const top=5.25-Math.abs(x)*1.55/4.05;beam([x,0,WALL_Z+.12],[x,top,WALL_Z+.12],.13,.18);}
beam([-4.05,3.7,WALL_Z+.13],[0,5.25,WALL_Z+.13],.18,.22);beam([0,5.25,WALL_Z+.13],[4.05,3.7,WALL_Z+.13],.18,.22);
beam([-4.05,.12,WALL_Z+.12],[4.05,.12,WALL_Z+.12],.12,.18);
// Side cutaway: low timber return keeps the colorful bed visible.
const ret=box(.18,.65,6.6,M(0x3b2c25));ret.position.set(-4.02,.325,.35);scene.add(ret);
for(const z of [-2.7,.1,3.55])beam([-4.02,0,z],[-4.02,.82,z],.12,.14);
// Full-height right wall: the room's second edge, so it reads as a corner and the
// wall art, shelf and cello have something to hang on.
{
  const rwShape=new THREE.Shape();
  rwShape.moveTo(-3.0,0); rwShape.lineTo(4.05,0); rwShape.lineTo(4.05,4.4); rwShape.lineTo(-3.0,4.4); rwShape.closePath();
  const timberTex2=timberTex.clone(); timberTex2.needsUpdate=true;
  timberTex2.wrapS=timberTex2.wrapT=THREE.RepeatWrapping;
  timberTex2.repeat.set(1/7.1,1/4.4); timberTex2.offset.set(.425,0);
  const rwall=new THREE.Mesh(new THREE.ExtrudeGeometry(rwShape,{depth:WALL_T,bevelEnabled:false}),M(0x8f7663,{map:timberTex2}));
  rwall.rotation.y=Math.PI/2; rwall.position.set(3.83,0,0); rwall.receiveShadow=true; scene.add(rwall);
  for(const z of [-2.4,-0.9,0.6,2.1,3.6])beam([3.8,0,z],[3.8,4.4,z],.13,.18);
  beam([3.8,4.32,-3.0],[3.8,4.32,4.05],.18,.22);
  beam([3.8,.11,-3.0],[3.8,.11,4.05],.12,.18);
}
const ring=new THREE.Mesh(new THREE.TorusGeometry(WIN_R+.04,.075,10,96),frameMat);ring.position.set(0,WIN_Y,WALL_Z+.03);windowGroup.add(ring);
const palette=[0xffd966,0xef9fcb,0x8bcde4,0xb8a6e5,0xf2c97b,0x8ed6cf];
const paneMaterials=[];
function webPoint(r,k,t){const ang=(k+t)*Math.PI/8;const scallop=1-(r>WIN_R*.999?0:.085)*Math.sin(Math.PI*t);return [Math.cos(ang)*r*scallop,Math.sin(ang)*r*scallop];}
for(let k=0;k<16;k++)for(let j=0;j<6;j++){
 const r0=WIN_R*j/6,r1=WIN_R*(j+1)/6, pts=[];
 for(let q=0;q<=12;q++)pts.push(webPoint(r1,k,q/12));
 for(let q=12;q>=0;q--)pts.push(webPoint(r0,k,q/12));
 const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(...p)));sh.closePath();
 const left=Math.cos((k+.5)*Math.PI/8)<0;const col=left?palette[(k*3+j)%palette.length]:0xc6e3eb;
 const mat=M(col,{emissive:col,emissiveIntensity:left?.5:.65,roughness:.3,side:THREE.DoubleSide});paneMaterials.push(mat);
 const pane=new THREE.Mesh(new THREE.ShapeGeometry(sh),mat);pane.position.set(0,WIN_Y,WALL_Z+.01);windowGroup.add(pane);
}
const webMat=new THREE.LineBasicMaterial({color:0x19191b});
for(let k=0;k<16;k++){
 const a=k*Math.PI/8; const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,WIN_Y,WALL_Z+.075),new THREE.Vector3(Math.cos(a)*WIN_R,WIN_Y+Math.sin(a)*WIN_R,WALL_Z+.075)]),webMat);windowGroup.add(line);
 for(let j=1;j<=6;j++){const pts=[];for(let q=0;q<=16;q++){const p=webPoint(WIN_R*j/6,k,q/16);pts.push(new THREE.Vector3(p[0],WIN_Y+p[1],WALL_Z+.08));}windowGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),webMat));}
}
// Preserve the original day/dusk/night material bindings.
windowGroup.userData.glassL={material:paneMaterials[0]};windowGroup.userData.wedges=paneMaterials.slice(1).map(material=>({material}));
const winHit=new THREE.Mesh(new THREE.CircleGeometry(WIN_R,64),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,colorWrite:false,side:THREE.DoubleSide}));winHit.position.set(0,WIN_Y,WALL_Z+.1);windowGroup.add(winHit);scene.add(windowGroup);
// Colored light follows the same web geometry, laid across the wooden floor.
const pc=document.createElement('canvas');pc.width=1024;pc.height=1024;const px=pc.getContext('2d');px.translate(512,512);px.scale(290,290);
for(let k=0;k<16;k++)for(let j=0;j<6;j++){
 const left=Math.cos((k+.5)*Math.PI/8)<0;px.fillStyle=left?'#'+palette[(k*3+j)%6].toString(16).padStart(6,'0'):'#e0f4ff';px.beginPath();
 for(let q=0;q<=16;q++){const p=webPoint(WIN_R*(j+1)/6,k,q/16);q?px.lineTo(...p):px.moveTo(...p);}
 for(let q=16;q>=0;q--){const p=webPoint(WIN_R*j/6,k,q/16);px.lineTo(...p);}px.closePath();px.fill();px.strokeStyle='#15141b';px.lineWidth=.023;px.stroke();
}
const projectionTex=new THREE.CanvasTexture(pc);projectionTex.colorSpace=THREE.SRGBColorSpace;
const PROJ_OPACITY=.85;
const projectedLight=new THREE.Mesh(new THREE.PlaneGeometry(5.3,6.0),new THREE.MeshBasicMaterial({map:projectionTex,transparent:true,opacity:PROJ_OPACITY,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));projectedLight.rotation.x=-Math.PI/2;projectedLight.position.set(0,.036,.25);scene.add(projectedLight);
// tap burst: light visibly comes THROUGH the window and the web re-forms on the floor
const winBurst=new THREE.PointLight(0xd8b8ff,0,7.5,1.5); winBurst.position.set(0,2.4,WALL_Z+0.7); scene.add(winBurst);
let projPulse=-1;
function pulseProjection(){ projPulse=0; winBurst.intensity=3.4; projectedLight.material.opacity=PROJ_OPACITY*0.12; }
/* sky bands + moon + stars OUTSIDE the window (flat backdrop plane stack) */
const skyBands = [];
let moonMesh, starPts;
{
  const bandCols = [0x9fb8d8, 0xc9d4de, 0xe6ddc8];
  for (let i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 1.06), new THREE.MeshBasicMaterial({color:bandCols[i], fog:false}));
    b.position.set(0, 2.72 - i*0.97, WALL_Z-0.15);
    scene.add(b); skyBands.push(b);
  }
  moonMesh = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), new THREE.MeshBasicMaterial({color:0xf2ead0, fog:false, transparent:true, opacity:0}));
  moonMesh.position.set(-0.62, 2.78, WALL_Z-0.13); scene.add(moonMesh);
  const sg = new THREE.BufferGeometry(); const sp=[];
  for (let i=0;i<60;i++) sp.push(rand(-1.2,1.2), rand(0.7,3.1), WALL_Z-0.12);
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp,3));
  starPts = new THREE.Points(sg, new THREE.PointsMaterial({color:0xd8e2f8, size:0.05, transparent:true, opacity:0, fog:false}));
  scene.add(starPts);
}

const furnitureStart=scene.children.length;
/* ---------- Wednesday furniture, mirrored to right below ---------- */
const blackMetal = M(0x17161a,{roughness:0.45, metalness:0.6});
const darkWood = M(0x4a3a30,{roughness:0.75});
const candleFlames = [];
const typeGroup = new THREE.Group();
{
  // iron bed: posts, rails, headboard bars
  const bed = new THREE.Group();
  for (const [px,pz] of [[-3.55,-2.35],[-1.85,-2.35],[-3.55,-1.05],[-1.85,-1.05]]){
    const post = cyl(0.045,0.045,0.78,blackMetal,8); post.position.set(px,0.39,pz); bed.add(post);
    const knob = sph(0.06,blackMetal,8,6); knob.position.set(px,0.82,pz); bed.add(knob);
  }
  const frame = box(1.76, 0.1, 1.36, blackMetal); frame.position.set(-2.7, 0.5, -1.7); bed.add(frame);
  for (let i=0;i<5;i++){
    const bar = cyl(0.022,0.022,0.62,blackMetal,6); bar.position.set(-3.42+i*0.36, 0.85, -2.35); bed.add(bar);
  }
  const headRail = cyl(0.03,0.03,1.68,blackMetal,8); headRail.rotation.z=Math.PI/2; headRail.position.set(-2.7,1.16,-2.35); bed.add(headRail);
  const mattress = rbox(1.68, 0.22, 1.28, 0.05, M(0xb8b4ae,{roughness:0.95})); mattress.position.set(-2.7, 0.66, -1.7); bed.add(mattress);
  // black-and-white striped blanket, draped
  for (let i=0;i<10;i++){
    const st = box(1.7, 0.05, 0.125, M(i%2? 0x1c1a1e : 0xd8d4cc,{roughness:0.95}));
    st.position.set(-2.7, 0.79+Math.sin(i*0.8)*0.008, -1.45+i*0.128); st.rotation.x = 0.02; bed.add(st);
  }
  const throwP = rbox(0.4,0.12,0.28,0.05, M(0x3a363c,{roughness:0.95})); throwP.position.set(-3.0,0.83,-2.05); throwP.rotation.y=-0.15; bed.add(throwP);
  const pillow = rbox(0.7,0.14,0.42,0.05, M(0xf0ece4,{roughness:0.95})); pillow.position.set(-2.7,0.82,-2.12); pillow.rotation.y=0.04; bed.add(pillow);
  scene.add(bed);

  moonLight.intensity = s.moonI;
  fill.intensity = s.fillI;
  renderer.toneMappingExposure = s.exp;
  starPts.material.opacity = s.stars;
  moonMesh.material.opacity = s.moon;
  dustMat.opacity = s.dust;
  fairyLight.intensity = 0.55 * s.fairy;
  for (const f of fairyBulbs) f.base = 1.4 * s.fairy;
  windowGroup.userData.glassL.material.emissiveIntensity = 0.7 * s.glass;
  for (const w of windowGroup.userData.wedges) w.material.emissiveIntensity = 0.28 * s.glass;
  for (const cf of candleFlames) cf.light.intensity = 0.55 * s.candle;
  candleFlames.forEach(cf=>cf.flame.material.emissiveIntensity = 1.2 + 1.2*s.candle);
  lampLightRef.intensity = 0.7 * s.lamp;
  shadeRef.material.emissiveIntensity = 0.5 + 0.5*s.lamp;
}
function mixStates(p,n,t){
  const mixC=(a,b)=>new THREE.Color(a).lerp(new THREE.Color(b),t).getHex();
  const mixN=(a,b)=>a+(b-a)*t;
  return {
    sky:[0,1,2].map(i=>mixC(p.sky[i],n.sky[i])),
    hemi:[mixC(p.hemi[0],n.hemi[0]), mixC(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
    sunC:mixC(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI), moonI:mixN(p.moonI,n.moonI),
    fillI:mixN(p.fillI,n.fillI), exp:mixN(p.exp,n.exp), stars:mixN(p.stars,n.stars),
    moon:mixN(p.moon,n.moon), fairy:mixN(p.fairy,n.fairy), lamp:mixN(p.lamp,n.lamp),
    candle:mixN(p.candle,n.candle), glass:mixN(p.glass,n.glass), dust:mixN(p.dust,n.dust),
  };
}
function cycleState(){
  const from = blend.t >= 1 ? STATES[stateIdx] : mixStates(blend.from, blend.to, blend.t);
  stateIdx = (stateIdx+1) % STATES.length;
  blend = { t:0, from, to:STATES[stateIdx] };
}

/* ---------- typewriter clack ---------- */
let clackT = -1;
function clack(){
  clackT = 0;
  const u = typeGroup.userData;
  u.lineCount = Math.min(u.lineCount+1, 7);
  const line = box(0.2, 0.012, 0.014, u.lineM);
  line.position.set(0, 0.52 - u.lineCount*0.035, -0.137);
  line.rotation.x = -0.12;
  line.castShadow = false;
  typeGroup.add(line);
  u.paper.position.y += 0.012;
  u.roller.rotation.x += 0.35;
}

/* ---------- fairy twinkle toggle ---------- */
let fairyChase = false;

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = 0, downPos = [0,0];
renderer.domElement.addEventListener('pointerdown', e=>{
  downAt = performance.now(); downPos = [e.clientX, e.clientY];
});
let lastUpAt = -999;
renderer.domElement.addEventListener('pointerup', e=>{
  const nowUp = performance.now();
  if (nowUp - lastUpAt < 150) return;
  lastUpAt = nowUp;
  if (nowUp-downAt > 350) return;
  if (Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]) > 8) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObjects([typeGroup], true).length){ window.__tvSfx&&window.__tvSfx(); clack(); return; }
  if (ray.intersectObjects([fairyGroup], true).length){ window.__tvSfx&&window.__tvSfx(); fairyChase = !fairyChase; return; }
  if (ray.intersectObjects([windowGroup], true).length){ window.__tvSfx&&window.__tvSfx(); cycleState(); pulseProjection(); return; }
});

/* ---------- resize / loop ---------- */
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});
const clock = new THREE.Clock();
let elapsed = 0;
function tick(){
  requestAnimationFrame(tick);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  elapsed += dt;

  if (blend.t < 1){
    blend.t = Math.min(1, blend.t + rawDt/1.6);
    applyState(mixStates(blend.from, blend.to, blend.t));
  }

  // candle flicker
  for (const cf of candleFlames){
    const s = cf.light.intensity;
    if (s > 0.05){
      cf.flame.scale.set(1+Math.sin(elapsed*11+cf.seed)*0.15, 1+Math.sin(elapsed*13+cf.seed)*0.22, 1);
      cf.light.intensity = s*(0.92+Math.random()*0.16);
    }
  }
  // fairy twinkle / chase
  for (const f of fairyBulbs){
    f.m.emissiveIntensity = fairyChase
      ? f.base * (0.35 + 1.15*Math.max(0,Math.sin(elapsed*4 + f.seed)))
      : f.base * (0.85 + 0.15*Math.sin(elapsed*1.4 + f.seed));
  }
  // typewriter clack animation
  if (clackT >= 0){
    clackT += dt;
    const k = Math.min(clackT/0.28, 1);
    const dip = Math.sin(k*Math.PI);
    typeGroup.userData.keys.forEach((key,i)=>{ key.position.y -= 0; key.scale.y = 1 - dip*0.4*((i*7)%3===0?1:0.3); });
    typeGroup.position.x = -1.35 + dip*0.01;
    if (k>=1){ clackT = -1; typeGroup.userData.keys.forEach(key=>key.scale.y=1); typeGroup.position.x=-1.35; }
  }
  // window tap: projection forms on the floor, burst light decays
  if (projPulse >= 0){
    projPulse = Math.min(1, projPulse + dt/1.25);
    const e = 1 - Math.pow(1-projPulse, 3);
    projectedLight.material.opacity = PROJ_OPACITY * (0.12 + 0.88*e);
    const ps = 0.86 + 0.14*e;
    projectedLight.scale.set(ps, ps, 1);
    if (projPulse >= 1){ projPulse = -1; projectedLight.material.opacity = PROJ_OPACITY; projectedLight.scale.set(1,1,1); }
  }
  if (winBurst.intensity > 0.01) winBurst.intensity *= Math.pow(0.02, dt);
  else winBurst.intensity = 0;

  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i=0;i<DUST_N;i++){
    dp[i*3+1] += dt*0.04;
    dp[i*3] += Math.sin(elapsed*0.5 + i)*dt*0.015;
    if (dp[i*3+1] > 3.4) dp[i*3+1] = 0.15;
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
applyState(STATES[stateIdx]);
tick();
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
  document.body.classList.add('ready');
}, 700);
</script>
<script>
/* tv-audio v1: procedural ambience + tap sfx. All sounds synthesized, no assets. */
(() => {
  const CFG = {"amb": []};
  const KEY = "tvmini-muted";
  let ctx = null, master = null, analyser = null, NOISE = null, started = false;
  let muted = false;
  try { muted = localStorage.getItem(KEY) === "1"; } catch (e) {}

  const btn = document.createElement("button");
  btn.type = "button";
  btn.setAttribute("aria-label", "Toggle sound");
  btn.style.cssText = "position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(12,14,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.8;transition:opacity .3s";
  const ICON_ON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  const paint = () => { btn.innerHTML = muted ? ICON_OFF : ICON_ON; btn.style.opacity = muted ? ".45" : ".8"; };
  paint();
  document.body.appendChild(btn);

  function ensureCtx(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    master.connect(analyser); analyser.connect(ctx.destination);
    NOISE = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noiseLoop(){ const s = ctx.createBufferSource(); s.buffer = NOISE; s.loop = true; s.start(); return s; }
  function filt(type, f, q){ const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gn(v){ const n = ctx.createGain(); n.gain.value = v; return n; }
  function lfo(freq, amt, param){ const o = ctx.createOscillator(); o.frequency.value = freq; const lg = gn(amt); o.connect(lg); lg.connect(param); o.start(); }
  function hum(f, v){ const o = ctx.createOscillator(); o.frequency.value = f; const g2 = gn(v); o.connect(g2); g2.connect(master); o.start(); }
  function every(minS, maxS, fn){ (function loop(){ if (ctx) fn(); setTimeout(loop, (minS + Math.random() * (maxS - minS)) * 1000); })(); }
  function ping(type, f0, f1, dur, vol){
    const o = ctx.createOscillator(); o.type = type; const g2 = gn(0);
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    o.connect(g2); g2.connect(master);
    g2.gain.setValueAtTime(0, ctx.currentTime);
    g2.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  function shot(dur){
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    const g2 = gn(0); s.connect(g2);
    s.start(); s.stop(ctx.currentTime + dur);
    return g2;
  }
  function echo(dt, fbv, wetv){
    const dl = ctx.createDelay(1); dl.delayTime.value = dt;
    const fb = gn(fbv); dl.connect(fb); fb.connect(dl);
    const wet = gn(wetv); dl.connect(wet); wet.connect(master);
    return dl;
  }

  const R = {
    wind(){ const bp = filt("bandpass", 480, 0.5), g2 = gn(0.09); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.07, 0.045, g2.gain); lfo(0.13, 170, bp.frequency); },
    coldwind(){ const bp = filt("bandpass", 830, 0.7), g2 = gn(0.065); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.09, 0.04, g2.gain); lfo(0.21, 250, bp.frequency); hum(52, 0.026); },
    crackle(){ every(0.05, 0.3, () => { const hp = filt("highpass", 1900), g2 = shot(0.05); g2.connect(hp); hp.connect(master); g2.gain.setValueAtTime(0.015 + Math.random() * 0.045, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.05); }); hum(62, 0.011); },
    murmur(){ const bp = filt("bandpass", 380, 1.1), g2 = gn(0.045); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); every(0.8, 2.4, () => bp.frequency.setTargetAtTime(250 + Math.random() * 380, ctx.currentTime, 0.4)); },
    clink(){ every(4, 9, () => ping("sine", 2000 + Math.random() * 400, 0, 0.16, 0.028)); },
    room(){ const lp = filt("lowpass", 220), g2 = gn(0.02); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); hum(58, 0.009); },
    hum(){ hum(120, 0.011); hum(240, 0.005); const bp = filt("bandpass", 1150, 3), g2 = gn(0.004); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); },
    humsoft(){ hum(100, 0.007); },
    plink(){ const dl = echo(0.42, 0.3, 0.4); every(4.5, 9, () => { const f = [660, 587, 494, 440, 392][Math.floor(Math.random() * 5)]; const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; const g2 = gn(0); o.connect(g2); g2.connect(master); g2.connect(dl); g2.gain.setValueAtTime(0.04, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 1.4); o.start(); o.stop(ctx.currentTime + 1.5); }); },
    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 2.2, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
