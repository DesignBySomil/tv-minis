<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smoky Street - a tiny scene inspired by Peaky Blinders</title>
<meta name="theme-color" content="#0c1017">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0c1017}
  body{font-family:Georgia,'Times New Roman',serif;color:#eef0f2}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(6,8,11,.5) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#0c1017;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#9fb4c8;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#232a34;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#9fb4c8;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(6,8,11,.95),0 2px 8px rgba(6,8,11,.8),0 4px 22px rgba(6,8,11,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#c0c8d2;margin-top:3px;text-shadow:0 1px 2px rgba(6,8,11,.95),0 2px 6px rgba(6,8,11,.75),0 3px 14px rgba(6,8,11,.5)}
  #era{position:fixed;top:max(18px,env(safe-area-inset-top));right:20px;z-index:4;pointer-events:none;
    font-size:11px;letter-spacing:.24em;color:#d8c9a8;border:1px solid rgba(216,201,168,.35);
    padding:5px 12px;border-radius:99px;background:rgba(12,16,23,.5);backdrop-filter:blur(6px);
    opacity:0;transition:opacity 1.4s ease .8s}
  body.ready #era{opacity:1}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#e8ecf2;background:rgba(14,17,22,.55);border:1px solid rgba(228,236,248,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
    #era{right:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>Smoky Street</h1><p>a tiny scene inspired by Peaky Blinders</p></div>
<div id="era">1919</div>
<div id="hint">tap the lamp &nbsp;&middot;&nbsp; tap the door &nbsp;&middot;&nbsp; tap the chimney</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   SMOKY STREET - a Birmingham back street after dark: wet
   cobbles, a gas lamp, a pub with warm windows, terraces,
   and a factory chimney that still throws sparks.
   All procedural, no show assets.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1017);
scene.fog = new THREE.FogExp2(0x0c1017, 0.026);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.0, 0.2);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 70;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-5.2, -1.15, -3.5), new THREE.Vector3(5.2, 0.15, 3.35)),
  new THREE.Box3(new THREE.Vector3(-4.9, 0, -3.1), new THREE.Vector3(4.9, 3.45, 2.6)),
  new THREE.Box3(new THREE.Vector3(2.6, 0, -4.4), new THREE.Vector3(3.6, 3.95, -3.6)),
];
const FIT_BOXES_PORTRAIT = [
  new THREE.Box3(new THREE.Vector3(-4.6, -1.15, -3.3), new THREE.Vector3(4.6, 0.15, 3.3)),
  new THREE.Box3(new THREE.Vector3(-4.5, 0, -3.1), new THREE.Vector3(3.95, 3.75, 2.6)),
  new THREE.Box3(new THREE.Vector3(2.35, 0, -4.4), new THREE.Vector3(3.35, 3.95, -3.6)),
  new THREE.Box3(new THREE.Vector3(-4.05, 3.0, -2.9), new THREE.Vector3(-3.35, 4.2, -2.1)),
  new THREE.Box3(new THREE.Vector3(-1.35, 3.2, -2.9), new THREE.Vector3(2.85, 4.2, -1.6)),
];
function cornersOf(boxes){
  const out = [];
  for (const b of boxes)
    for (const x of [b.min.x, b.max.x])
      for (const y of [b.min.y, b.max.y])
        for (const z of [b.min.z, b.max.z])
          out.push(new THREE.Vector3(x, y, z));
  return out;
}
const CORNERS_FULL = cornersOf(FIT_BOXES);
const CORNERS_PORTRAIT = cornersOf(FIT_BOXES_PORTRAIT);
let FIT_CORNERS = CORNERS_FULL;
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}

/* shift camera+orbit-target in the screen plane so the projected model
   bounding box lands at viewport centre (small lift for the hint pill) */
function centerProjectedModel(){
  for (let pass = 0; pass < 2; pass++){
    camera.updateMatrixWorld();
    const p = new THREE.Vector3();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const c of FIT_CORNERS){
      p.copy(c).project(camera);
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const dist = camera.position.distanceTo(controls.target);
    const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    const halfW = halfH * camera.aspect;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    controls.target.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    camera.lookAt(controls.target);
  }
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8){ dir.set(0.26, 0.33, 0.90); FIT_CORNERS = CORNERS_PORTRAIT; SAFE.x = 0.965; SAFE.yTop = 0.88; SAFE.yBottom = 0.83; }
  else { dir.set(0.56, 0.42, 0.7); FIT_CORNERS = CORNERS_FULL; SAFE.x = 0.93; SAFE.yTop = 0.85; SAFE.yBottom = 0.8; }
  dir.normalize();
  let lo = 4, hi = 70;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi*1.03);
  camera.lookAt(controls.target);
  centerProjectedModel();
}
camera.position.set(6, 4.5, 8);
frameForViewport();

/* ---------- helpers ---------- */
function box(w,h,d,mat,x,y,z,ry,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); if (ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg,parent){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||14), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function radialTex(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,4,64,64,62);
  grad.addColorStop(0, inner); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); return t;
}

/* ---------- materials ---------- */
const MAT = {
  soil:      new THREE.MeshStandardMaterial({ color:0x1b1815, roughness:0.95 }),
  stoneEdge: new THREE.MeshStandardMaterial({ color:0x2b2724, roughness:0.9 }),
  bedDark:   new THREE.MeshStandardMaterial({ color:0x232021, roughness:0.95 }),
  pavement:  new THREE.MeshStandardMaterial({ color:0x42423f, roughness:0.85 }),
  puddle:    new THREE.MeshStandardMaterial({ color:0x141c28, roughness:0.12, metalness:0.55 }),
  pubBrick:  new THREE.MeshStandardMaterial({ color:0x7a6048, roughness:0.9 }),
  pubTrim:   new THREE.MeshStandardMaterial({ color:0x7d7263, roughness:0.85 }),
  pubDoor:   new THREE.MeshStandardMaterial({ color:0x1e2b1e, roughness:0.7 }),
  terrace1:  new THREE.MeshStandardMaterial({ color:0x726467, roughness:0.92 }),
  terrace2:  new THREE.MeshStandardMaterial({ color:0x7d6e5a, roughness:0.92 }),
  terrace3:  new THREE.MeshStandardMaterial({ color:0x6f6063, roughness:0.92 }),
  roofDark:  new THREE.MeshStandardMaterial({ color:0x504540, roughness:0.95 }),
  roofTile:  new THREE.MeshStandardMaterial({ color:0x9c6046, roughness:0.88 }),
  chimBrick: new THREE.MeshStandardMaterial({ color:0x63493a, roughness:0.92 }),
  chimDark:  new THREE.MeshStandardMaterial({ color:0x2b2019, roughness:0.95 }),
  lampPost:  new THREE.MeshStandardMaterial({ color:0x16181c, roughness:0.6, metalness:0.4 }),
  cartWood:  new THREE.MeshStandardMaterial({ color:0x4a3626, roughness:0.9 }),
  wheelWood: new THREE.MeshStandardMaterial({ color:0x33271c, roughness:0.9 }),
  ironDark:  new THREE.MeshStandardMaterial({ color:0x22262c, roughness:0.5, metalness:0.5 }),
  barrel:    new THREE.MeshStandardMaterial({ color:0x4c3826, roughness:0.9 }),
  barrelBand:new THREE.MeshStandardMaterial({ color:0x1e2228, roughness:0.5, metalness:0.5 }),
  crate:     new THREE.MeshStandardMaterial({ color:0x5a4630, roughness:0.95 }),
  darkWin:   new THREE.MeshBasicMaterial({ color:0x11161d }),
  warmWin:   new THREE.MeshBasicMaterial({ color:0xffb545 }),
  transom:   new THREE.MeshBasicMaterial({ color:0xd88f30 }),
  figure:    new THREE.MeshBasicMaterial({ color:0x07080b, transparent:true, opacity:0 }),
};

/* ---------- layered base ---------- */
const base = new THREE.Group(); scene.add(base);
function slab(w, h, d, mat, y, cut){
  const hw = w/2, hd = d/2, c = cut;
  const sh = new THREE.Shape();
  sh.moveTo(-hw+c, -hd); sh.lineTo(hw-c, -hd); sh.lineTo(hw, -hd+c);
  sh.lineTo(hw, hd-c); sh.lineTo(hw-c, hd); sh.lineTo(-hw+c, hd);
  sh.lineTo(-hw, hd-c); sh.lineTo(-hw, -hd+c); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: false });
  g.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(g, mat);
  m.position.set(0, y - h/2, 0);
  m.castShadow = true; m.receiveShadow = true;
  base.add(m);
  return m;
}
slab(10.4, 0.55, 7.4, MAT.soil, -0.85, 1.5);
slab(10.0, 0.42, 7.0, MAT.stoneEdge, -0.42, 1.4);
slab(9.6, 0.24, 6.6, MAT.bedDark, -0.12, 1.3);
/* pavement strip in front of the facades */
box(9.2, 0.07, 0.55, MAT.pavement, 0, 0.035, -1.3, 0, base);

/* ---------- cobblestones ---------- */
const cobbleGeo = new THREE.BoxGeometry(0.4, 0.09, 0.34);
const cobbleMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.55, metalness:0.12 });
const cobCols = [0x3f4650, 0x464e59, 0x383f49, 0x4c545f, 0x424a55];
const cobCount = 23*12;
const cobbles = new THREE.InstancedMesh(cobbleGeo, cobbleMat, cobCount);
cobbles.receiveShadow = true;
{
  const dummy = new THREE.Object3D(); const col = new THREE.Color();
  let i = 0;
  for (let r=0;r<12;r++) for (let c=0;c<23;c++){
    dummy.position.set(-4.6 + c*0.42 + (Math.random()-0.5)*0.05, 0.045 + Math.random()*0.015, -0.85 + r*0.36 + (Math.random()-0.5)*0.05);
    dummy.rotation.y = (Math.random()-0.5)*0.12;
    dummy.updateMatrix();
    cobbles.setMatrixAt(i, dummy.matrix);
    col.setHex(cobCols[(Math.random()*cobCols.length)|0]);
    col.offsetHSL(0, 0, (Math.random()-0.5)*0.04);
    cobbles.setColorAt(i, col);
    i++;
  }
}
base.add(cobbles);
/* puddles */
const pud1 = cyl(0.62, 0.62, 0.012, MAT.puddle, 0.9, 0.1, 0.5, 22, base); pud1.scale.z = 0.6;
const pud2 = cyl(0.45, 0.45, 0.012, MAT.puddle, -1.9, 0.1, 2.0, 20, base); pud2.scale.z = 0.75;

/* ---------- the pub ---------- */
const pub = new THREE.Group(); scene.add(pub);
box(3.2, 2.7, 1.4, MAT.pubBrick, -2.7, 1.35, -2.2, 0, pub);
box(3.36, 0.24, 1.56, MAT.pubTrim, -2.7, 0.12, -2.2, 0, pub);      // base course
box(3.36, 0.14, 1.56, MAT.pubTrim, -2.7, 2.62, -2.2, 0, pub);      // cornice
gable(1.62, 0.62, 3.5, MAT.roofTile, -2.7, 2.8, -2.2, pub);
/* pub chimney */
box(0.42, 1.0, 0.42, MAT.chimBrick, -3.7, 3.3, -2.5, 0, pub);
box(0.54, 0.14, 0.54, MAT.chimDark, -3.7, 3.84, -2.5, 0, pub);
cyl(0.1, 0.12, 0.3, MAT.chimDark, -3.7, 4.0, -2.5, 10, pub);
/* window helper */
function glowWindow(x, y, z, w, h, parent, mat){
  box(w+0.12, h+0.12, 0.08, MAT.pubTrim, x, y, z, 0, parent);
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  pane.position.set(x, y, z+0.045); parent.add(pane);
  box(0.035, h, 0.05, MAT.pubTrim, x, y, z+0.05, 0, parent);
  box(w, 0.035, 0.05, MAT.pubTrim, x, y, z+0.05, 0, parent);
  box(w+0.2, 0.07, 0.14, MAT.pubTrim, x, y-h/2-0.09, z+0.02, 0, parent); // sill
  return pane;
}
const pubPane1 = glowWindow(-3.62, 1.55, -1.49, 0.62, 0.85, pub, MAT.warmWin);
const pubPane2 = glowWindow(-1.78, 1.55, -1.49, 0.62, 0.85, pub, MAT.warmWin);
glowWindow(-2.7, 2.25, -1.49, 0.5, 0.34, pub, MAT.transom);        // transom over door
/* door on hinge pivot */
const doorG = new THREE.Group(); doorG.position.set(-3.01, 0, -1.48); scene.add(doorG);
const doorMesh = box(0.62, 1.2, 0.07, MAT.pubDoor, 0.31, 0.66, 0, 0, doorG);
box(0.5, 0.42, 0.02, MAT.pubTrim, 0.31, 0.82, 0.045, 0, doorG);     // upper panel
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshStandardMaterial({ color:0xc8a040, roughness:0.35, metalness:0.8 }));
knob.position.set(0.56, 0.62, 0.06); doorG.add(knob);
box(0.8, 0.07, 0.3, MAT.pavement, -2.7, 0.035, -1.32, 0, scene);    // stone step
const doorGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.16), new THREE.MeshBasicMaterial({ color:0xffb545 }));
doorGlow.position.set(-2.7, 0.66, -1.49); scene.add(doorGlow);
/* figure in the doorway */
const figG = new THREE.Group(); figG.position.set(-2.7, 0, -1.485); scene.add(figG);
const figBody = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 1.0), MAT.figure); figBody.position.y = 0.55; figG.add(figBody);
const figHead = new THREE.Mesh(new THREE.CircleGeometry(0.11, 14), MAT.figure); figHead.position.y = 1.16; figG.add(figHead);
const figCap = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.09), MAT.figure); figCap.position.y = 1.24; figG.add(figCap);
/* hanging sign with painted pint */
const signG = new THREE.Group(); signG.position.set(-4.15, 2.18, -1.48); scene.add(signG);
const sArm = cyl(0.025, 0.025, 0.6, MAT.ironDark, 0, 0, 0.3, 8, signG); sArm.rotation.x = Math.PI/2;
cyl(0.02, 0.02, 0.34, MAT.ironDark, 0, -0.14, 0.52, 8, signG);
const signBoardG = new THREE.Group(); signBoardG.position.set(0, -0.32, 0.52); signG.add(signBoardG);
const signCan = document.createElement('canvas'); signCan.width = 128; signCan.height = 96;
{
  const g = signCan.getContext('2d');
  g.fillStyle = '#18120e'; g.fillRect(0,0,128,96);
  g.strokeStyle = '#c8983c'; g.lineWidth = 5; g.strokeRect(6,6,116,84);
  g.fillStyle = '#e8a83c'; g.fillRect(50,34,28,40);                 // pint body
  g.fillStyle = '#f4e6c0'; g.fillRect(48,26,32,12);                 // foam
  g.fillStyle = '#c88a2c'; g.fillRect(50,58,28,6);                  // base
}
const signTex = new THREE.CanvasTexture(signCan);
const signBoard = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.38, 0.04),
  new THREE.MeshStandardMaterial({ color:0x241c14, roughness:0.8 }));
signBoardG.add(signBoard);
const signFace = new THREE.Mesh(new THREE.PlaneGeometry(0.48, 0.34), new THREE.MeshBasicMaterial({ map:signTex }));
signFace.position.z = 0.025; signBoardG.add(signFace);
const signFace2 = signFace.clone(); signFace2.rotation.y = Math.PI; signFace2.position.z = -0.025; signBoardG.add(signFace2);

/* gable roof: ridge runs along local z; rotate y 90deg for ridge along x */
function gable(cw, h, len, mat, x, y, z, parent){
  const s = new THREE.Shape();
  s.moveTo(-cw/2, 0); s.lineTo(cw/2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: len, bevelEnabled: false });
  g.translate(0, 0, -len/2);
  const m = new THREE.Mesh(g, mat);
  m.rotation.y = Math.PI/2;
  m.position.set(x, y, z);
  m.castShadow = true;
  (parent || scene).add(m);
  return m;
}
/* ---------- terrace houses ---------- */
const terrace = new THREE.Group(); scene.add(terrace);
terrace.position.x = -0.9;
const houseDefs = [
  { x:0.35, w:1.7, h:2.9, mat:MAT.terrace1 },
  { x:2.05, w:1.7, h:3.1, mat:MAT.terrace2 },
  { x:3.75, w:1.7, h:2.9, mat:MAT.terrace3 },
];
const houseGlow = [];
for (const hd of houseDefs){
  box(hd.w, hd.h, 1.35, hd.mat, hd.x, hd.h/2, -2.25, 0, terrace);
  gable(1.55, 0.55, hd.w+0.24, MAT.roofTile, hd.x, hd.h+0.02, -2.25, terrace);
  box(0.34, 0.8, 0.34, MAT.chimBrick, hd.x-0.4, hd.h+0.5, -2.5, 0, terrace);
  box(0.44, 0.12, 0.44, MAT.chimDark, hd.x-0.4, hd.h+0.94, -2.5, 0, terrace);

    sm.scale.set(s, s, 1);
    sm.material.opacity = (1-life)*(life<0.12 ? life/0.12 : 1) * 0.22;
  }

  /* sparks */
  if (sparkT < 1.6){
    sparkT += rawDt;
    const pos = sparkGeo.attributes.position.array;
    for (let i=0;i<SPARKS;i++){
      const v = sparkVel[i];
      const life = sparkT * (0.8 + (i%7)*0.06);
      pos[i*3]   = sparkOrigin.x + v.x*life;
      pos[i*3+1] = sparkOrigin.y + v.y*life - 2.2*life*life;
      pos[i*3+2] = sparkOrigin.z + v.z*life;

    sparkMat.opacity = Math.max(0, 1 - sparkT/1.8);
    emberLight.intensity = Math.max(0, 3.2 * (1 - sparkT/0.9));

    sparkMat.opacity = 0;
    emberLight.intensity = 0;
  }

  renderer.render(scene, camera);
}

    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 2.2, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
</script>
