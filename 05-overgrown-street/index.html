<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overgrown Street - a tiny scene inspired by The Last of Us</title>
<meta name="theme-color" content="#0e1410">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0e1410}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3e8d8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(6,10,8,.44) 100%);}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#0e1410;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#8ab89a;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#22352a;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#8ab89a;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(6,10,8,.95),0 2px 8px rgba(6,10,8,.8),0 4px 22px rgba(6,10,8,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#dcecd8;margin-top:3px;text-shadow:0 1px 2px rgba(6,10,8,.95),0 2px 6px rgba(6,10,8,.75),0 3px 14px rgba(6,10,8,.5)}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#e8f0e4;background:rgba(8,14,10,.55);border:1px solid rgba(220,240,228,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>Overgrown Street</h1><p>a tiny scene inspired by The Last of Us</p></div>
<div id="hint">tap the car &nbsp;&middot;&nbsp; tap the wall &nbsp;&middot;&nbsp; tap the sky</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   OVERGROWN STREET - a tactile miniature city corner
   A cracked intersection, an abandoned sedan, a brick facade
   being eaten by vines. All procedural geometry.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd8d8c8, 0.007);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.0, -0.4);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 5;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.7, -1.5, -4.5), new THREE.Vector3(4.7, 0.4, 4.5)),
  new THREE.Box3(new THREE.Vector3(-4.5, 0, -4.3), new THREE.Vector3(4.5, 4.3, 4.3)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8){ dir.set(0.5, 0.9, 0.55); SAFE.x = 0.965; SAFE.yTop = 0.88; SAFE.yBottom = 0.83; }
  else { dir.set(0.58, 0.52, 0.62); SAFE.x = 0.93; SAFE.yTop = 0.85; SAFE.yBottom = 0.8; }
  dir.normalize();
  let lo = 5, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi);
  camera.lookAt(controls.target);
}
camera.position.set(5.4, 4.6, 5.4);
frameForViewport();

const rand = (a,b)=>a+Math.random()*(b-a);
function M(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.92, metalness:0.0}, opts)); }
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function rbox(w,h,d,r,mat){ const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat); m.castShadow=true; m.receiveShadow=true; return m; }

/* ---------- cutaway slab: soil stratum, concrete, asphalt ---------- */
{
  const layers = [
    [8.9, 0.5, 8.9, 0x241a12],   // deep soil
    [8.7, 0.35, 8.7, 0x4a3826],  // packed earth
    [8.5, 0.3, 8.5, 0x6a6a62],   // concrete bed
  ];
  let ly = 0;
  for (const [w,h,d,c] of layers){
    const m = box(w,h,d,M(c,{roughness:0.98}));
    m.position.y = ly - h/2; ly -= h;
    m.receiveShadow = true; m.castShadow = false;
    scene.add(m);
  }
}
// asphalt road bed
const road = box(8.4, 0.16, 8.4, M(0x5a5a54,{roughness:0.97}));
road.position.y = -0.08; road.receiveShadow = true; road.castShadow = false;
scene.add(road);
const GROUND = 0.0;

/* ---------- road markings, cracks, sidewalk ---------- */
{
  // worn center dashes along x
  for (let i=0;i<6;i++){
    const dash = box(0.65, 0.012, 0.09, M(0xc8b860,{roughness:0.9}));
    dash.position.set(-3.4 + i*1.35, GROUND+0.006, 0.9);
    dash.receiveShadow = true; dash.castShadow = false;
    scene.add(dash);
  }
  // crosswalk stripes near front
  for (let i=0;i<5;i++){
    const st = box(0.32, 0.012, 1.1, M(0xb8b8b0,{roughness:0.9}));
    st.position.set(-1.7 + i*0.62, GROUND+0.006, 2.55);
    st.receiveShadow = true; st.castShadow = false;
    scene.add(st);
  }
  // sidewalk along back-left, one slab heaved
  const swM = M(0x8a8a80,{roughness:0.95});
  for (let i=0;i<4;i++){
    const slab = box(1.9, 0.1, 1.15, swM);
    slab.position.set(-3.15 + i*1.95, GROUND+0.05, -2.15);
    if (i===2){ slab.rotation.z = 0.045; slab.position.y += 0.03; }
    scene.add(slab);
  }
  // cracks: thin dark veins
  const crackM = M(0x2c2c28,{roughness:1});
  const cracks = [
    [-2.2, 0.4, 1.7, 0.5], [0.4, 0.2, 2.3, -0.35], [1.8, 1.5, 1.4, 0.9],
    [-0.9, 2.1, 1.2, 0.2], [2.9, -0.6, 1.6, -0.7], [-3.1, 1.6, 1.1, 1.2],
  ];
  for (const [x,z,len,rot] of cracks){
    const c = box(len, 0.014, 0.05, crackM);
    c.position.set(x, GROUND+0.008, z); c.rotation.y = rot;
    c.castShadow = false;
    scene.add(c);
  }
}
/* ---------- grass tufts + moss (the overgrowth) ---------- */
const grassM1 = M(0x5a7a3a,{roughness:0.95});
const grassM2 = M(0x6a8a44,{roughness:0.95});
function tuft(x, z, s=1){
  const g = new THREE.Group();
  const n = 6 + Math.floor(Math.random()*4);
  for (let i=0;i<n;i++){
    const h = rand(0.12,0.30)*s;
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.032*s, h, 4), Math.random()<0.5?grassM1:grassM2);
    blade.position.set(rand(-0.09,0.09)*s, h/2, rand(-0.09,0.09)*s);
    blade.rotation.set(rand(-0.25,0.25), 0, rand(-0.25,0.25));
    blade.castShadow = true;
    g.add(blade);
  }
  g.position.set(x, GROUND+0.01, z);
  scene.add(g);
  return g;
}
{
  // along cracks + curbs + random
  const spots = [
    [-2.2,0.5],[-2.0,0.2],[0.5,0.3],[0.3,0.0],[1.9,1.6],[1.7,1.3],[-0.8,2.2],
    [2.9,-0.5],[3.1,-0.8],[-3.0,1.7],[-3.3,1.5],[-1.5,-1.5],[2.2,2.6],
    [-0.2,1.2],[1.1,0.7],[-2.6,2.8],[3.4,1.9],[-3.8,-0.6],[0.9,-1.7],
    [-1.9,-1.9],[2.6,0.2],[-0.5,3.1],[1.4,3.3],[-3.6,3.2],[3.7,3.0],
    [-2.9,-2.6],[-1.1,-2.8],[0.6,-2.5],[2.9,-2.9],[3.6,-1.2],[-3.9,2.1],
    [-1.6,0.9],[0.2,1.9],[2.4,2.2],[-2.4,-0.4],[1.2,-0.8],[-0.8,-1.2],
    [-0.4,0.6],[1.6,0.4],[-2.8,0.9],[0.8,1.6],[-1.2,1.5],[2.7,1.0],[-3.2,-0.2],[1.8,2.9],[-0.6,-2.2],[1.5,-2.4],[-2.2,-2.2],[3.2,2.4],[-0.9,2.9],[2.1,-0.3],[-1.8,0.4],[0.4,-0.6],[-3.6,0.3],[3.8,0.5],[-0.2,-1.8],[1.0,2.4],
    [3.3,0.9],[-3.4,-1.6],[0.9,3.6],[-1.3,3.5],[2.0,-1.1],[-2.0,2.4],
  ];
  for (const [x,z] of spots) tuft(x, z, rand(0.9,1.9));
  // moss patches
  const mossM = M(0x4a6a34,{roughness:1});
  for (const [x,z,r] of [[-1.2,-0.9,0.7],[2.2,1.1,0.6],[-3.0,0.6,0.55],[0.8,2.9,0.65],[1.9,-2.2,0.6],[-3.6,1.4,0.5],[-0.3,0.9,0.5],[1.4,0.2,0.45],[-2.4,2.1,0.55],[2.8,-1.3,0.5],[-1.8,-1.6,0.45],[0.5,3.4,0.5]]){
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 10), mossM);
    m.rotation.x = -Math.PI/2; m.position.set(x, GROUND+0.009, z);
    m.receiveShadow = true;
    scene.add(m);
  }
}

/* ---------- the brick facade fragment (back-right) ---------- */
const wallGroup = new THREE.Group();
const brickM = M(0x8a4a38,{roughness:0.95});
const brickD = M(0x74402f,{roughness:0.95});
{
  const W = 5.6, H = 3.5, D = 0.4;
  // main wall
  const wall = box(W, H, D, brickM);
  wall.position.set(0, H/2, 0); wallGroup.add(wall);
  // crumbled top edge
  const tops = [[-2.2,0.35],[ -1.1,0.62],[0.1,0.3],[1.3,0.7],[2.3,0.45]];
  for (const [x,h] of tops){
    const t = box(1.15, h, D, Math.random()<0.5?brickM:brickD);
    t.position.set(x, H + h/2, 0); wallGroup.add(t);
  }
  // brick coursing lines (subtle horizontal strips)
  for (let i=1;i<7;i++){
    const l = box(W+0.02, 0.025, D+0.02, brickD);
    l.position.set(0, i*0.5, 0); l.castShadow = false; wallGroup.add(l);
  }
  // windows: 2 x 3 grid of dark openings with frames; one boarded
  const holeM = M(0x14100c,{roughness:1});
  const frameM = M(0xd8d0c0,{roughness:0.85});
  const winPos = [];
  for (const wx of [-1.75, 0, 1.75])
    for (const wy of [1.15, 2.6]) winPos.push([wx, wy]);
  let k = 0;
  for (const [wx,wy] of winPos){
    const hole = box(0.95, 1.0, 0.1, holeM);
    hole.position.set(wx, wy, D/2+0.02); hole.castShadow = false; wallGroup.add(hole);
    // frame: two jambs + sill + broken header
    const j1 = box(0.08, 1.05, 0.12, frameM); j1.position.set(wx-0.5, wy, D/2+0.04); wallGroup.add(j1);
    const j2 = box(0.08, 1.05, 0.12, frameM); j2.position.set(wx+0.5, wy, D/2+0.04); wallGroup.add(j2);
    const sill = box(1.08, 0.09, 0.16, frameM); sill.position.set(wx, wy-0.55, D/2+0.05); wallGroup.add(sill);
    if (k === 1 || k === 4){
      // boarded: crossed planks
      const p1 = box(1.1, 0.14, 0.05, M(0x9a7a50,{roughness:1}));
      p1.position.set(wx, wy+0.15, D/2+0.07); p1.rotation.z = 0.12; wallGroup.add(p1);
      const p2 = box(1.1, 0.14, 0.05, M(0x8a6a44,{roughness:1}));
      p2.position.set(wx, wy-0.18, D/2+0.07); p2.rotation.z = -0.09; wallGroup.add(p2);
    } else if (k === 3){
      // tattered curtain
      const cur = box(0.5, 0.85, 0.03, M(0xc8b8a0,{roughness:1}));
      cur.position.set(wx-0.18, wy-0.05, D/2+0.06); cur.rotation.z = 0.06; wallGroup.add(cur);
    }
    k++;
  }
  // warm interior glow for one window (someone was here)
  const glowM = new THREE.MeshStandardMaterial({ color:0x2a1a10, emissive:0xffb050, emissiveIntensity:0 });
  const glow = box(0.8, 0.85, 0.05, glowM);
  glow.position.set(1.75, 2.6, D/2+0.03); glow.castShadow = false; wallGroup.add(glow);
  wallGroup.userData.glowM = glowM;
  // side return wall (L corner, left end)
  const ret = box(0.4, 2.6, 2.2, brickD);
  ret.position.set(-W/2, 1.3, 1.1); wallGroup.add(ret);
}
wallGroup.position.set(0.7, GROUND, -3.55);
scene.add(wallGroup);

/* ---------- vines climbing the facade ---------- */
const leafM1 = M(0x4a7a34,{roughness:0.9});
const leafM2 = M(0x5d8f3c,{roughness:0.9});
const leafM3 = M(0x7a9a3c,{roughness:0.9});
const leafM4 = M(0x2f5424,{roughness:0.95});
const LEAF_MATS = [leafM1, leafM2, leafM3, leafM3, leafM4, leafM1];
const leafPick = () => LEAF_MATS[(Math.random()*LEAF_MATS.length)|0];
{
  const vineM = M(0x3a5a28,{roughness:1});
  const paths = [
    [-2.6, 0.08], [-2.0, -0.1], [-1.6, 0.1], [-1.2, 0.05], [-0.9, -0.06], [-0.4, -0.15], [0.0, 0.1], [0.35, 0.05], [0.9, 0.12], [1.3, -0.08], [1.7, -0.1], [2.2, -0.05], [2.6, 0.1],
  ];
  for (const [px, drift] of paths){
    let y = 0.1, x = px;
    const top = rand(2.6, 3.9);
    while (y < top){
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.028, 0.5, 5), vineM);
      seg.position.set(x, y+0.22, 0.24);
      seg.rotation.z = rand(-0.2,0.2);
      wallGroup.add(seg);
      const nl = 6 + Math.floor(Math.random()*5);
      for (let i=0;i<nl;i++){
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(rand(0.07,0.2), 10, 8), leafPick());
        leaf.scale.set(1, 0.45, 0.8);
        leaf.position.set(x+rand(-0.22,0.22), y+rand(0,0.4), 0.28+rand(0,0.06));
        leaf.rotation.set(rand(0,3), rand(0,3), 0);
        leaf.castShadow = true;
        wallGroup.add(leaf);
      }
      y += 0.42; x += drift*0.4 + rand(-0.08,0.08);
    }
  }
  // bush clusters at the wall base: each bush is a clump of overlapping
  // squashed spheres at varied offsets/rotations so the silhouette is leafy,
  // not a single smooth blob
  for (const bx of [-2.6, -2.0, -1.3, -0.6, 0.1, 0.8, 1.5, 2.2, 2.9]){
    const clump = new THREE.Group();
    const baseR = rand(0.34, 0.5);
    // dense core: overlapping smooth lobes packed tight so no gaps show
    const core = 5 + Math.floor(rand(0, 3));
    for (let li = 0; li < core; li++){
      const r = baseR * rand(0.5, 0.85);
      const lobe = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), leafPick());
      const ang = (li / core) * Math.PI * 2 + rand(-0.5, 0.5);
      const rr = baseR * rand(0.1, 0.4);
      lobe.position.set(Math.cos(ang)*rr, r*rand(0.4, 0.7), Math.sin(ang)*rr*0.7);
      lobe.scale.set(rand(1.05, 1.35), rand(0.55, 0.75), rand(0.9, 1.05));
      lobe.rotation.set(rand(0,3), rand(0,3), rand(0,3));
      lobe.castShadow = true;
      clump.add(lobe);
    }
    // satellite leaflets: small lobes flung wider to break the silhouette
    const sats = 5 + Math.floor(rand(0, 4));
    for (let li = 0; li < sats; li++){
      const r = baseR * rand(0.18, 0.38);
      const lobe = new THREE.Mesh(new THREE.SphereGeometry(r, 9, 8), leafPick());
      const ang = rand(0, Math.PI * 2);
      const rr = baseR * rand(0.55, 1.05);
      lobe.position.set(Math.cos(ang)*rr, r*rand(0.3, 1.1) + baseR*rand(0, 0.35), Math.sin(ang)*rr*0.7);
      lobe.scale.set(rand(1.0, 1.5), rand(0.5, 0.8), rand(0.85, 1.1));
      lobe.rotation.set(rand(0,3), rand(0,3), rand(0,3));
      lobe.castShadow = true;
      clump.add(lobe);
    }
    // twiggy crown: a few thin tilted sprigs poking out at varied angles
    const sprigs = 3 + Math.floor(rand(0, 3));
    for (let si = 0; si < sprigs; si++){
      const sprig = new THREE.Mesh(new THREE.ConeGeometry(0.035, rand(0.26, 0.44), 6), leafPick());
      sprig.position.set(rand(-0.24, 0.24), baseR*0.85 + rand(0.08, 0.2), rand(-0.12, 0.12));
      sprig.rotation.set(rand(-0.5, 0.5), rand(0, 3), rand(-0.5, 0.5));
      sprig.castShadow = true;
      clump.add(sprig);
    }
    clump.position.set(bx, 0.06, 0.5 + rand(-0.08, 0.12));
    wallGroup.add(clump);
  }
  // creepers spilling over the crumbled roofline
  for (let i=0;i<26;i++){
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(rand(0.07,0.21), 10, 8), leafPick());
    leaf.scale.set(1, 0.5, 0.85);
    leaf.position.set(rand(-2.7, 2.7), rand(3.5, 4.15), 0.22 + rand(0, 0.1));
    leaf.castShadow = true;
    wallGroup.add(leaf);
  }
  // creepers framing random window corners
  for (const [wx,wy] of [[-1.75,1.15],[0,2.6],[1.75,1.15],[-1.75,2.6]]){
    for (let i=0;i<5;i++){
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(rand(0.045,0.12), 8, 7), leafPick());
      leaf.scale.set(1, 0.5, 0.8);
      leaf.position.set(wx + rand(-0.55,0.55), wy + rand(-0.6,0.6), 0.26);
      wallGroup.add(leaf);
    }
  }
}

/* ---------- ground creeper trails + saplings + hanging strands ---------- */
{

/* ---------- states ---------- */
const STATES = [
  { name:'day', top:0x8fb4c4, mid:0xcfd8c8, bottom:0xe8e0c0, fog:0xd8d8c8, fogD:0.006,
    hemi:[0xe0ecd8, 0x6a6248, 0.95], sunC:0xffeed0, sunI:2.4, sunPos:[5,8,4],
    fillI:0.4, fillC:0x9ab8a8, cfill:0, exp:1.12, stars:0, lamp:0, glow:0, flies:0, dust:0.3 },
  { name:'dusk', top:0xa093af, mid:0xd9b6a4, bottom:0xf1cfab, fog:0x9a6a50, fogD:0.009,
    hemi:[0xffd0a0, 0x5a4632, 0.72], sunC:0xff9850, sunI:1.7, sunPos:[6,3.5,2],
    fillI:0.3, fillC:0x8a7ab0, cfill:0.18, exp:1.09, stars:0.15, lamp:0.5, glow:0.5, flies:0.3, dust:0.42 },
  { name:'night', top:0x425678, mid:0x4f6385, bottom:0x5c7193, fog:0x080d14, fogD:0.012,
    hemi:[0x36405e, 0x20241c, 0.9], sunC:0x8898d8, sunI:0.85, sunPos:[-6,8,-4],
    fillI:0.55, fillC:0x4a5490, cfill:0.62, exp:1.15, stars:1, lamp:1, glow:1, flies:1, dust:0.5 },
];
let stateIdx = 0;
let blend = { t:1, from:STATES[0], to:STATES[0] };
function applyState(s){
  skyUniforms.topColor.value.set(s.top);
  skyUniforms.midColor.value.set(s.mid);
  skyUniforms.bottomColor.value.set(s.bottom);
  scene.fog.color.set(s.fog); scene.fog.density = s.fogD;
  hemi.color.set(s.hemi[0]); hemi.groundColor.set(s.hemi[1]); hemi.intensity = s.hemi[2];
  sun.color.set(s.sunC); sun.intensity = s.sunI; sun.position.set(...s.sunPos);
  fill.intensity = s.fillI; fill.color.set(s.fillC);
  camFill.intensity = s.cfill;
  renderer.toneMappingExposure = s.exp;
  stars.material.opacity = s.stars;
  dustMat.opacity = s.dust;
  flyMat.opacity = s.flies * 0.9;
  lampSpot.intensity = s.lamp * 55;
  lampHeadM.emissiveIntensity = 0.05 + s.lamp * 1.7;
  wallGroup.userData.glowM.emissiveIntensity = s.glow * 1.1;
  glowLight.intensity = s.glow * 7;
}
function mixStates(p, n, t){
  const mixC = (a,b)=>new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
  const mixN = (a,b)=>a+(b-a)*t;
  return {
    top:mixC(p.top,n.top), mid:mixC(p.mid,n.mid), bottom:mixC(p.bottom,n.bottom),
    fog:mixC(p.fog,n.fog), fogD:mixN(p.fogD,n.fogD),
    hemi:[mixC(p.hemi[0],n.hemi[0]), mixC(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
    sunC:mixC(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI),
    sunPos:[0,1,2].map(i=>mixN(p.sunPos[i],n.sunPos[i])),
    fillI:mixN(p.fillI,n.fillI), fillC:mixC(p.fillC,n.fillC), cfill:mixN(p.cfill,n.cfill), exp:mixN(p.exp,n.exp),
    stars:mixN(p.stars,n.stars), lamp:mixN(p.lamp,n.lamp), glow:mixN(p.glow,n.glow),
    flies:mixN(p.flies,n.flies), dust:mixN(p.dust,n.dust),
  };
}
function cycleState(){
  const from = blend.t >= 1 ? STATES[stateIdx] : mixStates(blend.from, blend.to, blend.t);
  stateIdx = (stateIdx+1) % STATES.length;
  blend = { t:0, from, to:STATES[stateIdx] };
}

/* ---------- headlights toggle ---------- */
let headlights = false;
function toggleHeadlights(){
  headlights = !headlights;
  lensM.emissiveIntensity = headlights ? 1.6 : 0.06;
  for (const sp of headSpots) sp.intensity = headlights ? 65 : 0;
}

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = 0, downPos = [0,0];
renderer.domElement.addEventListener('pointerdown', e=>{
  downAt = performance.now(); downPos = [e.clientX, e.clientY];
});
let lastUpAt = -999;
renderer.domElement.addEventListener('pointerup', e=>{
  const nowUp = performance.now();
  if (nowUp - lastUpAt < 150) return;
  lastUpAt = nowUp;
  if (nowUp-downAt > 350) return;
  if (Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]) > 8) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const carHit = ray.intersectObjects([car], true);
  if (carHit.length){ toggleHeadlights(); return; }
  const wallHit = ray.intersectObjects([wallGroup], true);
  if (wallHit.length){ startleBirds(); return; }
  const skyHit = ray.intersectObject(sky);
  if (skyHit.length) cycleState();
});

/* ---------- resize / loop ---------- */
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});
const clock = new THREE.Clock();
let elapsed = 0;
let lampFlicker = 0;
function tick(){
  requestAnimationFrame(tick);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  elapsed += dt;

  if (blend.t < 1){
    blend.t = Math.min(1, blend.t + rawDt/1.6);
    applyState(mixStates(blend.from, blend.to, blend.t));
  }

  // streetlamp flicker at night
  const s = blend.t >= 1 ? STATES[stateIdx] : null;
  if (s && s.lamp > 0.7){
    lampFlicker -= dt;
    if (lampFlicker <= 0){
      lampSpot.intensity = 55 * (Math.random() < 0.12 ? rand(0.2,0.6) : rand(0.9,1.05));
      lampHeadM.emissiveIntensity = 1.75 * (lampSpot.intensity/55);
      lampFlicker = rand(0.06, 0.5);
    }
  }

  // birds: idle bob + wing twitch; burst when startled
  for (const b of birds){
    const u = b.userData;
    if (u.t >= 0){
      u.t += dt;
      const k = u.t / 1.7;
      if (k >= 1){ u.t = -1; b.visible = false; u.respawn = elapsed + 4; continue; }
      b.visible = true;
      b.position.set(
        u.home.x + u.dir * k*k * 6,
        u.home.y + Math.sin(k*Math.PI*0.5) * 5,
        u.home.z + k * 2.5
      );
      const flap = Math.sin(elapsed*40) * 0.9;
      u.w1.rotation.x = flap; u.w2.rotation.x = -flap;
    } else if (u.respawn && elapsed > u.respawn){
      u.respawn = 0; b.visible = true; b.position.copy(u.home);
    } else if (b.visible){
      b.position.y = u.home.y + Math.sin(elapsed*2 + u.home.x) * 0.015;
      const tw = Math.sin(elapsed*6 + u.home.x*3) > 0.92 ? 0.5 : 0;
      u.w1.rotation.x = tw; u.w2.rotation.x = -tw;
    }
  }

  // fireflies drift + pulse
  const fp = flyGeo.attributes.position.array;
  for (let i=0;i<FLY_N;i++){
    const sd = flySeed[i];
    fp[i*3]   += Math.sin(elapsed*0.5 + sd) * dt * 0.25;
    fp[i*3+1] += Math.cos(elapsed*0.4 + sd*1.7) * dt * 0.18;
    fp[i*3+2] += Math.cos(elapsed*0.3 + sd*0.6) * dt * 0.22;
    if (fp[i*3+1] < 0.15) fp[i*3+1] = 0.15;
    if (fp[i*3+1] > 2.8) fp[i*3+1] = 2.8;
    if (fp[i*3] > 4.2) fp[i*3] = -4.2;
    if (fp[i*3] < -4.2) fp[i*3] = 4.2;
    if (fp[i*3+2] > 3.8) fp[i*3+2] = -3.8;
    if (fp[i*3+2] < -3.8) fp[i*3+2] = 3.8;
  }
  flyGeo.attributes.position.needsUpdate = true;
  flyMat.size = 0.05 + Math.sin(elapsed*3)*0.012;

  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i=0;i<DUST_N;i++){
    dp[i*3+1] += dt*0.05;
    dp[i*3] += Math.sin(elapsed*0.6 + i)*dt*0.02;
    if (dp[i*3+1] > 3.0) dp[i*3+1] = 0.05;
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
applyState(STATES[stateIdx]);
tick();
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
  document.body.classList.add('ready');
}, 700);
</script>
