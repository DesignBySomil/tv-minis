<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monica's apartment — inspired by Friends</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #3a2b52 0%, #1d152b 65%, #110c1b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff8ee;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px 12px;
      z-index: 10;
    }
    .header-box {
      text-align: center;
      background: rgba(24, 16, 38, 0.66);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 224, 130, 0.25);
      border-radius: 16px;
      padding: 8px 18px 9px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.32);
      max-width: 94vw;
    }
    .title {
      font-size: clamp(1.08rem, 3.8vw, 1.38rem);
      font-weight: 750;
      letter-spacing: 0.02em;
      color: #fff6e5;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      line-height: 1.15;
    }
    .subtitle {
      font-size: clamp(0.74rem, 2.5vw, 0.86rem);
      font-weight: 500;
      color: #ffd56b;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }
    .bottom-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 95vw;
    }
    .hint-pill {
      background: rgba(26, 18, 42, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 213, 107, 0.35);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: clamp(0.72rem, 2.6vw, 0.84rem);
      font-weight: 600;
      color: #ffefc8;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }
    .footer {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 240, 215, 0.68);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      background: #1d152b;
      color: #fff5e4;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 100;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud">
    <div class="header-box">
      <div class="title">Monica's apartment</div>
      <div class="subtitle">inspired by Friends</div>
    </div>
    <div class="bottom-stack">
      <div class="hint-pill">tap the purple door · tap the kitchen table</div>
      <div class="footer">A tiny world</div>
    </div>
  </div>
  <div id="fallback">
    <div>
      <strong>Unable to initialize 3D WebGL view.</strong><br/>
      Please ensure hardware acceleration and WebGL are enabled in your browser to explore Monica's purple apartment miniature.
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261102)
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261102);
    const randRange = (min, max) => min + rand() * (max - min);

    const container = document.getElementById('canvas-container');
    const fallbackEl = document.getElementById('fallback');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = false;
    controls.minPolarAngle = Math.PI * 0.18;
    controls.maxPolarAngle = Math.PI * 0.44;
    controls.minAzimuthAngle = -Math.PI * 0.12;
    controls.maxAzimuthAngle = Math.PI * 0.42;

    // Procedural Canvas Textures
    function createWoodFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#c8874b';
      ctx.fillRect(0, 0, 512, 512);
      const planks = 16;
      const pw = 512 / planks;
      for (let i = 0; i < planks; i++) {
        for (let j = 0; j < 4; j++) {
          const shade = Math.floor((rand() - 0.5) * 22);
          ctx.fillStyle = `rgb(${200 + shade}, ${134 + shade}, ${74 + Math.floor(shade * 0.6)})`;
          const y0 = ((j * 128 + (i % 2) * 64) % 512);
          ctx.fillRect(i * pw, y0, pw - 1.5, 126.5);
          ctx.fillStyle = 'rgba(90, 48, 18, 0.18)';
          for (let g = 0; g < 5; g++) {
            ctx.fillRect(i * pw + rand() * (pw - 4), y0 + rand() * 110, 1.5, 18);
          }
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createKitchenTileTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ded7c8';
      ctx.fillRect(0, 0, 256, 256);
      const grid = 8;
      const sz = 256 / grid;
      for (let x = 0; x < grid; x++) {
        for (let y = 0; y < grid; y++) {
          const isAccent = (x + y) % 2 === 0;
          ctx.fillStyle = isAccent ? '#f4efe4' : '#cbd7d2';
          ctx.fillRect(x * sz + 2, y * sz + 2, sz - 4, sz - 4);
          if ((x + y) % 4 === 0) {
            ctx.fillStyle = '#5c939b';
            ctx.fillRect(x * sz + sz * 0.35, y * sz + sz * 0.35, sz * 0.3, sz * 0.3);
          }
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createRugTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 384;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b93f35';
      ctx.fillRect(0, 0, 512, 384);

      // Rich borders
      ctx.strokeStyle = '#f2c15a';
      ctx.lineWidth = 18;
      ctx.strokeRect(20, 20, 472, 344);

      ctx.strokeStyle = '#2d5b6b';
      ctx.lineWidth = 10;
      ctx.strokeRect(42, 42, 428, 300);

      ctx.fillStyle = '#df8043';
      ctx.fillRect(58, 58, 396, 268);

      ctx.fillStyle = '#8e2824';
      ctx.fillRect(76, 76, 360, 232);

      // Medallions
      const drawDiamond = (cx, cy, rx, ry, col) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(cx, cy - ry);
        ctx.lineTo(cx + rx, cy);
        ctx.lineTo(cx, cy + ry);
        ctx.lineTo(cx - rx, cy);
        ctx.closePath();
        ctx.fill();
      };
      drawDiamond(256, 192, 115, 72, '#f5d076');
      drawDiamond(256, 192, 82, 50, '#2c6875');
      drawDiamond(256, 192, 46, 28, '#e35336');
      drawDiamond(135, 130, 28, 20, '#f4c762');
      drawDiamond(377, 130, 28, 20, '#f4c762');
      drawDiamond(135, 254, 28, 20, '#f4c762');
      drawDiamond(377, 254, 28, 20, '#f4c762');

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBrickTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b4232';
      ctx.fillRect(0, 0, 256, 256);
      const rows = 16;
      const cols = 8;
      const rh = 256 / rows;
      const cw = 256 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let col = -1; col <= cols; col++) {
          const v = Math.floor((rand() - 0.5) * 28);
          ctx.fillStyle = `rgb(${168 + v}, ${76 + Math.floor(v * 0.6)}, ${56 + Math.floor(v * 0.5)})`;
          ctx.fillRect(col * cw + offset + 1.5, r * rh + 1.5, cw - 3, rh - 3);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1.4, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createArtTexture(paletteType) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 160;
      const ctx = c.getContext('2d');
      if (paletteType === 0) {
        // Warm vintage poster feel
        ctx.fillStyle = '#f8e6b5';
        ctx.fillRect(0, 0, 128, 160);
        ctx.fillStyle = '#d94838';
        ctx.fillRect(14, 18, 100, 92);
        ctx.fillStyle = '#f7c143';
        ctx.beginPath();
        ctx.arc(64, 64, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#273859';
        ctx.fillRect(22, 120, 84, 12);
        ctx.fillRect(34, 138, 60, 8);
      } else {
        // Botanical / geometric art
        ctx.fillStyle = '#e7f2ed';
        ctx.fillRect(0, 0, 128, 160);
        ctx.fillStyle = '#2c7c6c';
        ctx.beginPath();
        ctx.arc(64, 85, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f08a4b';
        ctx.fillRect(46, 95, 36, 42);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Shared Materials (Bright, saturated, well-lit Monica purple and accents)
    const mats = {
      baseOuter: new THREE.MeshStandardMaterial({ color: 0x3b2c4e, roughness: 0.65 }),
      baseTrim: new THREE.MeshStandardMaterial({ color: 0xe6c387, roughness: 0.4, metalness: 0.15 }),
      woodFloor: new THREE.MeshStandardMaterial({ map: createWoodFloorTexture(), roughness: 0.55 }),
      tileFloor: new THREE.MeshStandardMaterial({ map: createKitchenTileTexture(), roughness: 0.45 }),
      rug: new THREE.MeshStandardMaterial({ map: createRugTexture(), roughness: 0.82 }),
      // Signature readable Monica Purple (vibrant lavender-plum, never dark/black)
      monicaPurple: new THREE.MeshStandardMaterial({
        color: 0x9b72cf,
        emissive: 0x26153d,
        emissiveIntensity: 0.35,
        roughness: 0.58
      }),
      doorPurple: new THREE.MeshStandardMaterial({
        color: 0x9368c9,
        emissive: 0x281540,
        emissiveIntensity: 0.38,
        roughness: 0.48
      }),
      yellowFrame: new THREE.MeshStandardMaterial({
        color: 0xffd438,
        emissive: 0xffae00,
        emissiveIntensity: 0.38,
        roughness: 0.32
      }),
      whiteTrim: new THREE.MeshStandardMaterial({ color: 0xf7f2eb, roughness: 0.45 }),
      exposedBrick: new THREE.MeshStandardMaterial({ map: createBrickTexture(), roughness: 0.78 }),
      tealCabinet: new THREE.MeshStandardMaterial({
        color: 0x3898a8,
        emissive: 0x0b2a30,
        emissiveIntensity: 0.25,
        roughness: 0.45
      }),
      counterTop: new THREE.MeshStandardMaterial({ color: 0xe8dec8, roughness: 0.38 }),
      butcherBlock: new THREE.MeshStandardMaterial({ color: 0xd19052, roughness: 0.5 }),
      warmWood: new THREE.MeshStandardMaterial({ color: 0xb5723d, roughness: 0.52 }),
      darkWood: new THREE.MeshStandardMaterial({ color: 0x6e4124, roughness: 0.58 }),
      fridgeWhite: new THREE.MeshStandardMaterial({ color: 0xfaf7f0, roughness: 0.28, metalness: 0.08 }),
      stoveBlack: new THREE.MeshStandardMaterial({ color: 0x2c2b33, roughness: 0.35, metalness: 0.3 }),
      chrome: new THREE.MeshStandardMaterial({ color: 0xdcdde0, roughness: 0.22, metalness: 0.75 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xf0c254, roughness: 0.28, metalness: 0.65 }),
      copperPot: new THREE.MeshStandardMaterial({
        color: 0xe36640,
        emissive: 0x3b1206,
        emissiveIntensity: 0.2,
        roughness: 0.32,
        metalness: 0.45
      }),
      creamSofa: new THREE.MeshStandardMaterial({ color: 0xf3e6d3, roughness: 0.72 }),
      terracottaChair: new THREE.MeshStandardMaterial({ color: 0xd96b43, roughness: 0.7 }),
      plantGreen: new THREE.MeshStandardMaterial({ color: 0x439c58, roughness: 0.55 }),
      plantDark: new THREE.MeshStandardMaterial({ color: 0x2c7540, roughness: 0.6 }),
      terracottaPot: new THREE.MeshStandardMaterial({ color: 0xc86441, roughness: 0.65 }),
      nightSky: new THREE.MeshBasicMaterial({ color: 0x1e2246 }),
      citySilhouette: new THREE.MeshBasicMaterial({ color: 0x2c2342 }),
      cityWindowWarm: new THREE.MeshBasicMaterial({ color: 0xffd778 }),
      cityWindowOrange: new THREE.MeshBasicMaterial({ color: 0xff9e54 }),
      glassPane: new THREE.MeshStandardMaterial({
        color: 0x9cd3ee,
        transparent: true,
        opacity: 0.22,
        roughness: 0.1,
        metalness: 0.2
      }),
      hallwayGlowMat: new THREE.MeshBasicMaterial({ color: 0xffd27d }),
      lampShadeMat: new THREE.MeshStandardMaterial({
        color: 0xffefc4,
        emissive: 0xffaa33,
        emissiveIntensity: 0.65,
        roughness: 0.4
      }),
      invisibleProxy: new THREE.MeshBasicMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false
      })
    };

    const diorama = new THREE.Group();
    scene.add(diorama);

    // Helper mesh builder
    function makeBox(w, h, d, mat, x = 0, y = 0, z = 0, parent = diorama, cast = true, receive = true) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z);
      m.castShadow = cast;
      m.receiveShadow = receive;
      parent.add(m);
      return m;
    }

    function makeCyl(rt, rb, h, seg, mat, x = 0, y = 0, z = 0, parent = diorama, cast = true, receive = true) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
      m.position.set(x, y, z);
      m.castShadow = cast;
      m.receiveShadow = receive;
      parent.add(m);
      return m;
    }

    // ==========================================
    // 1. LAYERED DISPLAY PLINTH & FLOORS
    // ==========================================
    // Compact footprint: W=7.2, D=6.2
    makeBox(7.5, 0.36, 6.5, mats.baseOuter, 0, -0.42, 0, diorama, false, true);
    makeBox(7.32, 0.14, 6.32, mats.baseTrim, 0, -0.18, 0, diorama, false, true);
    // Main Living Room hardwood floor
    makeBox(7.2, 0.16, 6.2, mats.woodFloor, 0, -0.06, 0, diorama, false, true);
    // Kitchen tiled floor platform (Left-Back zone)
    makeBox(3.55, 0.04, 3.65, mats.tileFloor, -1.75, 0.03, -1.18, diorama, false, true);
    // Raised window alcove step
    makeBox(2.55, 0.14, 1.35, mats.woodFloor, -0.1, 0.08, -2.35, diorama, true, true);
    makeBox(2.58, 0.04, 1.38, mats.whiteTrim, -0.1, 0.16, -2.35, diorama, false, true);

    // ==========================================
    // 2. PURPLE WALLS, WHITE TRIM & ARCHES
    // ==========================================
    const wallH = 4.35;
    const wallY = wallH / 2;

    // Back Wall Left (Behind Kitchen cabinets)
    makeBox(2.25, wallH, 0.22, mats.monicaPurple, -2.48, wallY, -3.0, diorama, true, true);
    // Back Wall Right (Between Window and Right Corner)
    makeBox(2.25, wallH, 0.22, mats.monicaPurple, 2.48, wallY, -3.0, diorama, true, true);
    // Back Wall Window Sill & Header
    makeBox(2.75, 0.78, 0.22, mats.monicaPurple, 0, 0.39, -3.0, diorama, true, true);
    makeBox(2.75, 0.65, 0.22, mats.monicaPurple, 0, 4.02, -3.0, diorama, true, true);

    // Exposed Brick Column Accent framing the Kitchen & Window
    makeBox(0.42, wallH + 0.05, 0.34, mats.exposedBrick, -1.32, wallY, -2.96, diorama, true, true);
    makeBox(0.42, wallH + 0.05, 0.34, mats.exposedBrick, 1.32, wallY, -2.96, diorama, true, true);

    // Overhead Purple Beam across Back Wall
    makeBox(7.24, 0.28, 0.34, mats.monicaPurple, 0, wallH - 0.1, -2.96, diorama, true, true);
    makeBox(7.28, 0.1, 0.38, mats.whiteTrim, 0, wallH + 0.06, -2.96, diorama, false, true);

    // Left Cutaway Wall (Steps down gently toward front so kitchen & table are 100% unobstructed)
    makeBox(0.22, wallH, 3.3, mats.monicaPurple, -3.5, wallY, -1.45, diorama, true, true);
    makeBox(0.22, 2.35, 1.45, mats.monicaPurple, -3.5, 1.175, 0.9, diorama, true, true);
    makeBox(0.22, 0.95, 1.45, mats.monicaPurple, -3.5, 0.475, 2.32, diorama, true, true);
    // Left Wall White Caps & Baseboards
    makeBox(0.26, 0.1, 3.34, mats.whiteTrim, -3.5, wallH + 0.05, -1.45, diorama, false, true);
    makeBox(0.26, 0.08, 1.48, mats.whiteTrim, -3.5, 2.39, 0.9, diorama, false, true);
    makeBox(0.26, 0.08, 1.48, mats.whiteTrim, -3.5, 0.99, 2.32, diorama, false, true);
    makeBox(0.06, 0.22, 6.1, mats.whiteTrim, -3.37, 0.11, 0, diorama, false, true);

    // Right Wall (Hero Entrance Wall with Entry Alcove & Purple Door)
    // Back segment of right wall
    makeBox(0.22, wallH, 3.9, mats.monicaPurple, 3.5, wallY, -1.15, diorama, true, true);
    // Stepped front segment of right wall
    makeBox(0.22, 2.75, 1.65, mats.monicaPurple, 3.5, 1.375, 1.62, diorama, true, true);
    makeBox(0.22, 1.05, 0.65, mats.monicaPurple, 3.5, 0.525, 2.76, diorama, true, true);
    // Right Wall White Crown & Baseboard
    makeBox(0.26, 0.1, 3.94, mats.whiteTrim, 3.5, wallH + 0.05, -1.15, diorama, false, true);
    makeBox(0.26, 0.08, 1.68, mats.whiteTrim, 3.5, 2.79, 1.62, diorama, false, true);
    makeBox(0.06, 0.22, 6.1, mats.whiteTrim, 3.37, 0.11, 0, diorama, false, true);
    // Back Wall White Baseboard
    makeBox(7.0, 0.22, 0.06, mats.whiteTrim, 0, 0.11, -2.87, diorama, false, true);

    // ==========================================
    // 3. TALL PANORAMIC WINDOW, BALCONY & CITY
    // ==========================================
    const windowGroup = new THREE.Group();
    windowGroup.position.set(0, 2.24, -3.0);
    diorama.add(windowGroup);

    // Deep night diorama box behind window
    makeBox(2.58, 3.15, 0.55, mats.nightSky, 0, 0, -0.35, windowGroup, false, false);

    // Distant warm apartment building silhouettes + tiny glowing city windows
    const bldgConfigs = [
      { x: -0.78, w: 0.62, h: 2.3, z: -0.45 },
      { x: -0.15, w: 0.68, h: 2.75, z: -0.48 },
      { x: 0.58, w: 0.72, h: 2.45, z: -0.44 }
    ];
    const cityWindowMats = [];
    bldgConfigs.forEach((b, bi) => {
      makeBox(b.w, b.h, 0.16, mats.citySilhouette, b.x, -1.45 + b.h / 2, b.z, windowGroup, false, false);
      const rows = 6;
      const cols = 3;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (rand() > 0.22) {
            const wMat = (r + c + bi) % 2 === 0 ? mats.cityWindowWarm.clone() : mats.cityWindowOrange.clone();
            cityWindowMats.push(wMat);
            const wx = b.x - b.w * 0.28 + c * (b.w * 0.28);
            const wy = -1.15 + r * 0.34;
            if (wy < -1.45 + b.h - 0.2) {
              makeBox(0.09, 0.15, 0.02, wMat, wx, wy, b.z + 0.09, windowGroup, false, false);
            }
          }
        }
      }
    });

    // Translucent Glass & Classic Mullions
    makeBox(2.32, 2.9, 0.04, mats.glassPane, 0, 0, 0.02, windowGroup, false, false);
    // Outer white frame
    makeBox(2.44, 0.1, 0.18, mats.whiteTrim, 0, 1.46, 0.04, windowGroup, true, true);

  }
  function noiseLoop(){ const s = ctx.createBufferSource(); s.buffer = NOISE; s.loop = true; s.start(); return s; }
  function filt(type, f, q){ const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gn(v){ const n = ctx.createGain(); n.gain.value = v; return n; }
  function lfo(freq, amt, param){ const o = ctx.createOscillator(); o.frequency.value = freq; const lg = gn(amt); o.connect(lg); lg.connect(param); o.start(); }
  function hum(f, v){ const o = ctx.createOscillator(); o.frequency.value = f; const g2 = gn(v); o.connect(g2); g2.connect(master); o.start(); }
  function every(minS, maxS, fn){ (function loop(){ if (ctx) fn(); setTimeout(loop, (minS + Math.random() * (maxS - minS)) * 1000); })(); }
  function ping(type, f0, f1, dur, vol){
    const o = ctx.createOscillator(); o.type = type; const g2 = gn(0);
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    o.connect(g2); g2.connect(master);
    g2.gain.setValueAtTime(0, ctx.currentTime);
    g2.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  function shot(dur){
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    const g2 = gn(0); s.connect(g2);
    s.start(); s.stop(ctx.currentTime + dur);
    return g2;
  }
  function echo(dt, fbv, wetv){
    const dl = ctx.createDelay(1); dl.delayTime.value = dt;
    const fb = gn(fbv); dl.connect(fb); fb.connect(dl);
    const wet = gn(wetv); dl.connect(wet); wet.connect(master);
    return dl;
  }

  const R = {
    wind(){ const bp = filt("bandpass", 480, 0.5), g2 = gn(0.09); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.07, 0.045, g2.gain); lfo(0.13, 170, bp.frequency); },
    coldwind(){ const bp = filt("bandpass", 830, 0.7), g2 = gn(0.065); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.09, 0.04, g2.gain); lfo(0.21, 250, bp.frequency); hum(52, 0.026); },
    crackle(){ every(0.05, 0.3, () => { const hp = filt("highpass", 1900), g2 = shot(0.05); g2.connect(hp); hp.connect(master); g2.gain.setValueAtTime(0.015 + Math.random() * 0.045, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.05); }); hum(62, 0.011); },
    murmur(){ const bp = filt("bandpass", 380, 1.1), g2 = gn(0.045); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); every(0.8, 2.4, () => bp.frequency.setTargetAtTime(250 + Math.random() * 380, ctx.currentTime, 0.4)); },
    clink(){ every(4, 9, () => ping("sine", 2000 + Math.random() * 400, 0, 0.16, 0.028)); },
    room(){ const lp = filt("lowpass", 220), g2 = gn(0.02); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); hum(58, 0.009); },
    hum(){ hum(120, 0.011); hum(240, 0.005); const bp = filt("bandpass", 1150, 3), g2 = gn(0.004); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); },
    humsoft(){ hum(100, 0.007); },
    plink(){ const dl = echo(0.42, 0.3, 0.4); every(4.5, 9, () => { const f = [660, 587, 494, 440, 392][Math.floor(Math.random() * 5)]; const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; const g2 = gn(0); o.connect(g2); g2.connect(master); g2.connect(dl); g2.gain.setValueAtTime(0.04, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 1.4); o.start(); o.stop(ctx.currentTime + 1.5); }); },
    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 3.5, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
    const hp = filt("highpass", 2600), g2 = shot(0.02);
    g2.connect(hp); hp.connect(master);
    g2.gain.setValueAtTime(0.05, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.02);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
</script>
