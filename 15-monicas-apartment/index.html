<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monica's Apartment — Inspired by FRIENDS</title>
  <style>
    :root {
      --bg-dark: #120d1d;
      --bg-mid: #231938;
      --accent-gold: #f5c542;
      --accent-purple: #7d66b8;
      --text-light: #f6f2ff;
      --text-dim: #bbaee0;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, var(--bg-mid) 0%, var(--bg-dark) 72%, #090610 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-light);
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Dark vignette overlay */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, rgba(18, 13, 29, 0) 55%, rgba(6, 4, 12, 0.68) 100%);
    }
    /* Header Pill */
    .header-pill {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px 8px 16px;
      background: rgba(24, 17, 40, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 197, 66, 0.35);
      border-radius: 999px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      max-width: calc(100vw - 20px);
    }
    .header-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      white-space: nowrap;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .header-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .header-hint {
      font-size: 10.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .reset-btn {
      appearance: none;
      border: 1px solid rgba(245, 197, 66, 0.45);
      background: rgba(125, 102, 184, 0.25);
      color: var(--accent-gold);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      flex-shrink: 0;
    }
    .reset-btn:hover {
      background: rgba(245, 197, 66, 0.2);
      transform: translateY(-1px);
    }
    .reset-btn:active {
      transform: translateY(0);
    }
    /* Toast feedback */
    #toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 10;
      background: rgba(20, 14, 34, 0.85);
      border: 1px solid rgba(245, 197, 66, 0.4);
      color: #ffe89e;
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 13px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    #toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* Footer */
    .footer-credit {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: rgba(215, 202, 245, 0.45);
      pointer-events: none;
      text-transform: uppercase;
    }
    /* Floating Circular Mute Button */
    .mute-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 12;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(26, 18, 44, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .mute-btn:hover {
      transform: scale(1.06);
      border-color: rgba(245, 197, 66, 0.55);
    }
    .mute-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    @media (max-width: 380px) {
      .header-pill {
        padding: 6px 10px 6px 12px;
        gap: 8px;
      }
      .header-title {
        font-size: 12.5px;
      }
      .header-subtitle {
        font-size: 9.5px;
      }
      .header-hint {
        font-size: 9.5px;
      }
      .reset-btn {
        padding: 4px 9px;
        font-size: 10px;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <header class="header-pill">
    <div class="header-text">
      <div class="title-row">
        <span class="header-title">Monica's apartment</span>
        <span class="header-subtitle">inspired by FRIENDS</span>
      </div>
      <div class="header-hint">Tap door #20 or the gold peephole frame</div>
    </div>
    <button class="reset-btn" id="reset-btn" type="button">Reset</button>
  </header>

  <div id="toast"></div>

  <footer class="footer-credit">A TINY WORLD</footer>

  <button class="mute-btn" id="mute-btn" type="button" aria-label="Toggle Audio">
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. PROCEDURAL WEBAUDIO MODULE & TEST HOOK
    // =========================================================================
    const STORAGE_KEY = 'tvmini-muted';
    let isMuted = localStorage.getItem(STORAGE_KEY) === 'true';

    class TVAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.analyser = null;
        this.streamDest = null;
        this.started = false;
        this.timeData = new Float32Array(256);
      }

      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = isMuted ? 0 : 0.85;

        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 256;

        this.streamDest = this.ctx.createMediaStreamDestination();

        this.masterGain.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
        this.masterGain.connect(this.streamDest);

        this._startAmbience();
        this.started = true;
      }

      _startAmbience() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Soft NYC apartment room tone + warm low city rumble
        const bufferSize = this.ctx.sampleRate * 3;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = output[i];
          output[i] *= 0.15;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 190;

        const ambGain = this.ctx.createGain();
        ambGain.gain.value = 0.18;

        // Subtle warm harmonic drone (cozy apartment fridge/room hum)
        const humOsc = this.ctx.createOscillator();
        humOsc.type = 'sine';
        humOsc.frequency.value = 110;
        const humGain = this.ctx.createGain();
        humGain.gain.value = 0.018;

        whiteNoise.connect(filter);
        filter.connect(ambGain);
        ambGain.connect(this.masterGain);

        humOsc.connect(humGain);
        humGain.connect(this.masterGain);

        whiteNoise.start(now);
        humOsc.start(now);
      }

      setMuted(mute) {
        isMuted = !!mute;
        localStorage.setItem(STORAGE_KEY, isMuted ? 'true' : 'false');
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.85, this.ctx.currentTime, 0.04);
        }
      }

      playSfx(type) {
        this.init();
        if (!this.ctx || isMuted) return;
        const now = this.ctx.currentTime;

        if (type === 'door') {
          // Creak + soft latch click
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.18);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.35);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'knock') {
          // Two warm wooden knocks + playful blink chime
          [0, 0.16].forEach((offset, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(idx === 0 ? 145 : 158, now + offset);
            osc.frequency.exponentialRampToValueAtTime(55, now + offset + 0.09);
            gain.gain.setValueAtTime(0.28, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now + offset);
            osc.stop(now + offset + 0.11);
          });
          // Eyelid blink sparkle
          const blinkOsc = this.ctx.createOscillator();
          const blinkGain = this.ctx.createGain();
          blinkOsc.type = 'sine';
          blinkOsc.frequency.setValueAtTime(880, now + 0.34);
          blinkOsc.frequency.exponentialRampToValueAtTime(1320, now + 0.46);
          blinkGain.gain.setValueAtTime(0.08, now + 0.34);
          blinkGain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
          blinkOsc.connect(blinkGain);
          blinkGain.connect(this.masterGain);
          blinkOsc.start(now + 0.34);
          blinkOsc.stop(now + 0.5);
        } else if (type === 'tidy') {
          // Neat ascending arpeggio (Monica's satisfaction)
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const t = now + i * 0.065;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.11, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(t);
            osc.stop(t + 0.24);
          });
        } else if (type === 'poster') {
          // Swish + camera shutter click
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.18);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'fridge') {
          // Suction pop + gentle hum
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'window') {
          // Day/night dreamy chord shift
          const freqs = [392.0, 493.88, 587.33];
          freqs.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.04);
            gain.gain.setValueAtTime(0.08, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now + i * 0.04);
            osc.stop(now + 0.48);
          });
        }
      }

      rms() {
        if (!this.analyser || isMuted) return 0;
        this.analyser.getFloatTimeDomainData(this.timeData);
        let sum = 0;
        for (let i = 0; i < this.timeData.length; i++) {
          sum += this.timeData[i] * this.timeData[i];
        }
        return Math.sqrt(sum / this.timeData.length);
      }

      state() {
        return {
          initialized: !!this.ctx,
          contextState: this.ctx ? this.ctx.state : 'uninitialized',
          muted: isMuted,
          rms: this.rms()
        };
      }

      record(sec = 1) {
        this.init();
        return new Promise((resolve) => {
          if (!this.streamDest || typeof MediaRecorder === 'undefined') {
            resolve({ duration: sec, rms: this.rms(), bytes: 0 });
            return;
          }
          const chunks = [];
          const rec = new MediaRecorder(this.streamDest.stream);
          rec.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };
          rec.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            resolve({ duration: sec, rms: this.rms(), bytes: blob.size, blob });
          };
          rec.start();
          setTimeout(() => {
            if (rec.state === 'recording') rec.stop();
          }, Math.max(100, sec * 1000));
        });
      }
    }

    const audioEngine = new TVAudioEngine();
    window.__tvAudio = {
      rms: () => audioEngine.rms(),
      state: () => audioEngine.state(),
      record: (sec) => audioEngine.record(sec)
    };

    const muteBtn = document.getElementById('mute-btn');
    const iconOn = document.getElementById('icon-sound-on');
    const iconOff = document.getElementById('icon-sound-off');

    function updateMuteUI() {
      iconOn.style.display = isMuted ? 'none' : 'block';
      iconOff.style.display = isMuted ? 'block' : 'none';
    }
    updateMuteUI();

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audioEngine.init();
      audioEngine.setMuted(!isMuted);
      updateMuteUI();
    });

    window.addEventListener('pointerdown', () => {
      audioEngine.init();
    }, { once: true });

    // Toast helper
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2100);
    }

    // =========================================================================
    // 2. PROCEDURAL CANVAS TEXTURES
    // =========================================================================
    function createWoodFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b9824f';
      ctx.fillRect(0, 0, 512, 512);

      const rows = 16;
      const cols = 4;
      const rh = 512 / rows;
      const cw = 512 / cols;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let col = -1; col <= cols; col++) {
          const x = col * cw + offset;
          const y = r * rh;
          const shade = (Math.sin(r * 7 + col * 13) * 12) | 0;
          ctx.fillStyle = `rgb(${182 + shade}, ${126 + shade}, ${76 + (shade >> 1)})`;
          ctx.fillRect(x + 1, y + 1, cw - 2, rh - 2);

          // Wood grain lines
          ctx.strokeStyle = 'rgba(95, 55, 25, 0.16)';
          ctx.lineWidth = 1;
          for (let g = 0; g < 3; g++) {
            ctx.beginPath();
            ctx.moveTo(x + 3, y + 6 + g * 8);
            ctx.lineTo(x + cw - 3, y + 6 + g * 8 + (g % 2 ? 2 : -2));
            ctx.stroke();
          }
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3.5, 2.8);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBrickTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#c8bca8'; // mortar
      ctx.fillRect(0, 0, 256, 256);

      const rows = 12;
      const cols = 6;
      const rh = 256 / rows;
      const cw = 256 / cols;

      for (let r = 0; r < rows; r++) {
        const off = (r % 2) * (cw / 2);
        for (let col = -1; col <= cols; col++) {
          const v = ((Math.sin(r * 19 + col * 23) * 22) | 0);
          ctx.fillStyle = `rgb(${168 + v}, ${76 + (v >> 1)}, ${58 + (v >> 1)})`;
          ctx.fillRect(col * cw + off + 2, r * rh + 2, cw - 4, rh - 4);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 2.2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createJouetsPosterTexture() {
      // Jules Chéret "Aux Buttes Chaumont - Jouets" vintage French poster
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 384;
      const ctx = c.getContext('2d');

      // Warm vintage cream background
      const grad = ctx.createLinearGradient(0, 0, 0, 384);
      grad.addColorStop(0, '#f7e7c4');
      grad.addColorStop(0.5, '#f2d5a0');
      grad.addColorStop(1, '#e8be82');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 384);

      // Decorative red border
      ctx.strokeStyle = '#b92e22';
      ctx.lineWidth = 10;
      ctx.strokeRect(10, 10, 236, 364);
      ctx.strokeStyle = '#2d4b5a';
      ctx.lineWidth = 3;
      ctx.strokeRect(18, 18, 220, 348);

      // Header text "AUX BUTTES CHAUMONT"
      ctx.fillStyle = '#263a47';
      ctx.font = 'bold 17px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('AUX BUTTES CHAUMONT', 128, 46);

      // Big iconic red "JOUETS" banner
      ctx.fillStyle = '#c8281c';
      ctx.font = 'bold 46px Impact, Georgia, serif';
      ctx.fillText('JOUETS', 128, 96);

      // Joyful child in red dress figure
      ctx.fillStyle = '#d43828';
      ctx.beginPath();
      ctx.moveTo(135, 145);
      ctx.lineTo(100, 245);
      ctx.lineTo(175, 245);
      ctx.closePath();
      ctx.fill();

      // Child head + golden hair
      ctx.fillStyle = '#e59b38';
      ctx.beginPath();
      ctx.arc(140, 128, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbe0c2';
      ctx.beginPath();
      ctx.arc(136, 130, 14, 0, Math.PI * 2);
      ctx.fill();

      // White rocking horse silhouette across lower center
      ctx.fillStyle = '#fff9ee';
      ctx.strokeStyle = '#3b281e';
      ctx.lineWidth = 3;
      // Horse body & neck
      ctx.beginPath();
      ctx.ellipse(122, 250, 46, 22, -0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Horse head & neck
      ctx.beginPath();
      ctx.moveTo(85, 245);
      ctx.lineTo(66, 200);
      ctx.lineTo(44, 212);
      ctx.lineTo(54, 226);
      ctx.lineTo(74, 252);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Red saddle
      ctx.fillStyle = '#c8281c';
      ctx.fillRect(108, 228, 28, 14);

      // Curved wooden rocker bow at bottom
      ctx.strokeStyle = '#7a3b1e';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(128, 235, 92, 0.25 * Math.PI, 0.75 * Math.PI);
      ctx.stroke();

      ctx.font = 'bold 15px Georgia, serif';
      ctx.fillText('PARIS • ÉTRENNES', 128, 352);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createRugTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#a43f34';
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = '#e7c582';
      ctx.lineWidth = 10;
      ctx.strokeRect(14, 14, 228, 228);

      ctx.strokeStyle = '#2d4b5a';
      ctx.lineWidth = 6;
      ctx.strokeRect(28, 28, 200, 200);

      // Medallions
      ctx.fillStyle = '#dfae64';
      for (let y = 56; y <= 200; y += 48) {
        for (let x = 56; x <= 200; x += 48) {
          ctx.beginPath();
          ctx.arc(x, y, 14, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

      ctx.fillStyle = '#f5ead6';
      ctx.fillRect(0, 0, 128, 128);
      // Cheek blush
      ctx.fillStyle = '#e38776';
      ctx.beginPath();
      ctx.arc(38, 76, 12, 0, Math.PI * 2);
      ctx.arc(90, 76, 12, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#221c18';
      ctx.beginPath();
      ctx.arc(44, 52, 5, 0, Math.PI * 2);
      ctx.arc(84, 52, 5, 0, Math.PI * 2);
      ctx.fill();
      // Smile
      ctx.strokeStyle = '#c43e2f';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(64, 68, 18, 0.15 * Math.PI, 0.85 * Math.PI);

      { type: 'mat', color: 0x62a865, messyPos: [0.14, 0.87, 0.52], messyRot: 0.38, neatPos: [0, 0.87, 0.55], neatRot: Math.PI / 2 },
      { type: 'mat', color: 0xe69f35, messyPos: [-0.16, 0.87, -0.49], messyRot: -0.62, neatPos: [0, 0.87, -0.55], neatRot: Math.PI / 2 }
    ];

    propDefs.forEach((pd) => {
      let mesh;
      if (pd.type === 'vase') {
        mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.08, 0.11, 0.22, 12),
          new THREE.MeshStandardMaterial({ color: pd.color, roughness: 0.35 })
        );
      } else {
        mesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.025, 0.36),
          new THREE.MeshStandardMaterial({ color: pd.color, roughness: 0.7 })
        );
      }
      mesh.userData.interactable = 'table';
      diningGroup.add(mesh);
      tableProps.push({ mesh, pd });
    });

    // Hit cylinder covering the whole dining table & chairs
    const tableHit = new THREE.Mesh(
      new THREE.CylinderGeometry(1.4, 1.4, 1.15, 16),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    tableHit.position.y = 0.55;
    tableHit.userData.interactable = 'table';
    diningGroup.add(tableHit);

    // =========================================================================
    // 8. RIGHT-CENTER: LIVING AREA (Cream Couch, Coffee Table w/ Flower Pot +
    //    Magazines, Separate Armchair, TV Set on Wooden Dresser + Potted Ferns)
    // =========================================================================
    const livingGroup = new THREE.Group();
    livingGroup.position.set(1.85, 0.08, 0.75);
    diorama.add(livingGroup);

    // Flea-market Persian Area Rug
    const rugMesh = new THREE.Mesh(
      new THREE.BoxGeometry(3.8, 0.025, 3.1),
      new THREE.MeshStandardMaterial({ map: createRugTexture(), roughness: 0.88 })
    );
    rugMesh.position.set(0.2, 0.015, 0.1);
    rugMesh.receiveShadow = true;
    livingGroup.add(rugMesh);

    // White/Cream Couch (facing right toward the TV)
    const couchGroup = new THREE.Group();
    couchGroup.position.set(-0.75, 0, 0.05);
    couchGroup.rotation.y = Math.PI / 2; // Faces +X (toward TV on right wall)
    livingGroup.add(couchGroup);

    const couchSeat = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.42, 0.92), mats.couchCream);
    couchSeat.position.y = 0.26;
    couchSeat.castShadow = true;
    couchSeat.receiveShadow = true;
    couchGroup.add(couchSeat);

    const couchBack = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.85, 0.26), mats.couchCream);
    couchBack.position.set(0, 0.56, -0.35);
    couchBack.castShadow = true;
    couchGroup.add(couchBack);

    [-1.08, 1.08].forEach((ax) => {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.64, 0.92), mats.couchCream);
      arm.position.set(ax, 0.42, 0);
      arm.castShadow = true;
      couchGroup.add(arm);
    });

    // Colorful throw pillows on the cream couch
    [
      { x: -0.78, color: 0xc84b3c, rot: 0.2 },
      { x: 0.0, color: 0x4b7fa8, rot: -0.1 },
      { x: 0.78, color: 0xe3b23c, rot: -0.25 }
    ].forEach((pl) => {
      const pillow = new THREE.Mesh(
        new THREE.BoxGeometry(0.36, 0.34, 0.14),
        new THREE.MeshStandardMaterial({ color: pl.color, roughness: 0.8 })
      );
      pillow.position.set(pl.x, 0.62, -0.16);
      pillow.rotation.z = pl.rot;
      couchGroup.add(pillow);
    });

    // Wooden Coffee Table in front of the couch (with Flower Pot + Magazines)
    const coffeeTableGroup = new THREE.Group();
    coffeeTableGroup.position.set(0.45, 0, 0.05);
    livingGroup.add(coffeeTableGroup);

    const ctTop = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.07, 1.55), mats.woodWarm);
    ctTop.position.y = 0.44;
    ctTop.castShadow = true;
    ctTop.receiveShadow = true;
    coffeeTableGroup.add(ctTop);

    [[-0.32, -0.65], [0.32, -0.65], [-0.32, 0.65], [0.32, 0.65]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.42, 0.06), mats.woodWarm);
      leg.position.set(lx, 0.21, lz);
      coffeeTableGroup.add(leg);
    });

    // Flower pot on coffee table
    const ctPot = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.08, 0.16, 12), mats.terraCotta);
    ctPot.position.set(0, 0.55, -0.22);
    coffeeTableGroup.add(ctPot);
    const ctFoliage = new THREE.Mesh(new THREE.DodecahedronGeometry(0.15, 1), mats.fernGreen);
    ctFoliage.position.set(0, 0.68, -0.22);
    coffeeTableGroup.add(ctFoliage);
    const ctBlossom = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xf46b94 })
    );
    ctBlossom.position.set(0.04, 0.78, -0.2);
    coffeeTableGroup.add(ctBlossom);

    // Magazines fanned out on coffee table
    [
      { z: 0.22, rot: 0.18, color: 0x3882b8 },
      { z: 0.36, rot: -0.24, color: 0xd9483b }
    ].forEach((mg) => {
      const mag = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.02, 0.36),
        new THREE.MeshStandardMaterial({ color: mg.color, roughness: 0.5 })
      );
      mag.position.set(0.04, 0.485, mg.z);
      mag.rotation.y = mg.rot;
      coffeeTableGroup.add(mag);
    });

    // Separate Vintage Armchair (angled comfortably near the coffee table)
    const armchairGroup = new THREE.Group();
    armchairGroup.position.set(0.35, 0, -1.45);
    armchairGroup.rotation.y = -0.45;
    livingGroup.add(armchairGroup);

    const acSeat = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.4, 0.85), mats.armchairMustard);
    acSeat.position.y = 0.25;
    acSeat.castShadow = true;
    armchairGroup.add(acSeat);
    const acBack = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.82, 0.24), mats.armchairMustard);
    acBack.position.set(0, 0.55, -0.32);
    acBack.castShadow = true;
    armchairGroup.add(acBack);
    [-0.38, 0.38].forEach((ax) => {
      const acArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.58, 0.85), mats.armchairMustard);
      acArm.position.set(ax, 0.38, 0);
      armchairGroup.add(acArm);
    });

    // Cozy Standing Floor Lamp with warm glowing shade
    const lampGroup = new THREE.Group();
    lampGroup.position.set(-0.7, 0, -1.55);
    const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.06, 16), mats.brass);
    lampBase.position.y = 0.03;
    lampGroup.add(lampBase);
    const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.85, 10), mats.brass);
    lampPole.position.y = 0.95;
    lampGroup.add(lampPole);
    const lampShade = new THREE.Mesh(
      new THREE.ConeGeometry(0.34, 0.42, 16, 1, true),
      new THREE.MeshStandardMaterial({
        color: 0xffe4a8,
        emissive: 0xffa838,
        emissiveIntensity: 0.65,
        side: THREE.DoubleSide
      })
    );
    lampShade.position.y = 1.92;
    lampGroup.add(lampShade);
    livingGroup.add(lampGroup);

    // --- TV SET ON A WOODEN DRESSER WITH POTTED FERNS BESIDE IT ---
    const tvDresserGroup = new THREE.Group();
    tvDresserGroup.position.set(2.95, 0, 1.05); // Right wall area below/near JOUETS poster
    livingGroup.add(tvDresserGroup);

    const dresser = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.78, 1.45), mats.woodDark);
    dresser.position.y = 0.42;
    dresser.castShadow = true;
    dresser.receiveShadow = true;
    tvDresserGroup.add(dresser);

    // CRT TV set angled slightly toward the couch
    const tvSetGroup = new THREE.Group();
    tvSetGroup.position.set(0, 0.82, 0);
    tvSetGroup.rotation.y = 0.18;
    const tvBox = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.56, 0.68), mats.tvBlack);
    tvBox.position.y = 0.28;
    tvBox.castShadow = true;
    tvSetGroup.add(tvBox);

    const tvScreenMat = new THREE.MeshBasicMaterial({ color: 0x6ea8d6 });
    const tvScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.42), tvScreenMat);
    tvScreen.rotation.y = -Math.PI / 2;
    tvScreen.position.set(-0.265, 0.29, 0);
    tvSetGroup.add(tvScreen);

    // Rabbit-ear antennas on TV
    [-0.18, 0.18].forEach((az) => {
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.45, 6), mats.chrome);
      ant.position.set(0, 0.72, az);
      ant.rotation.x = az > 0 ? 0.45 : -0.45;
      tvSetGroup.add(ant);
    });
    tvDresserGroup.add(tvSetGroup);

    // Potted Ferns beside the TV dresser (both sides)
    function createPottedFern(x, z, scale = 1) {
      const fg = new THREE.Group();
      fg.position.set(x, 0, z);
      fg.scale.setScalar(scale);
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.15, 0.36, 12), mats.terraCotta);
      pot.position.y = 0.18;
      pot.castShadow = true;
      fg.add(pot);
      for (let f = 0; f < 9; f++) {
        const frond = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.55, 5), mats.fernGreen);
        const a = (f / 9) * Math.PI * 2;
        frond.position.set(Math.cos(a) * 0.14, 0.48, Math.sin(a) * 0.14);
        frond.rotation.z = -Math.cos(a) * 0.65;
        frond.rotation.x = Math.sin(a) * 0.65;
        fg.add(frond);
      }
      return fg;
    }

    const fern1 = createPottedFern(2.95, 0.05, 1.0);
    const fern2 = createPottedFern(2.95, 2.02, 0.92);
    livingGroup.add(fern1);
    livingGroup.add(fern2);

    // =========================================================================
    // 9. FLOATING DUST MOTES & WINDOW LIGHT SHIMMER
    // =========================================================================
    const moteCount = 65;
    const moteGeo = new THREE.BufferGeometry();
    const motePositions = new Float32Array(moteCount * 3);
    const motePhases = new Float32Array(moteCount);

    for (let i = 0; i < moteCount; i++) {
      motePositions[i * 3] = (Math.random() - 0.5) * 9.2;
      motePositions[i * 3 + 1] = 0.6 + Math.random() * 3.4;
      motePositions[i * 3 + 2] = (Math.random() - 0.5) * 6.2;
      motePhases[i] = Math.random() * Math.PI * 2;
    }
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));

    const moteMat = new THREE.PointsMaterial({
      color: 0xfff3c4,
      size: 0.085,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const dustMotes = new THREE.Points(moteGeo, moteMat);
    diorama.add(dustMotes);

    // =========================================================================
    // 10. INTERACTION STATE MACHINE & ANIMATIONS
    // =========================================================================
    const state = {
      doorOpen: false,
      doorAngle: 0,
      peepBlinkTime: -10,
      tableTidy: false,
      tableTidyMix: 0, // 0 = messy, 1 = neat
      posterOpen: false,
      posterAngle: 0,
      fridgeOpen: false,
      fridgeAngle: 0,
      isNight: false,
      nightMix: 0
    };

    function applyTableMix(mix) {
      chairObjects.forEach(({ group, cfg }) => {
        const dist = THREE.MathUtils.lerp(cfg.messyDist, cfg.neatDist, mix);
        const rotOffset = THREE.MathUtils.lerp(cfg.messyRot, cfg.neatRot, mix);
        group.position.set(Math.sin(cfg.angle) * dist, 0, Math.cos(cfg.angle) * dist);
        group.rotation.y = cfg.angle + Math.PI + rotOffset;
      });
      tableProps.forEach(({ mesh, pd }) => {
        mesh.position.set(
          THREE.MathUtils.lerp(pd.messyPos[0], pd.neatPos[0], mix),
          THREE.MathUtils.lerp(pd.messyPos[1], pd.neatPos[1], mix),
          THREE.MathUtils.lerp(pd.messyPos[2], pd.neatPos[2], mix)
        );
        mesh.rotation.y = THREE.MathUtils.lerp(pd.messyRot, pd.neatRot, mix);
      });
    }
    applyTableMix(0);

    function resetAll() {
      state.doorOpen = false;
      state.peepBlinkTime = -10;
      state.tableTidy = false;
      state.posterOpen = false;
      state.fridgeOpen = false;
      state.isNight = false;
      frameCameraToViewport();
      showToast('Apartment reset to initial state');
    }

    document.getElementById('reset-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      audioEngine.playSfx('tidy');
      resetAll();
    });

    // Raycaster & Tap Detection (distinguishes tap from orbit drag)
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downX = 0;
    let downY = 0;
    let downTime = 0;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      downX = e.clientX;
      downY = e.clientY;
      downTime = performance.now();
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;
      const dt = performance.now() - downTime;
      if (Math.hypot(dx, dy) > 10 || dt > 500) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(diorama.children, true);

      let targetType = null;
      for (const hit of hits) {
        let obj = hit.object;
        while (obj) {
          if (obj.userData && obj.userData.interactable) {
            targetType = obj.userData.interactable;
            break;
          }
          obj = obj.parent;
        }
        if (targetType) break;
      }

      if (!targetType) return;

      if (targetType === 'peephole') {
        state.peepBlinkTime = performance.now() * 0.001;
        audioEngine.playSfx('knock');
        showToast('Knock-knock! The peephole frame winks');
      } else if (targetType === 'door') {
        state.doorOpen = !state.doorOpen;
        audioEngine.playSfx('door');
        showToast(state.doorOpen ? 'Purple Door #20 opened to the hallway' : 'Purple Door #20 closed');
      } else if (targetType === 'table') {
        state.tableTidy = !state.tableTidy;
        audioEngine.playSfx('tidy');
        showToast(state.tableTidy ? 'Monica tidied the kitchen table!' : 'Table back to lived-in mode');
      } else if (targetType === 'poster') {
        state.posterOpen = !state.posterOpen;
        audioEngine.playSfx('poster');
        showToast(state.posterOpen ? 'JOUETS poster swung aside: hidden camera hole!' : 'JOUETS poster closed');
      } else if (targetType === 'fridge') {
        state.fridgeOpen = !state.fridgeOpen;
        audioEngine.playSfx('fridge');
        showToast(state.fridgeOpen ? 'Fridge opened — stocked & lit!' : 'Fridge closed');
      } else if (targetType === 'window') {
        state.isNight = !state.isNight;
        audioEngine.playSfx('window');
        showToast(state.isNight ? 'Nighttime in Greenwich Village' : 'Warm Manhattan daylight');
      }
    });

    // =========================================================================
    // 11. RESPONSIVE PORTRAIT-FIRST CAMERA FRAMING
    // =========================================================================
    // Compute scene bounding sphere once so nothing ever clips at 320x700, 390x844, 616x562, or desktop
    const sceneBox = new THREE.Box3().setFromObject(diorama);
    const sceneSphere = new THREE.Sphere();
    sceneBox.getBoundingSphere(sceneSphere);

    // Classic sitcom cutaway direction: front-left-elevated so kitchen, bay window, couch & purple door are all prominent
    const cutawayDir = new THREE.Vector3(-0.17, 0.76, 0.66).normalize();

    function frameCameraToViewport() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const aspect = vw / vh;

      camera.aspect = aspect;

      // Adjust FOV slightly for tall portrait vs landscape so vertical space is filled richly
      camera.fov = aspect < 0.75 ? 44 : 32;
      camera.updateProjectionMatrix();

      const vFovRad = THREE.MathUtils.degToRad(camera.fov);
      const hFovRad = 2 * Math.atan(Math.tan(vFovRad / 2) * aspect);

      // Reserve safe margin for header pill at top and footer credit at bottom
      const safeHorizFraction = aspect < 0.75 ? 0.95 : 0.84;
      const safeVertFraction = aspect < 0.75 ? 0.78 : 0.78;

      // Projected horizontal & vertical extents of the angled cutaway box
      const effectiveRadiusH = sceneSphere.radius * 0.91;
      const effectiveRadiusV = sceneSphere.radius * 0.66;

      const distH = effectiveRadiusH / (Math.tan(hFovRad / 2) * safeHorizFraction);
      const distV = effectiveRadiusV / (Math.tan(vFovRad / 2) * safeVertFraction);
      const distance = Math.max(distH, distV) * (aspect < 0.75 ? 1.0 : 1.0);

      // Upward target offset on narrow screens so the diorama sits centered between header & footer
      const targetYOffset = aspect < 0.75 ? 0.05 : 0.12;
      const target = new THREE.Vector3(
        sceneSphere.center.x + 0.30,
        sceneSphere.center.y + targetYOffset,
        sceneSphere.center.z
      );

      controls.target.copy(target);
      camera.position.copy(target).addScaledVector(cutawayDir, distance);
      controls.minDistance = distance * 0.55;
      controls.maxDistance = distance * 1.45;
      controls.update();
    }

    frameCameraToViewport();
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      frameCameraToViewport();
    });

    // =========================================================================
    // 12. RENDER LOOP & SUBTLE IDLE ANIMATIONS
    // =========================================================================
    const clock = new THREE.Clock();
    const daySkyColor = new THREE.Color(0x87b8e6);
    const nightSkyColor = new THREE.Color(0x131836);
    const dayWinGlow = new THREE.Color(0xffefc2);
    const nightWinGlow = new THREE.Color(0x283666);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      // 1. Purple Door #20 swing + hallway light
      const targetDoor = state.doorOpen ? -1.15 : 0;
      state.doorAngle = THREE.MathUtils.lerp(state.doorAngle, targetDoor, dt * 7);
      frontDoorPivot.rotation.y = state.doorAngle;
      hallwayLight.intensity = THREE.MathUtils.lerp(hallwayLight.intensity, state.doorOpen ? 2.2 : 0.1, dt * 6);

      // 2. Gold Peephole Frame knock & eye-blink animation
      const blinkAge = elapsed - state.peepBlinkTime;
      if (blinkAge >= 0 && blinkAge < 0.75) {
        const bWave = Math.sin((blinkAge / 0.75) * Math.PI * 2);
        peepEyelid.scale.y = Math.max(0.01, Math.abs(bWave));
        peepEyelid.position.y = 0.08 * (1 - peepEyelid.scale.y);
        peepholeGroup.scale.setScalar(1 + 0.08 * Math.sin(blinkAge * 24));
      } else {
        peepEyelid.scale.y = 0.01;
        peepholeGroup.scale.setScalar(1);
      }

      // 3. Kitchen Table Monica Tidy animation
      const targetTidy = state.tableTidy ? 1 : 0;
      if (Math.abs(state.tableTidyMix - targetTidy) > 0.001) {
        state.tableTidyMix = THREE.MathUtils.lerp(state.tableTidyMix, targetTidy, dt * 7.5);
        applyTableMix(state.tableTidyMix);
      }

      // 4. JOUETS Poster swing + hidden camera tally blink
      const targetPoster = state.posterOpen ? 1.18 : 0;
      state.posterAngle = THREE.MathUtils.lerp(state.posterAngle, targetPoster, dt * 7);
      posterPivot.rotation.y = state.posterAngle;
      tallyLight.material.color.setHex(Math.sin(elapsed * 6) > 0 ? 0xff2a2a : 0x550000);

      // 5. Fridge door swing + interior light
      const targetFridge = state.fridgeOpen ? 1.25 : 0;
      state.fridgeAngle = THREE.MathUtils.lerp(state.fridgeAngle, targetFridge, dt * 7);
      fridgeDoorPivot.rotation.y = state.fridgeAngle;
      fridgeLight.intensity = THREE.MathUtils.lerp(fridgeLight.intensity, state.fridgeOpen ? 1.8 : 0.0, dt * 8);

      // 6. Bay Window Day/Night transition
      const targetNight = state.isNight ? 1 : 0;
      state.nightMix = THREE.MathUtils.lerp(state.nightMix, targetNight, dt * 4.5);
      skyBackdropMat.color.lerpColors(daySkyColor, nightSkyColor, state.nightMix);
      mats.windowGlowDay.color.lerpColors(dayWinGlow, nightWinGlow, state.nightMix);
      sunLight.intensity = THREE.MathUtils.lerp(1.65, 0.32, state.nightMix);
      ambientLight.intensity = THREE.MathUtils.lerp(0.95, 0.52, state.nightMix);
      livingLampLight.intensity = THREE.MathUtils.lerp(1.35, 2.25, state.nightMix) + Math.sin(elapsed * 3.1) * 0.05;

      // 7. Subtle idle life: floating dust motes, gentle fern sway, TV screen flicker, face cup bob
      const posAttr = dustMotes.geometry.attributes.position;
      for (let i = 0; i < moteCount; i++) {
        const phase = motePhases[i];
        posAttr.array[i * 3 + 1] += Math.sin(elapsed * 0.7 + phase) * 0.0015;
        posAttr.array[i * 3] += Math.cos(elapsed * 0.5 + phase) * 0.001;
      }
      posAttr.needsUpdate = true;

      fern1.rotation.z = Math.sin(elapsed * 1.4) * 0.022;
      fern2.rotation.x = Math.cos(elapsed * 1.2) * 0.022;
      const tvFlicker = 0.88 + 0.12 * Math.sin(elapsed * 7.3) * Math.cos(elapsed * 3.7);
      tvScreenMat.color.setRGB(0.42 * tvFlicker, 0.65 * tvFlicker, 0.85 * tvFlicker);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
