<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A garage universe — inspired by Young Sheldon</title>
  <style>
    :root {
      --bg-top: #18131d;
      --bg-mid: #271d28;
      --bg-bot: #120e14;
      --gold: #ffcf87;
      --amber: #ff9c45;
      --cream: #f8efe2;
      --muted: rgba(248, 239, 226, 0.72);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, var(--bg-mid) 0%, var(--bg-top) 58%, var(--bg-bot) 100%);
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", serif;
      color: var(--cream);
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(10px, 2.2vh, 20px) 14px clamp(10px, 2vh, 18px);
      z-index: 10;
    }
    .header-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 0 24px rgba(18, 12, 16, 0.9);
      max-width: 94vw;
    }
    .title {
      font-size: clamp(1.18rem, 3.2vw, 1.68rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--cream);
      line-height: 1.12;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.68rem, 1.8vw, 0.82rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.92;
      margin-top: 1px;
    }
    .hint-pill {
      margin-top: 5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.66rem, 1.75vw, 0.78rem);
      letter-spacing: 0.05em;
      color: var(--cream);
      background: rgba(24, 18, 24, 0.68);
      border: 1px solid rgba(255, 207, 135, 0.34);
      padding: 4px 12px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: border-color 0.25s ease, transform 0.25s ease;
    }
    .hint-pill.active-pulse {
      border-color: rgba(120, 240, 255, 0.85);
      transform: scale(1.03);
    }
    .footer {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(0.66rem, 1.6vw, 0.76rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      padding: 3px 10px;
      background: rgba(16, 12, 18, 0.45);
      border-radius: 999px;
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a141d;
      color: var(--cream);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #fallback-inner {
      max-width: 380px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 207, 135, 0.3);
      border-radius: 12px;
      padding: 20px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="hud">
    <div class="header-box">
      <h1 class="title">A garage universe</h1>
      <div class="subtitle">inspired by Young Sheldon</div>
      <div class="hint-pill" id="hint-pill">tap the train · tap the potato clock</div>
    </div>
    <div class="footer">A tiny world</div>
  </div>

  <div id="fallback">
    <div id="fallback-inner">
      <h2 style="margin-bottom:8px;color:#ffcf87;">WebGL Required</h2>
      <p style="font-size:0.9rem;line-height:1.45;opacity:0.88;">
        Could not initialize the 3D miniature renderer. Please ensure hardware acceleration and WebGL are enabled in your browser.
      </p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Deterministic PRNG: mulberry32(20261102)
    function mulberry32(a) {
      return function() {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20261102);
    const randRange = (min, max) => min + rand() * (max - min);

    const container = document.getElementById('canvas-wrap');
    const fallbackEl = document.getElementById('fallback');
    const hintPill = document.getElementById('hint-pill');

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (err) {
      fallbackEl.style.display = 'flex';
      throw err;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minAzimuthAngle = -0.38;
    controls.maxAzimuthAngle = 0.52;
    controls.minPolarAngle = 0.92;
    controls.maxPolarAngle = 1.32;

    // Master diorama root
    const world = new THREE.Group();
    scene.add(world);

    // Shared Geometry Cache
    const geoBox = new THREE.BoxGeometry(1, 1, 1);
    const geoCyl = new THREE.CylinderGeometry(1, 1, 1, 18);
    const geoCylLow = new THREE.CylinderGeometry(1, 1, 1, 10);
    const geoSphere = new THREE.SphereGeometry(1, 16, 14);
    const geoCone = new THREE.ConeGeometry(1, 1, 12);
    const geoTorus = new THREE.TorusGeometry(1, 0.16, 10, 24);

    // Helper for quick meshes
    function makeMesh(geo, mat, sx = 1, sy = 1, sz = 1, px = 0, py = 0, pz = 0, rx = 0, ry = 0, rz = 0, cast = true, receive = true) {
      const m = new THREE.Mesh(geo, mat);
      m.scale.set(sx, sy, sz);
      m.position.set(px, py, pz);
      if (rx || ry || rz) m.rotation.set(rx, ry, rz);
      m.castShadow = cast;
      m.receiveShadow = receive;
      return m;
    }

    // Procedural Canvas Textures (100% deterministic, zero external assets)
    function createWoodPlankTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8b5a36';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 180; i++) {
        const y = Math.floor(rand() * 256);
        const h = 1 + Math.floor(rand() * 3);
        const shade = Math.floor(randRange(-18, 18));
        ctx.fillStyle = `rgb(${139 + shade}, ${90 + Math.floor(shade * 0.7)}, ${54 + Math.floor(shade * 0.5)})`;
        ctx.fillRect(0, y, 256, h);
      }
      ctx.fillStyle = 'rgba(45, 24, 10, 0.32)';
      for (let p = 0; p < 256; p += 32) {
        ctx.fillRect(0, p, 256, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createConcreteFloorTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#534f54';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 900; i++) {
        const x = Math.floor(rand() * 256);
        const y = Math.floor(rand() * 256);
        const r = 1 + Math.floor(rand() * 3);
        const v = Math.floor(randRange(68, 98));
        ctx.fillStyle = `rgba(${v},${v - 2},${v + 2},0.35)`;
        ctx.fillRect(x, y, r, r);
      }
      // Subtle garage expansion joints
      ctx.strokeStyle = 'rgba(35,32,36,0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(128, 0); ctx.lineTo(128, 256);
      ctx.moveTo(0, 128); ctx.lineTo(256, 128);
      ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPegboardTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#6e4c32';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#26180e';
      for (let y = 8; y < 128; y += 16) {
        for (let x = 8; x < 128; x += 16) {
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Dynamic Canvas for Digital Potato Clock ("12:00")
    const clockCanvas = document.createElement('canvas');
    clockCanvas.width = 256;
    clockCanvas.height = 128;
    const clockCtx = clockCanvas.getContext('2d');
    const clockTex = new THREE.CanvasTexture(clockCanvas);
    clockTex.colorSpace = THREE.SRGBColorSpace;

    function updateClockCanvas(intensity, timeSec) {
      clockCtx.fillStyle = '#091410';
      clockCtx.fillRect(0, 0, 256, 128);
      clockCtx.strokeStyle = '#1f3b30';
      clockCtx.lineWidth = 6;
      clockCtx.strokeRect(6, 6, 244, 116);

      const blinkColon = Math.sin(timeSec * 6.0) > -0.25 || intensity > 0.2;
      const textAlpha = 0.35 + 0.65 * intensity;
      if (intensity > 0.08) {
        clockCtx.shadowColor = '#3cffb5';
        clockCtx.shadowBlur = 18 * intensity;
      } else {
        clockCtx.shadowBlur = 0;
      }
      clockCtx.font = 'bold 78px "Courier New", monospace';
      clockCtx.textAlign = 'center';
      clockCtx.textBaseline = 'middle';
      clockCtx.fillStyle = intensity > 0.1
        ? `rgba(110, 255, 195, ${textAlpha})`
        : `rgba(52, 145, 102, 0.55)`;
      clockCtx.fillText(blinkColon ? '12:00' : '12 00', 128, 66);
      clockTex.needsUpdate = true;
    }
    updateClockCanvas(0, 0);

    // Dynamic Canvas for Old-Style TV playing a blue/white 'science show' visual
    const tvCanvas = document.createElement('canvas');
    tvCanvas.width = 128;
    tvCanvas.height = 96;
    const tvCtx = tvCanvas.getContext('2d');
    const tvTex = new THREE.CanvasTexture(tvCanvas);
    tvTex.colorSpace = THREE.SRGBColorSpace;

    function updateTVCanvas(timeSec, boost) {
      const g = tvCtx.createRadialGradient(64, 48, 6, 64, 48, 70);
      if (boost > 0.05) {
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.45, '#59e8ff');
        g.addColorStop(1, '#0c2b5e');
      } else {
        g.addColorStop(0, '#c8f0ff');
        g.addColorStop(0.55, '#2b6cb0');
        g.addColorStop(1, '#0a192f');
      }
      tvCtx.fillStyle = g;
      tvCtx.fillRect(0, 0, 128, 96);

      // Orbiting atom rings / sine wave science show graphics
      tvCtx.save();
      tvCtx.translate(64, 48);
      const ringCount = 3;
      const speed = 1.4 + boost * 3.5;
      for (let i = 0; i < ringCount; i++) {
        tvCtx.save();
        tvCtx.rotate((i * Math.PI) / 3 + timeSec * speed * (i % 2 === 0 ? 1 : -1));
        tvCtx.strokeStyle = boost > 0.1 ? 'rgba(255,255,255,0.92)' : 'rgba(195,238,255,0.75)';
        tvCtx.lineWidth = 2 + boost * 1.4;
        tvCtx.beginPath();
        tvCtx.ellipse(0, 0, 34, 11, 0, 0, Math.PI * 2);
        tvCtx.stroke();

        const ex = Math.cos(timeSec * 3.2 + i * 2) * 34;
        const ey = Math.sin(timeSec * 3.2 + i * 2) * 11;
        tvCtx.fillStyle = '#ffffff';
        tvCtx.beginPath();
        tvCtx.arc(ex, ey, 3.2 + boost * 1.5, 0, Math.PI * 2);
        tvCtx.fill();
        tvCtx.restore();
      }
      tvCtx.restore();

      // CRT scanlines
      tvCtx.fillStyle = 'rgba(4, 12, 24, 0.24)';
      for (let y = 0; y < 96; y += 4) {
        tvCtx.fillRect(0, y, 128, 1.5);
      }
      tvTex.needsUpdate = true;
    }
    updateTVCanvas(0, 0);

    // Materials Palette
    const woodTex = createWoodPlankTexture();
    const floorTex = createConcreteFloorTexture();
    const pegTex = createPegboardTexture();

    const mats = {
      plinthDark: new THREE.MeshStandardMaterial({ color: 0x261d24, roughness: 0.85, metalness: 0.08 }),
      plinthTrim: new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.65, metalness: 0.1 }),
      concrete: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.88, metalness: 0.05 }),
      wallIn: new THREE.MeshStandardMaterial({ color: 0xd8c3a5, roughness: 0.85 }),
      wallSiding: new THREE.MeshStandardMaterial({ color: 0xc9b497, roughness: 0.82 }),
      studWood: new THREE.MeshStandardMaterial({ map: woodTex, color: 0xb57c4a, roughness: 0.78 }),
      darkWood: new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6e4226, roughness: 0.72 }),
      tableTrim: new THREE.MeshStandardMaterial({ map: woodTex, color: 0x8c522b, roughness: 0.65 }),
      pegboard: new THREE.MeshStandardMaterial({ map: pegTex, roughness: 0.82 }),
      roofShingle: new THREE.MeshStandardMaterial({ color: 0x483c42, roughness: 0.9 }),
      rollerDoor: new THREE.MeshStandardMaterial({ color: 0xe6dccf, roughness: 0.6, metalness: 0.15 }),
      steel: new THREE.MeshStandardMaterial({ color: 0xaab4be, roughness: 0.32, metalness: 0.78 }),
      darkIron: new THREE.MeshStandardMaterial({ color: 0x282b30, roughness: 0.45, metalness: 0.65 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xe5b54f, roughness: 0.3, metalness: 0.8 }),
      copper: new THREE.MeshStandardMaterial({ color: 0xd97538, roughness: 0.35, metalness: 0.72 }),
      grassMain: new THREE.MeshStandardMaterial({ color: 0x639a46, roughness: 0.88 }),
      grassRich: new THREE.MeshStandardMaterial({ color: 0x4c7e36, roughness: 0.86 }),
      earthDirt: new THREE.MeshStandardMaterial({ color: 0x8d6946, roughness: 0.92 }),
      ballast: new THREE.MeshStandardMaterial({ color: 0x69656c, roughness: 0.92 }),
      rock: new THREE.MeshStandardMaterial({ color: 0x7b757d, roughness: 0.88 }),
      brickPorch: new THREE.MeshStandardMaterial({ color: 0x9e4736, roughness: 0.82 }),
      locoRed: new THREE.MeshStandardMaterial({ color: 0xc83228, roughness: 0.38, metalness: 0.25 }),
      locoBlack: new THREE.MeshStandardMaterial({ color: 0x202226, roughness: 0.42, metalness: 0.55 }),
      carBlue: new THREE.MeshStandardMaterial({ color: 0x2a669f, roughness: 0.42, metalness: 0.2 }),
      carYellow: new THREE.MeshStandardMaterial({ color: 0xe09f32, roughness: 0.45, metalness: 0.15 }),
      creamTrim: new THREE.MeshStandardMaterial({ color: 0xf4ead5, roughness: 0.55 }),
      potatoSkin: new THREE.MeshStandardMaterial({ color: 0xb68652, roughness: 0.88, metalness: 0.02 }),
      cardboard: new THREE.MeshStandardMaterial({ color: 0xc2925e, roughness: 0.86 }),
      cardboardTape: new THREE.MeshStandardMaterial({ color: 0xd8b584, roughness: 0.65 }),
      laundryBlue: new THREE.MeshStandardMaterial({ color: 0x4889b5, roughness: 0.55 }),
      bikeRed: new THREE.MeshStandardMaterial({ color: 0xd12929, roughness: 0.3, metalness: 0.45 }),
      tireRubber: new THREE.MeshStandardMaterial({ color: 0x1e1e22, roughness: 0.85 }),
      tieNavy: new THREE.MeshStandardMaterial({ color: 0x1f325c, roughness: 0.6 }),
      tieRedStripe: new THREE.MeshStandardMaterial({ color: 0xb8292f, roughness: 0.55 }),
      footballLeather: new THREE.MeshStandardMaterial({ color: 0x7d3c1d, roughness: 0.65 }),
      glassJar: new THREE.MeshStandardMaterial({ color: 0xcceeff, transparent: true, opacity: 0.5, roughness: 0.15 }),
      lampBulb: new THREE.MeshStandardMaterial({ color: 0xfff3d1, emissive: 0xffaa33, emissiveIntensity: 2.2 }),
      experimentBulb: new THREE.MeshStandardMaterial({ color: 0xe0ffff, emissive: 0x3cffd0, emissiveIntensity: 0.25, roughness: 0.2 }),
      wireBlue: new THREE.MeshStandardMaterial({ color: 0x2986cc, emissive: 0x00d8ff, emissiveIntensity: 0.08, roughness: 0.4 }),
      wireGreen: new THREE.MeshStandardMaterial({ color: 0x2ca85a, emissive: 0x3cff96, emissiveIntensity: 0.08, roughness: 0.4 }),
      clockScreen: new THREE.MeshBasicMaterial({ map: clockTex }),
      tvScreen: new THREE.MeshBasicMaterial({ map: tvTex }),
      crossingLightRed: new THREE.MeshStandardMaterial({ color: 0x551111, emissive: 0xff1e1e, emissiveIntensity: 0.15 }),
      crossingLightRedB: new THREE.MeshStandardMaterial({ color: 0x551111, emissive: 0xff1e1e, emissiveIntensity: 0.15 }),
      stationWindow: new THREE.MeshStandardMaterial({ color: 0xffeba8, emissive: 0xffae38, emissiveIntensity: 0.85 })
    };

    // ==========================================
    // 1. DIORAMA PLINTH, FLOOR & TEXAS PORCH WING
    // ==========================================
    const baseGroup = new THREE.Group();
    world.add(baseGroup);

    // Sculptural dark tiered plinth
    baseGroup.add(makeMesh(geoBox, mats.plinthDark, 15.2, 0.9, 11.4, 0.3, -0.55, 0.2, 0, 0, 0, false, true));
    baseGroup.add(makeMesh(geoBox, mats.plinthTrim, 15.5, 0.22, 11.7, 0.3, -0.95, 0.2, 0, 0, 0, false, true));

    // Main garage concrete slab
    baseGroup.add(makeMesh(geoBox, mats.concrete, 11.6, 0.32, 10.6, -1.3, 0.0, 0.1, 0, 0, 0, false, true));
    // Driveway concrete apron at front-right
    baseGroup.add(makeMesh(geoBox, mats.concrete, 3.4, 0.28, 5.2, 5.2, -0.02, 2.7, 0, 0, 0, false, true));

    // East Texas grassy yard strip & warm family porch wing on right (+X)
    const yardGroup = new THREE.Group();
    yardGroup.position.set(5.45, 0.02, -2.1);
    baseGroup.add(yardGroup);

    yardGroup.add(makeMesh(geoBox, mats.grassMain, 3.7, 0.32, 6.2, 0, 0, 0, 0, 0, 0, false, true));
    // Stepping stones
    for (let i = 0; i < 3; i++) {
      yardGroup.add(makeMesh(geoCylLow, mats.rock, 0.42, 0.08, 0.36, -0.2 + i * 0.35, 0.18, 1.3 + i * 0.65, 0, i * 0.5, 0, false, true));
    }

    // Porch brick steps, wood deck, white column, warm porch lantern & house window
    yardGroup.add(makeMesh(geoBox, mats.brickPorch, 2.5, 0.45, 2.8, -0.45, 0.36, -1.45));
    yardGroup.add(makeMesh(geoBox, mats.brickPorch, 1.4, 0.24, 0.65, -0.35, 0.24, 0.25));
    yardGroup.add(makeMesh(geoBox, mats.studWood, 2.6, 0.12, 2.9, -0.45, 0.62, -1.45));
    // White porch column & railing
    yardGroup.add(makeMesh(geoBox, mats.creamTrim, 0.22, 3.5, 0.22, 0.62, 2.4, -0.18));
    yardGroup.add(makeMesh(geoBox, mats.creamTrim, 0.14, 0.9, 2.5, 0.62, 1.1, -1.45));
    for (let b = 0; b < 5; b++) {
      yardGroup.add(makeMesh(geoBox, mats.creamTrim, 0.08, 0.8, 0.08, 0.62, 1.05, -0.55 - b * 0.42));
    }
    // Slanted porch roof overhang
    yardGroup.add(makeMesh(geoBox, mats.roofShingle, 2.9, 0.18, 3.2, -0.35, 4.25, -1.45, 0.12, 0, -0.18));
    // Warm porch wall & glowing house window
    yardGroup.add(makeMesh(geoBox, mats.wallSiding, 2.3, 3.6, 0.25, -0.5, 2.4, -2.75));
    yardGroup.add(makeMesh(geoBox, mats.creamTrim, 1.1, 1.3, 0.3, -0.35, 2.55, -2.72));
    yardGroup.add(makeMesh(geoBox, mats.stationWindow, 0.9, 1.1, 0.32, -0.35, 2.55, -2.71, 0, 0, 0, false, false));
    // Window muntins
    yardGroup.add(makeMesh(geoBox, mats.creamTrim, 0.94, 0.06, 0.35, -0.35, 2.55, -2.7));
    yardGroup.add(makeMesh(geoBox, mats.creamTrim, 0.06, 1.14, 0.35, -0.35, 2.55, -2.7));

    // Small shrub bushes along porch
    for (let s = 0; s < 4; s++) {
      const bx = 0.95 + (s % 2) * 0.35;
      const bz = -2.1 + s * 0.85;
      yardGroup.add(makeMesh(geoSphere, mats.grassRich, 0.42, 0.36, 0.42, bx, 0.38, bz));
    }

    // ==========================================
    // 2. LAYERED CUTAWAY GARAGE ARCHITECTURE
    // ==========================================
    const garageGroup = new THREE.Group();
    world.add(garageGroup);

    // Back Wall (-Z = -4.9)
    garageGroup.add(makeMesh(geoBox, mats.wallIn, 11.4, 5.8, 0.28, -1.3, 3.05, -4.95));

    const targetCenter = new THREE.Vector3(-0.45, 2.75, -0.15);

    function updateCameraFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(h, 1);

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.setSize(w, h);
      camera.aspect = aspect;
      camera.fov = aspect < 0.75 ? 41 : 34;
      camera.updateProjectionMatrix();

      // Reserve HUD safe areas: scene fits strictly between header box and footer
      const headerRect = document.querySelector('.header-box').getBoundingClientRect();
      const footerRect = document.querySelector('.footer').getBoundingClientRect();
      const topSafePx = Math.max(headerRect.bottom + Math.max(14, h * 0.022), h * 0.13);
      const bottomSafePx = Math.min(footerRect.top - Math.max(10, h * 0.018), h * 0.94);
      const topMaxNDC = 1 - (topSafePx / h) * 2;
      const bottomMinNDC = 1 - (bottomSafePx / h) * 2;
      const targetCenterNDCY = (topMaxNDC + bottomMinNDC) * 0.5;
      const usableHalfHeightNDC = Math.max(0.25, (topMaxNDC - bottomMinNDC) * 0.5);

      // Projected-bounding-box fit over full diorama extents (plinth, roof, porch, workbench)
      const ENVELOPE = [];
      for (const sx of [-7.45, 8.05]) for (const sy of [-1.06, 7.42]) for (const sz of [-5.65, 6.05]) {
        ENVELOPE.push(new THREE.Vector3(sx, sy, sz));
      }

      const viewDir = new THREE.Vector3(0.22, 0.44, 0.87).normalize();
