<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MDR Corridor - a tiny scene inspired by Severance</title>
<meta name="theme-color" content="#10141a">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#10141a}
  body{font-family:Georgia,'Times New Roman',serif;color:#eef0f2}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(8,10,14,.46) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#10141a;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#9fb4c8;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#2a2e36;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#9fb4c8;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(8,10,14,.95),0 2px 8px rgba(8,10,14,.8),0 4px 22px rgba(8,10,14,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#c8cfd8;margin-top:3px;text-shadow:0 1px 2px rgba(8,10,14,.95),0 2px 6px rgba(8,10,14,.75),0 3px 14px rgba(8,10,14,.5)}
  #era{position:fixed;top:max(18px,env(safe-area-inset-top));right:20px;z-index:4;pointer-events:none;
    font-size:11px;letter-spacing:.24em;color:#bfe8d2;border:1px solid rgba(191,232,210,.35);
    padding:5px 12px;border-radius:99px;background:rgba(16,20,26,.5);backdrop-filter:blur(6px);
    opacity:0;transition:opacity 1.4s ease .8s}
  body.ready #era{opacity:1}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#e8ecf2;background:rgba(16,18,24,.55);border:1px solid rgba(228,236,248,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
    #era{right:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>MDR Corridor</h1><p>a tiny scene inspired by Severance</p></div>
<div id="era">MDR</div>
<div id="hint">tap the lights &nbsp;&middot;&nbsp; tap the door &nbsp;&middot;&nbsp; tap the chair</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   MDR CORRIDOR - a severed slice of basement office: mint
   carpet, white walls, humming light panels, dark doors,
   one rolling chair. All procedural, no show assets.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);
scene.fog = new THREE.FogExp2(0x10141a, 0.008);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.1, -0.2);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 70;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-5.4, -2.1, -2.5), new THREE.Vector3(5.4, 0.2, 2.3)),
  new THREE.Box3(new THREE.Vector3(-4.82, 0, -1.9), new THREE.Vector3(4.82, 3.0, 1.4)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.94, yTop: 0.9, yBottom: 0.86 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}

/* shift camera+orbit-target in the screen plane so the projected model
   bounding box lands at viewport centre (small lift for the hint pill) */
function centerProjectedModel(){
  camera.updateMatrixWorld();
  const p = new THREE.Vector3();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const dist = camera.position.distanceTo(controls.target);
  const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
  const halfW = halfH * camera.aspect;
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const shift = new THREE.Vector3()
    .addScaledVector(right, -cx * halfW)
    .addScaledVector(up, -(cy - 0.05) * halfH);
  camera.position.add(shift);
  controls.target.add(shift);
  camera.lookAt(controls.target);
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8) dir.set(0.68, 0.32, 0.66);
  else dir.set(0.45, 0.4, 0.8);
  dir.normalize();
  let lo = 4, hi = 70;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi*1.03);
  camera.lookAt(controls.target);
  centerProjectedModel();
}
camera.position.set(4.5, 4, 7.5);
frameForViewport();

/* ---------- helpers ---------- */
function box(w,h,d,mat,x,y,z,ry,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); if (ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg,parent){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||14), mat);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}

/* ---------- materials ---------- */
const MAT = {
  soil:      new THREE.MeshStandardMaterial({ color:0x26211b, roughness:0.95 }),
  slabEdge:  new THREE.MeshStandardMaterial({ color:0x413d38, roughness:0.9 }),
  slabTop:   new THREE.MeshStandardMaterial({ color:0x3a3835, roughness:0.9 }),
  shell:     new THREE.MeshStandardMaterial({ color:0x2e3239, roughness:0.9 }),
  carpet:    new THREE.MeshStandardMaterial({ color:0x7fa88c, roughness:0.98 }),
  carpetDk:  new THREE.MeshStandardMaterial({ color:0x6e967c, roughness:0.98 }),
  wall:      new THREE.MeshStandardMaterial({ color:0xdfe4da, roughness:0.85 }),
  wallLow:   new THREE.MeshStandardMaterial({ color:0xb9c4b2, roughness:0.85 }),
  baseboard: new THREE.MeshStandardMaterial({ color:0x8fa08c, roughness:0.8 }),
  ceiling:   new THREE.MeshStandardMaterial({ color:0xcfd6cc, roughness:0.9 }),
  doorWood:  new THREE.MeshStandardMaterial({ color:0x4a3524, roughness:0.65 }),
  doorFrame: new THREE.MeshStandardMaterial({ color:0x3a2c1e, roughness:0.7 }),
  brass:     new THREE.MeshStandardMaterial({ color:0xb08a3e, roughness:0.35, metalness:0.8 }),
  chairSeat: new THREE.MeshStandardMaterial({ color:0x2c3a34, roughness:0.7 }),
  chairBase: new THREE.MeshStandardMaterial({ color:0x1c2226, roughness:0.4, metalness:0.6 }),
  extRed:    new THREE.MeshStandardMaterial({ color:0xb8281e, roughness:0.45 }),
  voidDark:  new THREE.MeshBasicMaterial({ color:0x04050a }),
  frame:     new THREE.MeshStandardMaterial({ color:0x6a5228, roughness:0.5, metalness:0.4 }),
};

/* ---------- layered base ---------- */
const base = new THREE.Group(); scene.add(base);
box(10.2, 0.55, 4.4, MAT.soil, 0, -0.85, -0.1, 0, base);
box(10.5, 0.42, 4.6, MAT.slabEdge, 0, -1.32, -0.1, 0, base);
box(10.8, 0.34, 4.85, MAT.soil, 0, -1.68, -0.1, 0, base);
box(11.0, 0.22, 5.0, MAT.slabTop, 0, -1.93, -0.1, 0, base);
box(10.6, 0.07, 4.7, new THREE.MeshStandardMaterial({ color:0x59544c, roughness:0.85 }), 0, -1.53, -0.1, 0, base);
box(10.35, 0.06, 4.55, new THREE.MeshStandardMaterial({ color:0x4a4640, roughness:0.85 }), 0, -1.13, -0.1, 0, base);
box(9.8, 0.42, 4.1, MAT.slabEdge, 0, -0.42, -0.1, 0, base);
box(9.4, 0.24, 3.9, MAT.slabTop, 0, -0.12, -0.1, 0, base);
/* carpet with subtle tiles */
box(9.0, 0.06, 2.9, MAT.carpet, 0, 0.03, -0.15, 0, base);
for (let i=0;i<9;i++) box(0.02, 0.065, 2.9, MAT.carpetDk, -4.5+i+0.5, 0.032, -0.15, 0, base);
box(9.0, 0.02, 0.5, MAT.carpetDk, 0, 0.045, -1.35, 0, base);   // walkway band near wall

/* ---------- corridor shell ---------- */
const room = new THREE.Group(); scene.add(room);
/* back wall with wainscot */
box(9.0, 2.6, 0.16, MAT.wall, 0, 1.3, -1.68, 0, room);
box(9.0, 0.85, 0.2, MAT.wallLow, 0, 0.425, -1.66, 0, room);
box(9.0, 0.06, 0.24, MAT.baseboard, 0, 0.9, -1.66, 0, room);   // chair rail
box(9.0, 0.1, 0.22, MAT.baseboard, 0, 0.05, -1.65, 0, room);   // baseboard
/* right end wall (closed) */
box(0.16, 2.6, 2.9, MAT.wall, 4.55, 1.3, -0.2, 0, room);
box(0.2, 0.85, 2.9, MAT.wallLow, 4.53, 0.425, -0.2, 0, room);
/* dark shell caps on the outer faces of the end walls (diorama exterior) */
box(0.04, 2.72, 3.02, MAT.shell, 4.66, 1.32, -0.2, 0, room);
box(0.04, 2.72, 3.02, MAT.shell, -4.66, 1.32, -0.2, 0, room);
/* shell panel seams + top trim so the ends read as model shell, not void */
for (const sx of [4.69, -4.69]){
  box(0.015, 0.05, 3.02, MAT.slabEdge, sx, 1.32, -0.2, 0, room);
  box(0.015, 0.05, 3.02, MAT.slabEdge, sx, 2.1, -0.2, 0, room);
  box(0.015, 2.72, 0.05, MAT.slabEdge, sx, 1.32, 0.4, 0, room);
  box(0.05, 0.08, 3.06, MAT.baseboard, sx, 2.72, -0.2, 0, room);
}
/* closed dark door at the right end of the corridor (interior face) */
const endDoor = new THREE.Group(); endDoor.position.set(4.42, 0, -0.55); endDoor.rotation.y = -Math.PI/2; scene.add(endDoor);
box(0.86, 1.95, 0.1, MAT.doorFrame, 0, 0.98, 0, 0, endDoor);
const endLeaf = box(0.72, 1.82, 0.07, MAT.doorWood, 0, 0.95, 0.05, 0, endDoor);
box(0.5, 0.68, 0.02, MAT.doorFrame, 0, 0.4, 0.04, 0, endLeaf);
box(0.5, 0.6, 0.02, MAT.doorFrame, 0, -0.4, 0.04, 0, endLeaf);
const endKnob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), MAT.brass);
endKnob.position.set(0.27, 0, 0.05); endLeaf.add(endKnob);
/* left end: dark opening where the corridor continues */
box(0.16, 2.6, 2.9, MAT.wall, -4.55, 1.3, -0.2, 0, room);
const leftVoid = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 2.1), MAT.voidDark);
leftVoid.position.set(-4.46, 1.05, -0.2); leftVoid.rotation.y = Math.PI/2; scene.add(leftVoid);
box(0.1, 2.2, 0.12, MAT.doorFrame, -4.5, 1.1, 0.42, 0, room);
box(0.1, 2.2, 0.12, MAT.doorFrame, -4.5, 1.1, -0.82, 0, room);
box(0.1, 0.12, 1.36, MAT.doorFrame, -4.5, 2.24, -0.2, 0, room);
/* distant lit doorway deep in the void (appears on tap) */
const farGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 1.1), new THREE.MeshBasicMaterial({ color:0xf4f8ee, transparent:true, opacity:0 }));
farGlow.position.set(-4.44, 1.0, -0.2); farGlow.rotation.y = Math.PI/2; farGlow.material.opacity = 0.4; scene.add(farGlow);
/* ceiling (partial: leaves the front edge open to the camera) */
box(9.2, 0.14, 2.5, MAT.ceiling, 0, 2.67, -0.55, 0, room);
box(9.2, 0.2, 0.16, MAT.wall, 0, 2.6, 0.72, 0, room);           // fascia lip
/* light panels under the ceiling */
const panelMats = [];
const panelLights = [];
for (const px of [-3.0, 0, 3.0]){
  const pm = new THREE.MeshBasicMaterial({ color:0xf6fbf2 });
  panelMats.push(pm);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.8), pm);
  p.rotation.x = Math.PI/2; p.position.set(px, 2.595, -0.55); scene.add(p);
  box(1.8, 0.04, 0.9, MAT.baseboard, px, 2.6, -0.55, 0, room);
  const pl = new THREE.PointLight(0xf2f8ec, 0.85, 6.5, 1.6);
  pl.position.set(px, 2.3, -0.35); scene.add(pl); panelLights.push(pl);
}

/* ---------- back wall doors ---------- */
function wallDoor(x){
  const g = new THREE.Group(); g.position.set(x, 0, -1.6); scene.add(g);
  box(0.86, 1.95, 0.1, MAT.doorFrame, 0, 0.98, 0.02, 0, g);
  const leaf = box(0.72, 1.82, 0.07, MAT.doorWood, 0, 0.95, 0.07, 0, g);
  box(0.5, 0.68, 0.02, MAT.doorFrame, 0, 0.4, 0.04, 0, leaf);
  box(0.5, 0.6, 0.02, MAT.doorFrame, 0, -0.4, 0.04, 0, leaf);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), MAT.brass);
  knob.position.set(0.27, 0, 0.05); leaf.add(knob);
  return { g, leaf };
}
const doorA = wallDoor(-2.7);
const doorB = wallDoor(0.3);
/* black void + tiny far corridor behind door A */
const voidAMat = new THREE.MeshBasicMaterial({ color:0x04050a });
const voidA = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 1.76), voidAMat);
voidA.position.set(-2.7, 0.95, -1.525); scene.add(voidA);
const cVoidK = new THREE.Color(0x04050a), cLitRoom = new THREE.Color(0xd8caa2);
const deepGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 1.0), new THREE.MeshBasicMaterial({ color:0xf4ecd2, transparent:true, opacity:0 }));
deepGlow.position.set(-2.7, 0.95, -1.52); scene.add(deepGlow);
/* warm room-glimpse detail: tiny far door + side table silhouettes inside the opening */
const roomGlimpse = new THREE.Group(); roomGlimpse.position.set(-2.7, 0.95, -1.51); scene.add(roomGlimpse);
const glimpseFar = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.3), new THREE.MeshBasicMaterial({ color:0x8a7a52, transparent:true, opacity:0 }));
glimpseFar.position.set(-0.12, -0.2, 0); roomGlimpse.add(glimpseFar);
const glimpseLamp = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.22), new THREE.MeshBasicMaterial({ color:0xfff2cc, transparent:true, opacity:0 }));
glimpseLamp.position.set(0.14, -0.35, 0); roomGlimpse.add(glimpseLamp);
/* warm spill on the carpet in front of door A + a soft light */
const spillMat = new THREE.MeshBasicMaterial({ color:0xffe8b8, transparent:true, opacity:0 });
const spill = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 1.4), spillMat);
spill.rotation.x = -Math.PI/2; spill.position.set(-2.7, 0.035, -0.72); scene.add(spill);
const doorLight = new THREE.PointLight(0xffe0b0, 0, 3.5, 1.6);
doorLight.position.set(-2.7, 1.3, -0.9); scene.add(doorLight);

/* ---------- painting (pastoral, procedural) ---------- */
const paintCan = document.createElement('canvas'); paintCan.width = 160; paintCan.height = 112;
{
  const g = paintCan.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,70);
  sky.addColorStop(0,'#bcd4e4'); sky.addColorStop(1,'#e4e8d8');
  g.fillStyle = sky; g.fillRect(0,0,160,70);
  g.fillStyle = '#7a9a5c'; g.beginPath(); g.moveTo(0,70);
  g.quadraticCurveTo(45,42,85,62); g.quadraticCurveTo(125,78,160,56);
  g.lineTo(160,112); g.lineTo(0,112); g.closePath(); g.fill();
  g.fillStyle = '#5c7e44'; g.beginPath(); g.moveTo(0,84);
  g.quadraticCurveTo(60,66,160,88); g.lineTo(160,112); g.lineTo(0,112); g.closePath(); g.fill();
  g.fillStyle = '#4a3c2a'; g.fillRect(116,52,4,18);
  g.fillStyle = '#3c5a34'; g.beginPath(); g.arc(118,48,11,0,7); g.fill();
  g.fillStyle = '#f0ecd8'; g.beginPath(); g.arc(40,30,7,0,7); g.fill();
}
const paintG = new THREE.Group(); paintG.position.set(2.4, 1.55, -1.57); scene.add(paintG);
box(0.94, 0.7, 0.05, MAT.frame, 0, 0, 0, 0, paintG);
const paintFace = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 0.58), new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(paintCan) }));
paintFace.position.z = 0.03; paintG.add(paintFace);

/* ---------- fire extinguisher + plaque ---------- */
cyl(0.07, 0.07, 0.34, MAT.extRed, 3.75, 1.15, -1.58, 12);
cyl(0.02, 0.02, 0.1, MAT.chairBase, 3.75, 1.36, -1.58, 8);
box(0.2, 0.3, 0.03, MAT.baseboard, 3.75, 1.15, -1.62, 0);
box(0.5, 0.18, 0.03, MAT.brass, 1.45, 1.7, -1.62, 0);            // department plaque

/* ---------- ceiling duct + vents + exit sign ---------- */
box(8.6, 0.2, 0.34, MAT.baseboard, 0, 2.44, -1.25, 0, room);
for (const vx of [-2.4, 0.6, 3.2]) box(0.7, 0.16, 0.3, MAT.wallLow, vx, 2.33, -1.25, 0, room);
box(0.44, 0.2, 0.06, MAT.chairBase, 0.3, 2.16, -1.55, 0, room);
{
  const eg = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.13),
    new THREE.MeshBasicMaterial({ color:0x3aff7a }));
  eg.position.set(0.3, 2.16, -1.51); scene.add(eg);
}
/* ---------- security dome ---------- */
const dome = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 8, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0x14161c, roughness:0.25, metalness:0.3 }));
dome.rotation.x = Math.PI; dome.position.set(4.35, 2.45, -1.5); scene.add(dome);
box(0.06, 0.12, 0.06, MAT.chairBase, 4.35, 2.52, -1.5, 0);

/* ---------- water cooler ---------- */
cyl(0.16, 0.14, 0.52, MAT.wallLow, 4.1, 0.26, 0.75, 12);
cyl(0.13, 0.13, 0.3, new THREE.MeshStandardMaterial({ color:0xbcd8e8, roughness:0.15, transparent:true, opacity:0.75 }), 4.1, 0.67, 0.75, 12);
box(0.06, 0.05, 0.06, MAT.extRed, 4.1, 0.42, 0.9, 0);
/* ---------- wastebasket ---------- */
cyl(0.14, 0.11, 0.3, MAT.slabTop, -2.0, 0.15, -1.25, 10);
/* ---------- wall clock ---------- */
cyl(0.16, 0.16, 0.03, MAT.frame, -1.2, 1.95, -1.585, 16).rotation.x = Math.PI/2;
const clockFace = new THREE.Mesh(new THREE.CircleGeometry(0.13, 16), new THREE.MeshBasicMaterial({ color:0xf2f4ea }));
clockFace.position.set(-1.2, 1.95, -1.565); scene.add(clockFace);
box(0.015, 0.09, 0.008, MAT.chairBase, -1.2, 1.98, -1.56, 0);
box(0.06, 0.015, 0.008, MAT.chairBase, -1.17, 1.95, -1.56, 0);
/* ---------- rolling chair ---------- */
const chairG = new THREE.Group(); chairG.position.set(1.6, 0, 0.45); chairG.rotation.y = -0.6; scene.add(chairG);
box(0.44, 0.07, 0.42, MAT.chairSeat, 0, 0.5, 0, 0, chairG);
box(0.42, 0.5, 0.07, MAT.chairSeat, 0, 0.82, -0.19, 0, chairG);
cyl(0.03, 0.03, 0.32, MAT.chairBase, 0, 0.3, 0, 8, chairG);
for (let k=0;k<5;k++){
  const a = k*Math.PI*2/5;
  const leg = box(0.3, 0.03, 0.05, MAT.chairBase, Math.cos(a)*0.16, 0.12, Math.sin(a)*0.16, 0, chairG);
  leg.rotation.y = -a;
  cyl(0.035, 0.035, 0.04, MAT.chairBase, Math.cos(a)*0.3, 0.05, Math.sin(a)*0.3, 8, chairG);
}

/* ---------- lighting ---------- */
const hemi = new THREE.HemisphereLight(0xe8f0e2, 0x2e3830, 0.85); scene.add(hemi);
const key = new THREE.DirectionalLight(0xf2f6ea, 1.1);
key.position.set(3, 6, 5); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-7; key.shadow.camera.right=7;
key.shadow.camera.top=7; key.shadow.camera.bottom=-7;
key.shadow.bias = -0.0004;
scene.add(key);
const redL = new THREE.PointLight(0xff2a1e, 0, 7, 1.6);
redL.position.set(-3.2, 1.9, -0.2); scene.add(redL);
const redR = new THREE.PointLight(0xff2a1e, 0, 7, 1.6);
redR.position.set(3.2, 1.9, -0.2); scene.add(redR);
const redLow = new THREE.PointLight(0xff4030, 0, 6, 1.4);
redLow.position.set(1.8, 0.7, 1.5); scene.add(redLow);
const redR2 = new THREE.PointLight(0xff3526, 0, 5.5, 1.3);
redR2.position.set(3.4, 1.6, 1.7); scene.add(redR2);
const redLow2 = new THREE.PointLight(0xff4030, 0, 6, 1.3);
redLow2.position.set(-2.4, 0.5, 2.4); scene.add(redLow2);
const beaconMat = new THREE.MeshStandardMaterial({ color:0x3a0a08, emissive:0xff2a1e, emissiveIntensity:0 });
const redWashMats = [];
for (const bx of [-3.2, 3.2]){
  const bc = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.1, 0.07), beaconMat);
  bc.position.set(bx, 2.34, -1.5); scene.add(bc);
  const wm = new THREE.MeshBasicMaterial({ color:0xff3a2a, transparent:true, opacity:0 });
  const wash = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.5), wm);
  wash.position.set(bx, 1.55, -1.53); scene.add(wash);
  redWashMats.push(wm);
}
/* hanging green guide signs under the ceiling (no text) */
const signMat = new THREE.MeshStandardMaterial({ color:0x0a3a1a, emissive:0x2aff6a, emissiveIntensity:0.5, roughness:0.5 });
for (const sx of [-1.4, 1.4]){
  box(0.02, 0.22, 0.02, MAT.baseboard, sx-0.2, 2.5, 0.3, 0, room);
  box(0.02, 0.22, 0.02, MAT.baseboard, sx+0.2, 2.5, 0.3, 0, room);
  box(0.55, 0.2, 0.07, signMat, sx, 2.32, 0.3, 0, room);
}

/* ---------- states ---------- */
let lightsOn = 1, lightsBlend = 1;
let doorOpen = 0, doorBlend = 0;
let chairT = 99;
const chairStart = new THREE.Vector3(1.6, 0, 0.45);

/* ---------- tap handling ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const lightsProxy = new THREE.Mesh(new THREE.BoxGeometry(9.0,0.7,0.9), new THREE.MeshBasicMaterial({visible:false}));
lightsProxy.position.set(0, 2.5, -0.55); scene.add(lightsProxy);
const doorProxy = new THREE.Mesh(new THREE.BoxGeometry(1.2,2.1,0.8), new THREE.MeshBasicMaterial({visible:false}));
doorProxy.position.set(-2.7, 1.0, -1.4); scene.add(doorProxy);
const chairProxy = new THREE.Mesh(new THREE.BoxGeometry(1.0,1.2,1.0), new THREE.MeshBasicMaterial({visible:false}));
chairProxy.position.set(1.6, 0.55, 0.45); scene.add(chairProxy);
const tapTargets = [lightsProxy, doorProxy, chairProxy];

let downX=0, downY=0, downT=0, lastUp=0;
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); });
renderer.domElement.addEventListener('pointerup', e=>{
  const now = performance.now();
  if (now - lastUp < 150) return;
  if (now - downT > 350) return;
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 8) return;
  lastUp = now;
  ptr.x = (e.clientX/innerWidth)*2-1;
  ptr.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(tapTargets, false);
  if (!hits.length) return;
  window.__tvSfx&&window.__tvSfx();
  const o = hits[0].object;
  if (o === lightsProxy){ lightsOn = lightsOn ? 0 : 1; return; }
  if (o === doorProxy){ doorOpen = doorOpen ? 0 : 1; return; }
  if (o === chairProxy){ if (chairT > 2){ chairT = 0; } return; }
});

/* ---------- tick ---------- */
const clock = new THREE.Clock();
let t = 0;
const cPanelOn = new THREE.Color(0xf6fbf2);
const cPanelOff = new THREE.Color(0x1d2320);
const cSlabEHi = new THREE.Color(0x413d38), cSlabELo = new THREE.Color(0x4c3630);
const cSlabTHi = new THREE.Color(0x3a3835), cSlabTLo = new THREE.Color(0x58423a);
const cSeatHi = new THREE.Color(0x2c3a34), cSeatLo = new THREE.Color(0x8a5a48);
const cBaseHi = new THREE.Color(0x1c2226), cBaseLo = new THREE.Color(0x6b4238);
const cWallHi = new THREE.Color(0xdfe4da);
const cWallLo = new THREE.Color(0x7c463a);
const cLowHi = new THREE.Color(0xb9c4b2);
const cLowLo = new THREE.Color(0x6d3e33);
const cCarpHi = new THREE.Color(0x7fa88c);
const cCarpLo = new THREE.Color(0x7d4c3c);
const cCarpDkHi = new THREE.Color(0x6e967c);
const cCarpDkLo = new THREE.Color(0x6e4236);
const tmpC3 = new THREE.Color();

function tick(){
  requestAnimationFrame(tick);
  const rawDt = Math.min(clock.getDelta(), 1.0);
  t += rawDt;

  lightsBlend += (lightsOn - lightsBlend) * Math.min(1, rawDt*3.2);
  doorBlend += (doorOpen - doorBlend) * Math.min(1, rawDt*2.6);

  /* lights: panels + hum flicker vs red emergency */
  const hum = 1 + Math.sin(t*40)*0.012 + Math.sin(t*13)*0.02;
  for (const pm of panelMats) pm.color.copy(tmpC3.copy(cPanelOff).lerp(cPanelOn, lightsBlend * hum));
  for (const pl of panelLights) pl.intensity = lightsBlend * 0.85 * hum;
  hemi.intensity = 0.42 + lightsBlend * 0.51;
  key.intensity = 0.18 + lightsBlend * 0.92;
  redL.intensity = (1 - lightsBlend) * 3.8;
  redR.intensity = (1 - lightsBlend) * 3.8;
  redLow.intensity = (1 - lightsBlend) * 2.4;
  redR2.intensity = (1 - lightsBlend) * 2.6;
  redLow2.intensity = (1 - lightsBlend) * 2.0;
  beaconMat.emissiveIntensity = (1 - lightsBlend) * 2.2;
  for (const wm of redWashMats) wm.opacity = (1 - lightsBlend) * 0.28;
  signMat.emissiveIntensity = 0.5 + (1 - lightsBlend) * 1.4;
  MAT.chairSeat.color.copy(tmpC3.copy(cSeatHi).lerp(cSeatLo, 1 - lightsBlend));
  MAT.chairBase.color.copy(tmpC3.copy(cBaseHi).lerp(cBaseLo, 1 - lightsBlend));
  MAT.slabEdge.color.copy(tmpC3.copy(cSlabEHi).lerp(cSlabELo, 1 - lightsBlend));
  MAT.slabTop.color.copy(tmpC3.copy(cSlabTHi).lerp(cSlabTLo, 1 - lightsBlend));
  MAT.wall.color.copy(tmpC3.copy(cWallLo).lerp(cWallHi, lightsBlend));
  MAT.wallLow.color.copy(tmpC3.copy(cLowLo).lerp(cLowHi, lightsBlend));
  MAT.carpet.color.copy(tmpC3.copy(cCarpLo).lerp(cCarpHi, lightsBlend));
  MAT.carpetDk.color.copy(tmpC3.copy(cCarpDkLo).lerp(cCarpDkHi, lightsBlend));

  /* door A slides into its pocket */
  doorA.leaf.position.x = -doorBlend * 0.68;
  voidAMat.color.copy(cVoidK).lerp(cLitRoom, doorBlend);
  deepGlow.material.opacity = doorBlend * 0.9;
  glimpseFar.material.opacity = doorBlend * 0.8;
  glimpseLamp.material.opacity = doorBlend * 0.9;
  spillMat.opacity = doorBlend * 0.45;
  doorLight.intensity = doorBlend * 1.4;

  /* chair roll */
  if (chairT < 2.4){
    chairT += rawDt;
    const k = Math.min(1, chairT/2.2);
    const ease = 1 - Math.pow(1-k, 2.2);
    chairG.position.x = chairStart.x - ease * 2.6;
    chairG.position.z = chairStart.z - ease * 0.5;
    chairG.rotation.y = -0.6 + Math.sin(chairT*6) * 0.5 * (1-k);
    chairProxy.position.copy(chairG.position); chairProxy.position.y = 0.55;
  }

  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});

/* ---------- loader ---------- */
let firstFrames = 0;
(function waitForFrames(){
  requestAnimationFrame(waitForFrames);
  if (++firstFrames > 8){
    document.getElementById('loader').classList.add('done');
    document.body.classList.add('ready');
  }
})();
</script>
<script>
/* tv-audio v1: procedural ambience + tap sfx. All sounds synthesized, no assets. */
(() => {
  const CFG = {"amb": ["hum", "room"]};
  const KEY = "tvmini-muted";
  let ctx = null, master = null, analyser = null, NOISE = null, started = false;
  let muted = false;
  try { muted = localStorage.getItem(KEY) === "1"; } catch (e) {}

  const btn = document.createElement("button");
  btn.type = "button";
  btn.setAttribute("aria-label", "Toggle sound");
  btn.style.cssText = "position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(12,14,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.8;transition:opacity .3s";
  const ICON_ON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  const paint = () => { btn.innerHTML = muted ? ICON_OFF : ICON_ON; btn.style.opacity = muted ? ".45" : ".8"; };
  paint();
  document.body.appendChild(btn);

  function ensureCtx(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    master.connect(analyser); analyser.connect(ctx.destination);
    NOISE = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noiseLoop(){ const s = ctx.createBufferSource(); s.buffer = NOISE; s.loop = true; s.start(); return s; }
  function filt(type, f, q){ const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gn(v){ const n = ctx.createGain(); n.gain.value = v; return n; }
  function lfo(freq, amt, param){ const o = ctx.createOscillator(); o.frequency.value = freq; const lg = gn(amt); o.connect(lg); lg.connect(param); o.start(); }
  function hum(f, v){ const o = ctx.createOscillator(); o.frequency.value = f; const g2 = gn(v); o.connect(g2); g2.connect(master); o.start(); }
  function every(minS, maxS, fn){ (function loop(){ if (ctx) fn(); setTimeout(loop, (minS + Math.random() * (maxS - minS)) * 1000); })(); }
  function ping(type, f0, f1, dur, vol){
    const o = ctx.createOscillator(); o.type = type; const g2 = gn(0);
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    o.connect(g2); g2.connect(master);
    g2.gain.setValueAtTime(0, ctx.currentTime);
    g2.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  function shot(dur){
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    const g2 = gn(0); s.connect(g2);
    s.start(); s.stop(ctx.currentTime + dur);
    return g2;
  }
  function echo(dt, fbv, wetv){
    const dl = ctx.createDelay(1); dl.delayTime.value = dt;
    const fb = gn(fbv); dl.connect(fb); fb.connect(dl);
    const wet = gn(wetv); dl.connect(wet); wet.connect(master);
    return dl;
  }

  const R = {
    wind(){ const bp = filt("bandpass", 480, 0.5), g2 = gn(0.09); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.07, 0.045, g2.gain); lfo(0.13, 170, bp.frequency); },
    coldwind(){ const bp = filt("bandpass", 830, 0.7), g2 = gn(0.065); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.09, 0.04, g2.gain); lfo(0.21, 250, bp.frequency); hum(52, 0.026); },
    crackle(){ every(0.05, 0.3, () => { const hp = filt("highpass", 1900), g2 = shot(0.05); g2.connect(hp); hp.connect(master); g2.gain.setValueAtTime(0.015 + Math.random() * 0.045, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.05); }); hum(62, 0.011); },
    murmur(){ const bp = filt("bandpass", 380, 1.1), g2 = gn(0.045); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); every(0.8, 2.4, () => bp.frequency.setTargetAtTime(250 + Math.random() * 380, ctx.currentTime, 0.4)); },
    clink(){ every(4, 9, () => ping("sine", 2000 + Math.random() * 400, 0, 0.16, 0.028)); },
    room(){ const lp = filt("lowpass", 220), g2 = gn(0.02); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); hum(58, 0.009); },
    hum(){ hum(120, 0.011); hum(240, 0.005); const bp = filt("bandpass", 1150, 3), g2 = gn(0.004); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); },
    humsoft(){ hum(100, 0.007); },
    plink(){ const dl = echo(0.42, 0.3, 0.4); every(4.5, 9, () => { const f = [660, 587, 494, 440, 392][Math.floor(Math.random() * 5)]; const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; const g2 = gn(0); o.connect(g2); g2.connect(master); g2.connect(dl); g2.gain.setValueAtTime(0.04, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 1.4); o.start(); o.stop(ctx.currentTime + 1.5); }); },
    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
    const hp = filt("highpass", 2600), g2 = shot(0.02);
    g2.connect(hp); hp.connect(master);
    g2.gain.setValueAtTime(0.05, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.02);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
</script>
