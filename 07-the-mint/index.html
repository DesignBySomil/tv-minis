<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Mint - a tiny scene inspired by Money Heist</title>
<meta name="theme-color" content="#141210">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#141210}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3ead8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(10,8,6,.44) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#141210;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#e0c890;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#38301e;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#e0c890;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(10,8,6,.95),0 2px 8px rgba(10,8,6,.8),0 4px 22px rgba(10,8,6,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#e8dcc0;margin-top:3px;text-shadow:0 1px 2px rgba(10,8,6,.95),0 2px 6px rgba(10,8,6,.75),0 3px 14px rgba(10,8,6,.5)}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#f2ecd8;background:rgba(20,16,12,.55);border:1px solid rgba(240,228,200,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>The Mint</h1><p>a tiny scene inspired by Money Heist</p></div>
<div id="hint">vault &nbsp;&middot;&nbsp; press &nbsp;&middot;&nbsp; clock &nbsp;&middot;&nbsp; cash</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   THE MINT - a printing hall mid-heist.
   A huge circular vault door, a banknote press, pallets of
   cash bricks and loose bills everywhere. All procedural.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1814);
scene.fog = new THREE.FogExp2(0x121010, 0.004);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 1.15, -0.3);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.4, -1.1, -3.4), new THREE.Vector3(4.4, 0.2, 4.2)),
  new THREE.Box3(new THREE.Vector3(-4.2, 0, -3.2), new THREE.Vector3(4.2, 3.9, 4.0)),
];
const FIT_BOXES_PORTRAIT = [
  new THREE.Box3(new THREE.Vector3(-3.0, -1.1, -3.4), new THREE.Vector3(3.8, 0.2, 4.2)),
  new THREE.Box3(new THREE.Vector3(-2.9, 0, -3.2), new THREE.Vector3(3.7, 3.9, 4.0)),
];
let FIT_CORNERS = [];
function setFitCorners(boxes){
  FIT_CORNERS = [];
  for (const b of boxes)
    for (const x of [b.min.x, b.max.x])
      for (const y of [b.min.y, b.max.y])
        for (const z of [b.min.z, b.max.z])
          FIT_CORNERS.push(new THREE.Vector3(x, y, z));
}
setFitCorners(FIT_BOXES);
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}

/* shift camera+orbit-target in the screen plane so the projected model
   bounding box lands at viewport centre (small lift for the hint pill) */
function centerProjectedModel(){
  for (let pass = 0; pass < 2; pass++){
    camera.updateMatrixWorld();
    const p = new THREE.Vector3();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const c of FIT_CORNERS){
      p.copy(c).project(camera);
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const dist = camera.position.distanceTo(controls.target);
    const halfH = Math.tan(camera.fov * Math.PI / 360) * dist;
    const halfW = halfH * camera.aspect;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    controls.target.addScaledVector(right, cx * halfW).addScaledVector(up, (cy - 0.05) * halfH);
    camera.lookAt(controls.target);
  }
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8){ dir.set(0.34, 0.44, 0.82); setFitCorners(FIT_BOXES_PORTRAIT); }
  else { dir.set(0.5, 0.5, 0.7); setFitCorners(FIT_BOXES); }
  dir.normalize();
  let lo = 4, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi);
  camera.lookAt(controls.target);
  centerProjectedModel();
}
camera.position.set(4.6, 4.4, 6.4);
frameForViewport();

const rand = (a,b)=>a+Math.random()*(b-a);
function M(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.92, metalness:0.0}, opts)); }
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function rbox(w,h,d,r,mat){ const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(rt,rb,h,mat,seg=12){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function sph(r,mat,w=10,h=8){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,w,h),mat); m.castShadow=true; m.receiveShadow=true; return m; }

/* ---------- cutaway base: concrete slab + foundation strata ---------- */
const GROUND = 0;
function chamferSlab(w,h,d,cut,c,cy){
  const hw=w/2, hd=d/2;
  const sh=new THREE.Shape();
  sh.moveTo(-hw,-hd); sh.lineTo(hw,-hd);
  sh.lineTo(hw,hd-cut); sh.lineTo(hw-cut,hd); sh.lineTo(-hw+cut,hd); sh.lineTo(-hw,hd-cut);
  sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});
  g.rotateX(Math.PI/2);
  const m=new THREE.Mesh(g, M(c,{roughness:0.98}));
  m.castShadow=true; m.receiveShadow=true;
  m.position.set(0, cy+h/2, 0.3); scene.add(m);
  return m;
}
{
  const strata = [ [9.4,0.34,8.0,0x4a3c30], [9.0,0.3,7.7,0x5c4c3c], [8.8,0.28,7.5,0x6e5c48] ];
  let y = -0.28;
  for (const [w,h,d,c] of strata){
    chamferSlab(w,h,d,1.6,c,y); y += h;
  }
}
const FLOOR_W = 8.8, FLOOR_D = 7.4;
{
  const slab = chamferSlab(FLOOR_W,0.18,FLOOR_D,1.5,0x8a8078,-0.09+0.28);
  // expansion-joint grooves
  const gm = M(0x6e665e,{roughness:1});
  for (let i=-3;i<=3;i++){
    const g = box(0.02,0.006,FLOOR_D-0.2,gm); g.position.set(i*1.25,0.285,0.3); g.castShadow=false; scene.add(g);
  }
  for (let i=0;i<5;i++){
    const g = box(FLOOR_W-0.2,0.006,0.02,gm); g.position.set(0,0.285,-2.6+i*1.45); g.castShadow=false; scene.add(g);
  }
  // worn paint guide lines
  const ym = M(0xc8a23a,{roughness:0.9});
  const l1 = box(2.6,0.008,0.07,ym); l1.position.set(1.6,0.29,1.1); l1.castShadow=false; scene.add(l1);
  const l2 = box(0.07,0.008,2.2,ym); l2.position.set(2.9,0.29,0.1); l2.castShadow=false; scene.add(l2);
}

/* ---------- walls: back wall with vault + clerestory, left return ---------- */
const WALL_H = 3.55, WALL_T = 0.22, WALL_Z = -2.85;
const wallM = M(0x9a8f80,{roughness:0.95});
const wallM2 = M(0x8d8274,{roughness:0.95});
function wallPiece(w,h,x,y,z,mat=wallM){ const m=box(w,h,WALL_T,mat); m.position.set(x,y,z); scene.add(m); return m; }
const VAULT_X = -1.55, VAULT_Y = 1.5, VAULT_R = 1.02;
// back wall assembled around circular vault opening + 3 clerestory slots
wallPiece(2.05, WALL_H, -3.375, WALL_H/2, WALL_Z);                 // left of vault
wallPiece(1.5, VAULT_Y-VAULT_R*0.62, VAULT_X, (VAULT_Y-VAULT_R*0.62)/2, WALL_Z); // under vault lintel fill
wallPiece(1.5, WALL_H-(VAULT_Y+VAULT_R*0.72), VAULT_X, (WALL_H+(VAULT_Y+VAULT_R*0.72))/2, WALL_Z); // above vault
// right section with clerestory slots (x from -0.4 to 4.4)
wallPiece(4.8, 2.2, 2.0, 1.1, WALL_Z);                             // right section up to slots
wallPiece(4.8, WALL_H-3.0, 2.0, (WALL_H+3.0)/2, WALL_Z);           // right section above slots
for (const sx of [0.6, 2.0, 3.4]){                                 // slot dividers
  wallPiece(0.9, 0.8, sx-0.65, 2.6, WALL_Z);
}
// left return wall
{
  const rw = box(WALL_T, WALL_H, 6.4, wallM2); rw.position.set(-4.4, WALL_H/2, 0.1); scene.add(rw);
  const cap = box(0.34, 0.1, 6.5, new THREE.MeshBasicMaterial({color:0x241e18})); cap.position.set(-4.4, WALL_H+0.05, 0.1); scene.add(cap);
}
// dark cap rails on back wall (unlit, prevents lit-top sliver)
{
  const cap = box(8.9, 0.1, 0.34, new THREE.MeshBasicMaterial({color:0x241e18})); cap.position.set(0, WALL_H+0.05, WALL_Z); scene.add(cap);
}
// skirting
{ const sk = box(8.8,0.12,0.05,M(0x564c40)); sk.position.set(0,0.34,WALL_Z+0.13); scene.add(sk); }

/* ---------- sky stack behind wall (z gap 0.15 to kill slivers) ---------- */
const skyBands = [];
{
  const cols = [0x9fb8d8, 0xc9d4de, 0xe6ddc8];
  for (let i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.1), new THREE.MeshBasicMaterial({color:cols[i]}));
    b.position.set(2.0, 0.9 + i*1.0, WALL_Z - 0.15);
    scene.add(b); skyBands.push(b);
  }
}
// stars + moon for night
const starPts = (()=>{
  const g = new THREE.BufferGeometry(); const n=90; const pos=new Float32Array(n*3);
  for (let i=0;i<n;i++){ pos[i*3]=rand(-0.3,4.3); pos[i*3+1]=rand(1.2,3.4); pos[i*3+2]=WALL_Z-0.14; }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({color:0xd8e2f8, size:0.035, transparent:true, opacity:0});
  const p = new THREE.Points(g,m); scene.add(p); return p;
})();
const moonMesh = (()=>{
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.34, 24), new THREE.MeshBasicMaterial({color:0xe8ecf4, transparent:true, opacity:0}));
  m.position.set(3.3, 2.75, WALL_Z-0.13); scene.add(m); return m;
})();

/* ---------- THE VAULT DOOR (tap target 1) ---------- */
const vaultGroup = new THREE.Group(); scene.add(vaultGroup);
const steelM = M(0x8b939c,{roughness:0.45, metalness:0.75});
const steelDark = M(0x5d646c,{roughness:0.5, metalness:0.7});
let vaultDoor, vaultWheel, vaultGlow, vaultGlowLight;
{
  // frame ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(VAULT_R+0.1, 0.14, 12, 40), steelDark);
  ring.position.set(VAULT_X, VAULT_Y, WALL_Z+0.12); ring.castShadow=true; vaultGroup.add(ring);
  // bolt studs around ring
  for (let i=0;i<10;i++){
    const a = i/10*Math.PI*2;
    const b = cyl(0.05,0.05,0.1,steelDark,8);
    b.position.set(VAULT_X+Math.cos(a)*(VAULT_R+0.1), VAULT_Y+Math.sin(a)*(VAULT_R+0.1), WALL_Z+0.14);
    b.rotation.x = Math.PI/2; vaultGroup.add(b);
  }
  // inner glow disc (revealed when open)
  vaultGlow = new THREE.Mesh(new THREE.CircleGeometry(VAULT_R, 32),
    new THREE.MeshBasicMaterial({color:0xffd888, transparent:true, opacity:0}));
  vaultGlow.position.set(VAULT_X, VAULT_Y, WALL_Z+0.06); vaultGroup.add(vaultGlow);
  vaultGlowLight = new THREE.PointLight(0xffc866, 0, 4.5, 1.6);
  vaultGlowLight.position.set(VAULT_X, VAULT_Y, WALL_Z+0.9); vaultGroup.add(vaultGlowLight);
  // door: pivots on right edge so it swings open
  const doorPivot = new THREE.Group();
  doorPivot.position.set(VAULT_X + VAULT_R*0.92, VAULT_Y, WALL_Z+0.2);
  vaultGroup.add(doorPivot);
  vaultDoor = new THREE.Group(); doorPivot.add(vaultDoor);
  const disc = cyl(VAULT_R, VAULT_R, 0.2, steelM, 36);
  disc.rotation.x = Math.PI/2; disc.position.set(-VAULT_R*0.92, 0, 0); vaultDoor.add(disc);
  const inner = cyl(VAULT_R*0.78, VAULT_R*0.78, 0.24, steelDark, 32);
  inner.rotation.x = Math.PI/2; inner.position.set(-VAULT_R*0.92, 0, 0.02); vaultDoor.add(inner);
  // spoke wheel
  vaultWheel = new THREE.Group(); vaultWheel.position.set(-VAULT_R*0.92, 0, 0.16); vaultDoor.add(vaultWheel);
  const wring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.045, 10, 28), steelDark);
  wring.castShadow=true; vaultWheel.add(wring);
  for (let i=0;i<3;i++){
    const sp = box(0.62,0.05,0.05,steelDark); sp.rotation.z = i*Math.PI/3; vaultWheel.add(sp);
  }
  const hub = cyl(0.09,0.09,0.12,steelM,10); hub.rotation.x=Math.PI/2; vaultWheel.add(hub);
  // locking bars on door edge
  for (const sy of [-0.55, 0.55]){
    const bar = box(0.12,0.3,0.1,steelDark); bar.position.set(-VAULT_R*0.92-0.85, sy, 0.02); vaultDoor.add(bar);
  }
  vaultDoor.userData.pivot = doorPivot;
}

/* ---------- THE PRESS (tap target 2) ---------- */
const pressGroup = new THREE.Group(); pressGroup.position.set(1.7, 0.28, -0.7); scene.add(pressGroup);
const pressDrums = [];
let pressSheets;
{
  const bodyM = M(0x3f6a52,{roughness:0.55, metalness:0.35});   // deep green enamel
  const darkM = M(0x2c2f2c,{roughness:0.6, metalness:0.5});
  const base = box(2.3,0.5,1.2,darkM); base.position.set(0,0.25,0); pressGroup.add(base);
  const frame = box(2.1,0.85,0.95,bodyM); frame.position.set(0,0.92,-0.1); pressGroup.add(frame);
  // two drums
  for (const [dy,r] of [[1.15,0.34],[0.72,0.28]]){
    const d = cyl(r,r,1.7,steelM,20); d.rotation.z = Math.PI/2; d.position.set(0,dy,-0.12); pressGroup.add(d);
    pressDrums.push(d);
    for (const ex of [-0.88,0.88]){
      const cap = cyl(r*0.4,r*0.4,0.1,steelDark,12); cap.rotation.z=Math.PI/2; cap.position.set(ex,dy,-0.12); pressGroup.add(cap);
    }
  }
  // top roller + feed table
  const top = cyl(0.14,0.14,1.7,darkM,14); top.rotation.z=Math.PI/2; top.position.set(0,1.5,-0.12); pressGroup.add(top); pressDrums.push(top);
  const feed = box(1.7,0.06,0.7,M(0x565048,{roughness:0.7})); feed.position.set(0,1.02,-0.75); feed.rotation.x=0.18; pressGroup.add(feed);
  // conveyor out front with banknote sheets
  const conv = box(1.8,0.1,1.1,darkM); conv.position.set(0,0.62,0.85); pressGroup.add(conv);
  pressSheets = new THREE.Group(); pressGroup.add(pressSheets);
  const sheetM = M(0xb9c9a8,{roughness:0.85});
  for (let i=0;i<4;i++){
    const g = new THREE.Group(); g.position.set(0,0,0.45+i*0.28); pressSheets.add(g);
    const sh = box(0.62,0.015,0.4,sheetM); sh.castShadow=false;
    sh.position.set(0,0.685,0); g.add(sh);
    // printed blocks on each sheet
    for (let bxi=0;bxi<3;bxi++) for (let bzi=0;bzi<2;bzi++){
      const cell = box(0.16,0.006,0.15,M(0x7fa06a,{roughness:0.9})); cell.castShadow=false;
      cell.position.set(-0.19+bxi*0.19, 0.695, -0.08+bzi*0.17); g.add(cell);
    }
  }
  // side reel of paper
  const reel = cyl(0.3,0.3,0.5,M(0xd8d2c2,{roughness:0.9}),18); reel.rotation.z=Math.PI/2; reel.position.set(-0.6,1.35,-0.65); pressGroup.add(reel); pressDrums.push(reel);
  // control box with a red button + lever
  const cb = box(0.3,0.4,0.18,bodyM); cb.position.set(1.0,1.0,0.35); pressGroup.add(cb);
  const btn = sph(0.05,M(0xc23a2e,{roughness:0.4, emissive:0x661208, emissiveIntensity:0.6}),10,8); btn.position.set(1.0,1.16,0.44); pressGroup.add(btn);
  const runLEDMat = new THREE.MeshBasicMaterial({ color:0x571a12 });
  const runLED = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.05,0.03), runLEDMat);
  runLED.position.set(0.88,1.12,0.45); pressGroup.add(runLED);
  const beaconMat = new THREE.MeshStandardMaterial({ color:0xd8a23a, emissive:0xd88a20, emissiveIntensity:0.15, roughness:0.4 });
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10), beaconMat);
  beacon.position.set(0.62,1.62,-0.12); pressGroup.add(beacon);
  const beaconCage = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.1,0.04), darkM);
  beaconCage.position.set(0.62,1.5,-0.12); pressGroup.add(beaconCage);
  const beaconLight = new THREE.PointLight(0xffb040, 0, 3.2);
  beaconLight.position.set(0.62,1.75,-0.12); pressGroup.add(beaconLight);
  const pileMat = M(0xd8d2c2,{roughness:0.9});

function mixStates(p,n,t){
  const mixC=(a,b)=>new THREE.Color(a).lerp(new THREE.Color(b),t).getHex();
  const mixN=(a,b)=>a+(b-a)*t;
  return {
    sky:[0,1,2].map(i=>mixC(p.sky[i],n.sky[i])),
    hemi:[mixC(p.hemi[0],n.hemi[0]), mixC(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
    sunC:mixC(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI), moonI:mixN(p.moonI,n.moonI),
    fillI:mixN(p.fillI,n.fillI), exp:mixN(p.exp,n.exp), stars:mixN(p.stars,n.stars),
    moon:mixN(p.moon,n.moon), lamp:mixN(p.lamp,n.lamp), dust:mixN(p.dust,n.dust),
  };
}
function cycleState(){
  const from = blend.t >= 1 ? STATES[stateIdx] : mixStates(blend.from, blend.to, blend.t);
  stateIdx = (stateIdx+1) % STATES.length;
  blend = { t:0, from, to:STATES[stateIdx] };
}

  if (nowUp - lastUpAt < 150) return;
  lastUpAt = nowUp;
  if (nowUp-downAt > 350) return;
  if (Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]) > 8) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);

const clock = new THREE.Clock();
let elapsed = 0;
applyState(STATES[0]);
function tick(){
  requestAnimationFrame(tick);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  elapsed += dt;

  if (blend.t < 1){
    blend.t = Math.min(1, blend.t + rawDt/1.6);
    applyState(mixStates(blend.from, blend.to, blend.t));
  }

  // vault swing + wheel spin
  if (vaultAnim >= 0){
    vaultAnim += dt;
    const k = Math.min(vaultAnim/1.4, 1);
    const e = 1-Math.pow(1-k,3);
    const target = vaultOpen ? 1.85 : 0;
    const startA = vaultDoor.userData.pivot.rotation.y;
    vaultDoor.userData.pivot.rotation.y += (target - startA)*Math.min(1,dt*4);
    vaultWheel.rotation.z += (vaultOpen?1:-1)*dt*7*(1-k+0.2);
    vaultGlow.material.opacity = vaultOpen ? e*0.95 : Math.max(0, 1-k)*0.95*vaultGlow.material.opacity;
    vaultGlowLight.intensity = vaultOpen ? e*1.6 : Math.max(0, vaultGlowLight.intensity - dt*3);
    if (k>=1 && !vaultOpen){ vaultGlow.material.opacity = 0; vaultGlowLight.intensity = 0; }
    if (k>=1) vaultAnim = -1;
  }

  // press running
  if (pressOn){
    for (const d of pressDrums) d.rotation.x += dt*4;
    pressSheetOff = (pressSheetOff + dt*0.45) % 0.28;
    pressSheets.children.forEach((g,i)=>{ g.position.z = 0.17 + i*0.28 + pressSheetOff; });
  }
  {
    const pb = window.__pressBits;
    if (pb){
      pb.runLEDMat.color.set(pressOn ? 0x3aff7a : 0x571a12);
      pb.beaconMat.emissiveIntensity = pressOn ? 1.0+Math.sin(elapsed*9)*0.7 : 0.15;
      pb.beaconLight.intensity = pressOn ? 1.1+Math.sin(elapsed*9)*0.6 : 0;
      pileScale += ((pressOn?1:0)-pileScale)*Math.min(1,rawDt*3);
      pb.outPile.visible = pileScale>0.06; pb.outPileStripe.visible = pileScale>0.5;
      pb.outPile.scale.y = Math.max(0.06,pileScale);
      pb.outPile.position.y = 0.55+0.13*Math.max(0.06,pileScale);
      pb.outPileStripe.position.y = 0.57+0.13*Math.max(0.06,pileScale);
    }
  }

  // clock hands spin on time change
  if (clockSpin >= 0){
    clockSpin += dt;
    const k = Math.min(clockSpin/1.2, 1);
    clockHands[0].rotation.z += dt*4*Math.PI*(1-k*0.5);
    clockHands[1].rotation.z += dt*2*Math.PI*(1-k*0.5);
    if (k>=1) clockSpin = -1;
  }

  // cash top-brick flip
  if (cashAnim >= 0){
    cashAnim += dt;
    const k = Math.min(cashAnim/0.5, 1);
    const dip = Math.sin(k*Math.PI);
    cashTops.forEach((b,i)=>{ b.position.y = b.userData.baseY + dip*0.16; b.rotation.z = dip*0.35*((i%2)?1:-1); });
    if (k>=1){ cashAnim=-1; cashTops.forEach(b=>{ b.rotation.z=0; b.position.y=b.userData.baseY; }); }
  }

  // burst bills physics
  for (const b of burstBills){
    if (b.t < 0) continue;
    b.t += dt;
    b.vy -= dt*2.6;
    b.m.position.x += b.vx*dt; b.m.position.y += b.vy*dt; b.m.position.z += b.vz*dt;
    b.m.rotation.x += dt*(2+b.seed*0.4); b.m.rotation.z += dt*(1.5+b.seed*0.3);
    if (b.m.position.y <= 0.3 && b.vy < 0){
      b.m.position.y = 0.3; b.vy = 0; b.vx *= 0.4; b.vz *= 0.4;
      b.m.rotation.x = -Math.PI/2 + Math.sin(b.seed)*0.2;
      if (b.t > 2.2){ b.t = -1; b.m.visible = false; }
    }
  }

  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i=0;i<DUST_N;i++){
    dp[i*3+1] += dt*0.06; dp[i*3] += Math.sin(elapsed*0.5+i)*dt*0.02;
    if (dp[i*3+1] > 3.1) dp[i*3+1] = 0.3;
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}

  btn.style.cssText = "position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(12,14,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.8;transition:opacity .3s";
  const ICON_ON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_OFF = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8ecf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  const paint = () => { btn.innerHTML = muted ? ICON_OFF : ICON_ON; btn.style.opacity = muted ? ".45" : ".8"; };
  paint();
  document.body.appendChild(btn);

  function ensureCtx(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    master.connect(analyser); analyser.connect(ctx.destination);
    NOISE = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noiseLoop(){ const s = ctx.createBufferSource(); s.buffer = NOISE; s.loop = true; s.start(); return s; }
  function filt(type, f, q){ const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; }
  function gn(v){ const n = ctx.createGain(); n.gain.value = v; return n; }
  function lfo(freq, amt, param){ const o = ctx.createOscillator(); o.frequency.value = freq; const lg = gn(amt); o.connect(lg); lg.connect(param); o.start(); }
  function hum(f, v){ const o = ctx.createOscillator(); o.frequency.value = f; const g2 = gn(v); o.connect(g2); g2.connect(master); o.start(); }
  function every(minS, maxS, fn){ (function loop(){ if (ctx) fn(); setTimeout(loop, (minS + Math.random() * (maxS - minS)) * 1000); })(); }
  function ping(type, f0, f1, dur, vol){
    const o = ctx.createOscillator(); o.type = type; const g2 = gn(0);
    o.frequency.setValueAtTime(f0, ctx.currentTime);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, ctx.currentTime + dur);
    o.connect(g2); g2.connect(master);
    g2.gain.setValueAtTime(0, ctx.currentTime);
    g2.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  function shot(dur){
    const s = ctx.createBufferSource(); s.buffer = NOISE;
    const g2 = gn(0); s.connect(g2);
    s.start(); s.stop(ctx.currentTime + dur);
    return g2;
  }
  function echo(dt, fbv, wetv){
    const dl = ctx.createDelay(1); dl.delayTime.value = dt;
    const fb = gn(fbv); dl.connect(fb); fb.connect(dl);
    const wet = gn(wetv); dl.connect(wet); wet.connect(master);
    return dl;
  }

  const R = {
    wind(){ const bp = filt("bandpass", 480, 0.5), g2 = gn(0.09); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.07, 0.045, g2.gain); lfo(0.13, 170, bp.frequency); },
    coldwind(){ const bp = filt("bandpass", 830, 0.7), g2 = gn(0.065); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.09, 0.04, g2.gain); lfo(0.21, 250, bp.frequency); hum(52, 0.026); },
    crackle(){ every(0.05, 0.3, () => { const hp = filt("highpass", 1900), g2 = shot(0.05); g2.connect(hp); hp.connect(master); g2.gain.setValueAtTime(0.015 + Math.random() * 0.045, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.05); }); hum(62, 0.011); },
    murmur(){ const bp = filt("bandpass", 380, 1.1), g2 = gn(0.045); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); every(0.8, 2.4, () => bp.frequency.setTargetAtTime(250 + Math.random() * 380, ctx.currentTime, 0.4)); },
    clink(){ every(4, 9, () => ping("sine", 2000 + Math.random() * 400, 0, 0.16, 0.028)); },
    room(){ const lp = filt("lowpass", 220), g2 = gn(0.02); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); hum(58, 0.009); },
    hum(){ hum(120, 0.011); hum(240, 0.005); const bp = filt("bandpass", 1150, 3), g2 = gn(0.004); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); },
    humsoft(){ hum(100, 0.007); },
    plink(){ const dl = echo(0.42, 0.3, 0.4); every(4.5, 9, () => { const f = [660, 587, 494, 440, 392][Math.floor(Math.random() * 5)]; const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; const g2 = gn(0); o.connect(g2); g2.connect(master); g2.connect(dl); g2.gain.setValueAtTime(0.04, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 1.4); o.start(); o.stop(ctx.currentTime + 1.5); }); },
    leaves(){ const bp = filt("bandpass", 2300, 0.4), g2 = gn(0.028); noiseLoop().connect(bp); bp.connect(g2); g2.connect(master); lfo(0.3, 0.016, g2.gain); lfo(0.09, 550, bp.frequency); },
    birds(){ every(3, 8, () => { const n = 2 + Math.floor(Math.random() * 2); for (let i = 0; i < n; i++) setTimeout(() => { if (ctx) ping("sine", 2700 + Math.random() * 600, 3200, 0.09, 0.03); }, i * 140); }); },
    clank(){ const dl = echo(0.3, 0.35, 0.5); every(7, 15, () => { const bp = filt("bandpass", 820 + Math.random() * 300, 2.5), g2 = shot(0.14); g2.connect(bp); bp.connect(master); bp.connect(dl); g2.gain.setValueAtTime(0.05, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.14); }); },
    cave(){ const lp = filt("lowpass", 280), g2 = gn(0.035); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); const dl = echo(0.32, 0.4, 0.35); every(2, 7, () => { const o = ctx.createOscillator(); o.frequency.setValueAtTime(1000 + Math.random() * 300, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(480, ctx.currentTime + 0.16); const g3 = gn(0); o.connect(g3); g3.connect(master); g3.connect(dl); g3.gain.setValueAtTime(0.055, ctx.currentTime); g3.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.18); o.start(); o.stop(ctx.currentTime + 0.2); }); },
    tick(){ let hi = false; every(1, 1, () => { hi = !hi; ping("square", hi ? 1900 : 1500, 0, 0.03, 0.028); }); },
    clack(){ every(0.5, 2.4, () => { const n = 1 + Math.floor(Math.random() * 5); for (let i = 0; i < n; i++) setTimeout(() => { if (!ctx) return; const bp = filt("bandpass", 2400 + Math.random() * 800, 3), g2 = shot(0.03); g2.connect(bp); bp.connect(master); g2.gain.setValueAtTime(0.028, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.03); }, i * (55 + Math.random() * 60)); }); },
    city(){ const lp = filt("lowpass", 400), g2 = gn(0.045); noiseLoop().connect(lp); lp.connect(g2); g2.connect(master); lfo(0.05, 0.015, g2.gain); hum(55, 0.018); },
    crickets(){ every(1.2, 2.6, () => { for (let i = 0; i < 3; i++) setTimeout(() => { if (ctx) ping("sine", 4300, 4100, 0.05, 0.022); }, i * 75); }); }
  };

  function applyGain(){ if (!ctx || !master) return; master.gain.setTargetAtTime(muted ? 0 : 3.5, ctx.currentTime, 0.5); }
  function unlock(){
    ensureCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started){ started = true; CFG.amb.forEach(n => R[n] && R[n]()); }
    applyGain();
  }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) {}
    paint();
    if (!ctx && !muted) unlock(); else applyGain();
  });

  window.__tvSfx = () => {
    if (!ctx || muted || ctx.state !== "running") return;
    ping("triangle", 640, 300, 0.11, 0.11);
    const hp = filt("highpass", 2600), g2 = shot(0.02);
    g2.connect(hp); hp.connect(master);
    g2.gain.setValueAtTime(0.05, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.0004, ctx.currentTime + 0.02);
  };
  const abuf = new Uint8Array(256);
  function record(sec){
    return new Promise((res) => {
      if (!ctx) return res(null);
      const dest = ctx.createMediaStreamDestination();
      master.connect(dest);
      const rec = new MediaRecorder(dest.stream);
      const chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        master.disconnect(dest);
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        res(btoa(bin));
      };
      rec.start();
      setTimeout(() => rec.stop(), sec * 1000);
    });
  }
  window.__tvAudio = {
    rms(){ if (!analyser) return -1; analyser.getByteTimeDomainData(abuf); let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; } return Math.sqrt(s / abuf.length); },
    state(){ return { started, muted, ctx: ctx ? ctx.state : "none" }; },
    record
  };
})();
</script>
