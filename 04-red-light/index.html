<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Light, Green Light - a tiny scene inspired by Squid Game</title>
<meta name="theme-color" content="#101418">
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#101418}
  body{font-family:Georgia,'Times New Roman',serif;color:#f3e8d8}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(115% 90% at 50% 42%,transparent 55%,rgba(8,10,14,.42) 100%);}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#101418;transition:opacity 1.1s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t{font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#7ab8a8;text-indent:.5em}
  #loader .bar{width:120px;height:1px;background:#223530;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#7ab8a8;animation:sweep 1.2s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  #title{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.4s ease .3s}
  body.ready #title{opacity:1}
  #title h1{font-weight:400;font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;text-shadow:0 1px 2px rgba(8,10,12,.95),0 2px 8px rgba(8,10,12,.8),0 4px 22px rgba(8,10,12,.55)}
  #title p{font-size:12.5px;font-style:italic;color:#d8ece0;margin-top:3px;text-shadow:0 1px 2px rgba(8,10,12,.95),0 2px 6px rgba(8,10,12,.75),0 3px 14px rgba(8,10,12,.5)}
  #hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.14em;color:#e8f0e4;background:rgba(8,14,12,.55);border:1px solid rgba(220,240,228,.18);
    padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px);white-space:nowrap;opacity:0;transition:opacity 1.4s ease .6s}
  body.ready #hint{opacity:1}
  @media (max-width:430px){
    #hint{font-size:10px;letter-spacing:.07em;padding:6px 10px;max-width:92vw;text-align:center}
    #title{left:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="title"><h1>Red Light, Green Light</h1><p>a tiny scene inspired by Squid Game</p></div>
<div id="hint">tap the doll &nbsp;&middot;&nbsp; tap the sky for night</div>
<div id="loader"><div class="t">Crafting miniature</div><div class="bar"><i></i></div></div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   RED LIGHT, GREEN LIGHT - a tactile miniature game yard
   A walled sand yard, a giant doll by a dead tree, little
   runners frozen mid-game. All procedural geometry.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xcfd8d4, 0.006);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.target.set(0, 0.75, -0.4);
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 5;
controls.maxDistance = 60;

const FIT_BOXES = [
  new THREE.Box3(new THREE.Vector3(-4.6, -1.5, -4.3), new THREE.Vector3(4.6, 0.4, 3.4)),
  new THREE.Box3(new THREE.Vector3(-4.4, 0, -4.1), new THREE.Vector3(4.4, 2.9, 3.2)),
];
const FIT_CORNERS = [];
for (const b of FIT_BOXES)
  for (const x of [b.min.x, b.max.x])
    for (const y of [b.min.y, b.max.y])
      for (const z of [b.min.z, b.max.z])
        FIT_CORNERS.push(new THREE.Vector3(x, y, z));
const SAFE = { x: 0.93, yTop: 0.85, yBottom: 0.8 };
function allCornersFit(){
  const p = new THREE.Vector3();
  for (const c of FIT_CORNERS){
    p.copy(c).project(camera);
    if (Math.abs(p.x) > SAFE.x || p.y > SAFE.yTop || p.y < -SAFE.yBottom) return false;
  }
  return true;
}
function frameForViewport(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const dir = camera.position.clone().sub(controls.target);
  if (aspect < 0.8) dir.set(0.5, 0.85, 0.55);
  else dir.set(0.58, 0.5, 0.62);
  dir.normalize();
  let lo = 5, hi = 60;
  for (let i=0;i<28;i++){
    const mid = (lo+hi)/2;
    camera.position.copy(controls.target).addScaledVector(dir, mid);
    camera.lookAt(controls.target); camera.updateMatrixWorld();
    if (allCornersFit()) hi = mid; else lo = mid;
  }
  camera.position.copy(controls.target).addScaledVector(dir, hi);
  camera.lookAt(controls.target);
}
camera.position.set(5.4, 4.4, 5.4);
frameForViewport();

const rand = (a,b)=>a+Math.random()*(b-a);
function M(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.92, metalness:0.0}, opts)); }
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }
function rbox(w,h,d,r,mat){ const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat); m.castShadow=true; m.receiveShadow=true; return m; }

/* ---------- cutaway slab: sand over strata ---------- */
const layers = [
  [0.14, 0xd8bd8f],   // sand
  [0.26, 0xb08a5e],   // packed earth
  [0.28, 0x6a4c34],   // soil
  [0.32, 0x3a2a1c],   // deep
];
let ly = 0;
for (const [h, c] of layers){
  const m = box(9.0, h, 8.0, M(c, {roughness:0.95}));
  m.position.set(0, ly - h/2, -0.4);
  ly -= h;
  scene.add(m);
}
const plinth = box(9.3, 0.18, 8.3, M(0x14181c, {roughness:0.85}));
plinth.position.set(0, ly - 0.09, -0.4);
scene.add(plinth);

/* ---------- sand top with painted lines ---------- */
{
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 896;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#d8bd8f'; ctx.fillRect(0,0,1024,896);
  for (let i=0;i<2600;i++){
    ctx.fillStyle = `rgba(${120+Math.random()*60|0},${90+Math.random()*40|0},${50+Math.random()*30|0},${0.05+Math.random()*0.08})`;
    ctx.fillRect(Math.random()*1024, Math.random()*896, rand(1,3), rand(1,3));
  }
  // faint scuffs
  for (let i=0;i<40;i++){
    ctx.strokeStyle = `rgba(120,92,58,${0.05+Math.random()*0.06})`;
    ctx.lineWidth = rand(2,7);
    ctx.beginPath();
    const x = Math.random()*1024, y = Math.random()*896;
    ctx.moveTo(x,y); ctx.lineTo(x+rand(-90,90), y+rand(-40,40)); ctx.stroke();
  }
  // canvas y maps to world z: z=-4.4 -> y=0, z=3.6 -> y=896
  const zToY = z => (z + 4.4) / 8.0 * 896;
  // finish line (near doll, z=-3.0) and start line (z=2.6)
  ctx.fillStyle = 'rgba(250,250,246,0.92)';
  ctx.fillRect(60, zToY(-3.0)-7, 904, 14);
  ctx.fillRect(60, zToY(2.6)-7, 904, 14);
  // lane ticks
  ctx.fillStyle = 'rgba(250,250,246,0.35)';
  for (let i=1;i<8;i++) ctx.fillRect(i*113.7-3, zToY(-2.9), 6, zToY(2.5)-zToY(-2.9));
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(9.0, 8.0),
    new THREE.MeshStandardMaterial({ map:tex, roughness:0.96 }));
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, 0.005, -0.4);
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ---------- pastel walls (back + sides), pink cap ---------- */
const wallM = M(0xa8cbb6, {roughness:0.9});
const capM  = M(0xe89aae, {roughness:0.85});
{
  const back = box(9.0, 1.5, 0.24, wallM); back.position.set(0, 0.75, -4.28); scene.add(back);
  const backCap = box(9.0, 0.16, 0.3, capM); backCap.position.set(0, 1.58, -4.28); scene.add(backCap);
  for (const sx of [-1,1]){
    const side = box(0.24, 1.1, 5.2, wallM); side.position.set(sx*4.38, 0.55, -1.7); scene.add(side);
    const sideCap = box(0.3, 0.14, 5.2, capM); sideCap.position.set(sx*4.38, 1.17, -1.7); scene.add(sideCap);
    // buttress pillars
    for (const pz of [-3.6, -1.6, 0.4]){
      const p = box(0.4, 1.3, 0.4, wallM); p.position.set(sx*4.38, 0.65, pz); scene.add(p);
      const pc = box(0.46, 0.12, 0.46, capM); pc.position.set(sx*4.38, 1.36, pz); scene.add(pc);
    }
  }
  // wall number plaques (original marks, no logos)
  for (const [nx, nz, txt] of [[-2.8,-4.14,'0'],[2.8,-4.14,'1']]){
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const c2 = cv.getContext('2d');
    c2.fillStyle = '#f2ead8'; c2.beginPath(); c2.arc(64,64,58,0,7); c2.fill();
    c2.fillStyle = '#4a5a52'; c2.font = 'bold 72px Georgia'; c2.textAlign='center'; c2.textBaseline='middle';
    c2.fillText(txt, 64, 68);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
    const pl = new THREE.Mesh(new THREE.CircleGeometry(0.22, 20), new THREE.MeshStandardMaterial({ map:t, roughness:0.8 }));
    pl.position.set(nx, 0.95, nz+0.13); pl.receiveShadow = true; scene.add(pl);
  }
}

/* ---------- signal panel on back wall ---------- */
let sigRed, sigGreen;
{
  const panel = rbox(0.66, 0.34, 0.1, 0.03, M(0x2a3038, {roughness:0.6}));
  panel.position.set(-1.7, 1.05, -4.14); scene.add(panel);
  const mk = (c, x)=>{
    const m = new THREE.Mesh(new THREE.CircleGeometry(0.1, 16),
      new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:0.15, roughness:0.5 }));
    m.position.set(x, 1.05, -4.08); scene.add(m); return m;
  };
  sigGreen = mk(0x3ec86a, -1.86);
  sigRed   = mk(0xe03a3a, -1.54);
}

/* ---------- the doll (original geometry) ---------- */
const doll = new THREE.Group();
const dollHead = new THREE.Group();
let eyeM = null; // assigned inside the doll build block; used by tick()
{
  const skin = M(0xf2dcc8, {roughness:0.7});
  const dressM = M(0xe8853f, {roughness:0.85});
  const hairM = M(0x3a2620, {roughness:0.85});
  // legs + shoes
  for (const sx of [-1,1]){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.34, 8), skin);
    leg.position.set(sx*0.11, 0.17, 0); leg.castShadow = true; doll.add(leg);
    const shoe = rbox(0.12, 0.07, 0.2, 0.02, M(0x2c2c34,{roughness:0.6}));
    shoe.position.set(sx*0.11, 0.035, 0.04); doll.add(shoe);
  }
  // dress: wide cone skirt + torso
  const skirt = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.62, 14), dressM);
  skirt.position.y = 0.62; skirt.castShadow = true; doll.add(skirt);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.34, 10), dressM);
  torso.position.y = 1.05; torso.castShadow = true; doll.add(torso);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.06, 10), M(0xf6f0e2,{roughness:0.8}));
  collar.position.y = 1.23; doll.add(collar);
  // arms out slightly
  for (const sx of [-1,1]){
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.42, 8), dressM);
    arm.position.set(sx*0.24, 1.06, 0.02); arm.rotation.z = sx*-0.5; arm.castShadow = true; doll.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), skin);
    hand.position.set(sx*0.35, 0.88, 0.02); doll.add(hand);
  }
  // head group (rotates)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.23, 18, 14), skin);
  head.castShadow = true; dollHead.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.245, 18, 14, 0, Math.PI*2, 0, Math.PI*0.62), hairM);
  hair.position.y = 0.015; dollHead.add(hair);
  for (const sx of [-1,1]){ // pigtails
    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), hairM);
    tail.position.set(sx*0.24, -0.05, -0.02); dollHead.add(tail);
    const tie = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 6), M(0xe8853f,{roughness:0.7}));
    tie.position.set(sx*0.2, 0.02, -0.01); dollHead.add(tie);
  }
  // eyes + mouth on +z face (large, readable from above)
  eyeM = new THREE.MeshStandardMaterial({ color:0x1a1210, roughness:0.25, emissive:0xff2a2a, emissiveIntensity:0 });
  const dollEyes = [];
  for (const sx of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 8), eyeM);
    eye.position.set(sx*0.082, 0.03, 0.185); dollHead.add(eye); dollEyes.push(eye);
    const lash = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 0.02), M(0x2a1a14,{roughness:0.7}));
    lash.position.set(sx*0.082, 0.075, 0.185); lash.rotation.z = sx*-0.15; dollHead.add(lash);
    const blush = new THREE.Mesh(new THREE.CircleGeometry(0.032, 10),
      new THREE.MeshStandardMaterial({ color:0xf0a08a, roughness:0.9 }));
    blush.position.set(sx*0.13, -0.045, 0.165); blush.rotation.y = sx*0.35; dollHead.add(blush);
  }
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.018, 0.012), M(0xb04a3a,{roughness:0.6}));
  mouth.position.set(0, -0.08, 0.195); dollHead.add(mouth);
  // bangs fringe across the front hairline (strong front cue from above)
  const bangs = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.07, 0.08), hairM);
  bangs.position.set(0, 0.13, 0.15); bangs.rotation.x = 0.35; dollHead.add(bangs);
  dollHead.position.y = 1.5;
  doll.add(dollHead);
  doll.position.set(0, 0, -3.35);
  scene.add(doll);
}

/* ---------- dead tree ---------- */
{
  const barkM = M(0x4a3428, {roughness:1});
  const tree = new THREE.Group();
  const seg = (r1, r2, h, x, y, z, rx, rz)=>{
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, 7), barkM);
    m.position.set(x, y, z); m.rotation.x = rx; m.rotation.z = rz; m.castShadow = true; tree.add(m); return m;
  };
  seg(0.09, 0.14, 1.3, 0, 0.65, 0, 0, 0.06);
  seg(0.05, 0.08, 0.8, 0.28, 1.5, 0.05, 0.15, -0.6);
  seg(0.04, 0.07, 0.7, -0.24, 1.45, -0.05, -0.2, 0.55);
  seg(0.02, 0.045, 0.5, 0.52, 1.9, 0.12, 0.3, -0.9);
  seg(0.015, 0.04, 0.45, -0.45, 1.8, -0.15, -0.35, 0.85);
  seg(0.01, 0.03, 0.4, 0.05, 1.95, -0.1, -0.5, 0.1);
  tree.position.set(1.35, 0, -3.5);
  scene.add(tree);
}

/* ---------- speaker pole ---------- */
{
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 1.9, 8), M(0x5a5f66,{metalness:0.4, roughness:0.5}));
  pole.position.set(-1.5, 0.95, -3.6); pole.castShadow = true; scene.add(pole);
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.24, 10, 1, true), M(0xc8cdd2,{metalness:0.3, roughness:0.5, side:THREE.DoubleSide}));
  horn.position.set(-1.5, 1.85, -3.48); horn.rotation.x = Math.PI/2.4; horn.castShadow = true; scene.add(horn);
}

/* ---------- runners (teal tracksuits, mid-run) ---------- */
const players = [];
function runner(x, z, pose){
  const g = new THREE.Group();
  const suit = M(0x2f8a74, {roughness:0.85});
  const skin = M(0xe8c8a8, {roughness:0.75});
  const stripe = M(0xf0f4ee, {roughness:0.8});
  const torso = rbox(0.16, 0.24, 0.1, 0.03, suit); torso.position.y = 0.32; g.add(torso);
  for (const sx of [-1,1]){
    const st = box(0.02, 0.2, 0.104, stripe); st.position.set(sx*0.082, 0.32, 0); g.add(st);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.028, 0.22, 7), suit);
    leg.position.set(sx*0.05, 0.11, sx*pose*0.05); leg.rotation.x = sx*pose*0.5; leg.castShadow = true; g.add(leg);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.02, 0.18, 7), suit);
    arm.position.set(sx*0.11, 0.33, -sx*pose*0.05); arm.rotation.x = -sx*pose*0.6; arm.castShadow = true; g.add(arm);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), skin);
  head.position.y = 0.52; head.castShadow = true; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.073, 12, 10, 0, Math.PI*2, 0, Math.PI*0.55), M(0x201612,{roughness:0.9}));
  hair.position.y = 0.53; g.add(hair);
  g.position.set(x, 0, z);
  g.rotation.y = rand(-0.15, 0.15);
  scene.add(g);
  players.push({ g, speed: rand(0.16, 0.3), phase: rand(0, 6.28), baseX: x });
}
runner(-2.4, 1.8, 1); runner(-0.9, 0.6, -1); runner(0.7, 1.4, 1);
runner(2.2, 0.2, -1); runner(-1.6, -1.2, 1); runner(1.5, -1.9, -1);

/* ---------- guards by the back wall ---------- */
function guard(x){
  const g = new THREE.Group();
  const suit = M(0xd8587c, {roughness:0.85});
  const torso = rbox(0.2, 0.3, 0.13, 0.03, suit); torso.position.y = 0.4; g.add(torso);
  for (const sx of [-1,1]){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.26, 7), suit);
    leg.position.set(sx*0.06, 0.13, 0); leg.castShadow = true; g.add(leg);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.024, 0.24, 7), suit);
    arm.position.set(sx*0.13, 0.4, 0); arm.castShadow = true; g.add(arm);
  }
  const belt = box(0.21, 0.04, 0.14, M(0xf0f0ea,{roughness:0.7})); belt.position.y = 0.3; g.add(belt);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), M(0x1c1c22,{roughness:0.4}));
  head.position.y = 0.64; head.castShadow = true; g.add(head);
  const mark = new THREE.Mesh(new THREE.CircleGeometry(0.03, 12), M(0xf0f0ea,{roughness:0.6}));
  mark.position.set(0, 0.65, 0.083); g.add(mark);
  g.position.set(x, 0, -3.85);
  scene.add(g);
}
guard(-3.3); guard(3.3);

/* ---------- floodlight poles ---------- */
const floodHeads = [];
const floodSpots = [];
for (const sx of [-1,1]){
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 3.0, 8), M(0x4a5058,{metalness:0.5, roughness:0.45}));
  pole.position.set(sx*3.9, 1.5, -3.7); pole.castShadow = true; scene.add(pole);
  const headB = rbox(0.5, 0.3, 0.12, 0.03, M(0x30353c,{roughness:0.5}));
  headB.position.set(sx*3.9, 3.05, -3.66); headB.rotation.y = sx*-0.4; headB.rotation.x = 0.35;
  scene.add(headB);
  const cells = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.22),
    new THREE.MeshStandardMaterial({ color:0xe8ecf0, emissive:0xfff2d8, emissiveIntensity:0.05, roughness:0.4 }));
  cells.position.set(sx*3.9 - sx*0.045, 3.02, -3.59); cells.rotation.y = sx*-0.4; cells.rotation.x = 0.35;
  scene.add(cells);
  floodHeads.push(cells);
  const sp = new THREE.SpotLight(0xfff2d8, 0, 14, 0.7, 0.5, 1.4);
  sp.position.set(sx*3.9, 3.05, -3.6);
  sp.target.position.set(sx*-1.2, 0, -0.6);
  sp.castShadow = false;
  scene.add(sp); scene.add(sp.target);
  floodSpots.push(sp);
}

/* ---------- dust motes ---------- */
const DUST_N = 70;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N*3);
for (let i=0;i<DUST_N;i++){
  dustPos[i*3] = rand(-4.2, 4.2); dustPos[i*3+1] = rand(0.1, 2.6); dustPos[i*3+2] = rand(-4, 3);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color:0xf0e0c0, size:0.03, transparent:true, opacity:0.4, depthWrite:false });
scene.add(new THREE.Points(dustGeo, dustMat));

/* ---------- sky + stars ---------- */
const skyUniforms = {
  topColor:    { value: new THREE.Color(0x5aa8d8) },
  midColor:    { value: new THREE.Color(0xa8d0e0) },
  bottomColor: { value: new THREE.Color(0xf0e8d0) },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(90, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms: skyUniforms,
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 topColor, midColor, bottomColor; varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 c = h > 0.12
          ? mix(midColor, topColor, smoothstep(0.12, 0.65, h))
          : mix(bottomColor, midColor, smoothstep(-0.25, 0.12, h));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
sky.userData.isSky = true;
scene.add(sky);
const starsGeo = new THREE.BufferGeometry();
{
  const pts = [];
  for(let i=0;i<380;i++){
    const a = rand(0,Math.PI*2), e = rand(0.08, Math.PI/2.2), r = 80;
    pts.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r);
  }
  starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
}
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color:0xcfd8ff, size:0.28, transparent:true, opacity:0 }));
scene.add(stars);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xdcecf4, 0x9a8058, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9ab8d8, 0.4);
fill.position.set(-6, 5, 4);
scene.add(fill);

/* ---------- states ---------- */
const STATES = [
  { name:'day', top:0x5aa8d8, mid:0xa8d0e0, bottom:0xf0e8d0, fog:0xd8dcd0, fogD:0.005,
    hemi:[0xdcecf4, 0x9a8058, 0.85], sunC:0xfff2dc, sunI:2.3, sunPos:[5,8,4],
    fillI:0.4, fillC:0x9ab8d8, exp:1.06, stars:0, flood:0, dust:0.35 },
  { name:'dusk', top:0x3e4278, mid:0xc0788a, bottom:0xe89a62, fog:0x8a5a48, fogD:0.008,
    hemi:[0xffd9b0, 0x7a5a3a, 0.7], sunC:0xffa050, sunI:1.9, sunPos:[6,4,2],
    fillI:0.35, fillC:0x9a8ab8, exp:1.1, stars:0, flood:0.35, dust:0.45 },
  { name:'night', top:0x0a0e26, mid:0x1a2448, bottom:0x2c3058, fog:0x0e1220, fogD:0.011,
    hemi:[0x3e4678, 0x2c241c, 0.55], sunC:0x8a96d8, sunI:0.4, sunPos:[-6,8,-4],
    fillI:0.3, fillC:0x5a64a8, exp:1.03, stars:1, flood:1, dust:0.55 },
];
let stateIdx = 0;
let blend = { t:1, from:STATES[0], to:STATES[0] };
function applyState(s){
  skyUniforms.topColor.value.set(s.top);
  skyUniforms.midColor.value.set(s.mid);
  skyUniforms.bottomColor.value.set(s.bottom);
  scene.fog.color.set(s.fog); scene.fog.density = s.fogD;
  hemi.color.set(s.hemi[0]); hemi.groundColor.set(s.hemi[1]); hemi.intensity = s.hemi[2];
  sun.color.set(s.sunC); sun.intensity = s.sunI; sun.position.set(...s.sunPos);
  fill.intensity = s.fillI; fill.color.set(s.fillC);
  renderer.toneMappingExposure = s.exp;
  stars.material.opacity = s.stars;
  dustMat.opacity = s.dust;
  for (const sp of floodSpots) sp.intensity = s.flood * 90;
  for (const c of floodHeads) c.material.emissiveIntensity = 0.05 + s.flood * 1.6;
}
function mixStates(p, n, t){
  const mixC = (a,b)=>new THREE.Color(a).lerp(new THREE.Color(b), t).getHex();
  const mixN = (a,b)=>a+(b-a)*t;
  return {
    top:mixC(p.top,n.top), mid:mixC(p.mid,n.mid), bottom:mixC(p.bottom,n.bottom),
    fog:mixC(p.fog,n.fog), fogD:mixN(p.fogD,n.fogD),
    hemi:[mixC(p.hemi[0],n.hemi[0]), mixC(p.hemi[1],n.hemi[1]), mixN(p.hemi[2],n.hemi[2])],
    sunC:mixC(p.sunC,n.sunC), sunI:mixN(p.sunI,n.sunI),
    sunPos:[0,1,2].map(i=>mixN(p.sunPos[i],n.sunPos[i])),
    fillI:mixN(p.fillI,n.fillI), fillC:mixC(p.fillC,n.fillC), exp:mixN(p.exp,n.exp),
    stars:mixN(p.stars,n.stars), flood:mixN(p.flood,n.flood), dust:mixN(p.dust,n.dust),
  };
}
function cycleState(){
  const from = blend.t >= 1 ? STATES[stateIdx] : mixStates(blend.from, blend.to, blend.t);
  stateIdx = (stateIdx+1) % STATES.length;
  blend = { t:0, from, to:STATES[stateIdx] };
}

/* ---------- red/green light game ---------- */
let greenLight = true;
let headTurn = 0; // 0 = facing away (toward wall), 1 = facing runners
function toggleLight(){
  greenLight = !greenLight;
  sigGreen.material.emissiveIntensity = greenLight ? 1.4 : 0.15;
  sigRed.material.emissiveIntensity = greenLight ? 0.15 : 1.4;
}
sigGreen.material.emissiveIntensity = 1.4;

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let downAt = 0, downPos = [0,0];
renderer.domElement.addEventListener('pointerdown', e=>{
  downAt = performance.now(); downPos = [e.clientX, e.clientY];
});
let lastUpAt = -999;
renderer.domElement.addEventListener('pointerup', e=>{
  const nowUp = performance.now();
  if (nowUp - lastUpAt < 150) return;
  lastUpAt = nowUp;
  if (nowUp-downAt > 350) return;
  if (Math.hypot(e.clientX-downPos[0], e.clientY-downPos[1]) > 8) return;
  ptr.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const dHit = ray.intersectObjects([doll], true);
  if (dHit.length){ toggleLight(); return; }
  const skyHit = ray.intersectObject(sky);
  if (skyHit.length) cycleState();
});

/* ---------- resize / loop ---------- */
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  frameForViewport();
});
const clock = new THREE.Clock();
let elapsed = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (blend.t < 1){
    blend.t = Math.min(1, blend.t + dt/1.6);
    applyState(mixStates(blend.from, blend.to, blend.t));
  }

  // doll head eases toward its pose: green = turned away, red = watching (tilted up)
  const target = greenLight ? 0 : 1;
  headTurn += (target - headTurn) * Math.min(1, dt*5);
  dollHead.rotation.y = (1 - headTurn) * Math.PI;
  dollHead.rotation.x = -0.3 * headTurn + 0.12 * (1 - headTurn);
  eyeM.emissiveIntensity = headTurn * 0.9;

  // runners creep on green, freeze on red
  for (const p of players){
    if (greenLight){
      p.g.position.z -= p.speed * dt;
      if (p.g.position.z < -2.8) p.g.position.z = 2.55;
      p.g.position.y = Math.abs(Math.sin(elapsed*9 + p.phase)) * 0.03;
      p.g.rotation.z = Math.sin(elapsed*9 + p.phase) * 0.04;
    } else {
      p.g.position.y *= 0.8;
      p.g.rotation.z *= 0.8;
    }
  }

  // dust drift
  const dp = dustGeo.attributes.position.array;
  for (let i=0;i<DUST_N;i++){
    dp[i*3+1] += dt*0.05;
    dp[i*3] += Math.sin(elapsed*0.6 + i)*dt*0.02;
    if (dp[i*3+1] > 2.8) dp[i*3+1] = 0.05;
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
applyState(STATES[stateIdx]);
tick();
setTimeout(()=>{
  document.getElementById('loader').classList.add('done');
  document.body.classList.add('ready');
}, 700);
</script>
</body>
